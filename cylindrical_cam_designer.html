  runValidator(segs, p, pts, compoundInfo) {
    const alerts = [];
    const Rb = p.baseDia / 2;
    const totalAngle = segs.reduce((a, s) => a + s.angle, 0);

    if (Math.abs(totalAngle - 360) > 0.01) {
      alerts.push({
        level: 'E',
        text: this.t('alertSumAngle', { sum: totalAngle.toFixed(1) }),
        suggestion: this.t('sugSumAngle')
      });
    }

    // 压力角超限
    const maxAlpha = pts.reduce((m, pt) => Math.max(m, pt.alphaDeg), 0);
    if (maxAlpha > p.pressAngleLimit) {
      const worst = pts.reduce((m, pt) => pt.alphaDeg > m.alphaDeg ? pt : m, { alphaDeg: 0 });
      alerts.push({
        level: 'E',
        text: this.t('alertAlphaExceed', { max: maxAlpha.toFixed(2), lim: p.pressAngleLimit, phi: worst.phi.toFixed(1) }),
        suggestion: this.t('sugAlphaExceed')
      });
    } else if (maxAlpha > p.pressAngleLimit * 0.85) {
      alerts.push({
        level: 'W',
        text: this.t('alertAlphaNear', { max: maxAlpha.toFixed(2), lim: p.pressAngleLimit }),
        suggestion: this.t('sugAlphaNear')
      });
    }

    // 加速度不得超过 1 g（按各段实际转速换算的 mm/s²）
    const G_MM = 9806.65; // 1 g = 9.80665 m/s² = 9806.65 mm/s²
    let maxAcc = 0, worstAcc = null;
    for (const pt of pts) {
      const aa = Math.abs(pt.a_s || 0);
      if (aa > maxAcc) { maxAcc = aa; worstAcc = pt; }
    }
    if (maxAcc > G_MM) {
      alerts.push({
        level: 'E',
        text: this.t('alertAccG', {
          g: (maxAcc / G_MM).toFixed(2),
          a: (maxAcc / 1000).toFixed(2),
          phi: worstAcc ? worstAcc.phi.toFixed(1) : '—',
          seg: worstAcc && worstAcc.segName ? '，' + worstAcc.segName : ''
        }),
        suggestion: this.t('sugAccG')
      });
    }

    // 曲率半径自交检查（v/a 换算到 mm/rad、mm/rad² 后计算）
    let minRadius = Infinity;
    for (const pt of pts) {
      const vR = pt.vRad, aR = pt.aRad;
      const rho = Math.pow(Rb * Rb + vR * vR, 1.5) / Math.abs(Rb * aR + 1e-12);
      if (rho < minRadius && rho > 0.1) minRadius = rho;
    }
    if (minRadius < p.rollerDia / 2) {
      alerts.push({
        level: 'E',
        text: this.t('alertCurvature', { min: minRadius.toFixed(2), roller: (p.rollerDia / 2).toFixed(2) }),
        suggestion: this.t('sugCurvature')
      });
    }

    // 梯形过渡长度校核（按随动器直径）
    segs.forEach((seg, si) => {
      if (seg.law !== 'trap_cubic' && seg.law !== 'mod_trap') return;
      const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
      if (arc <= 0) return;
      const tr = this.getSegTr(seg, Rb);
      const L = tr * arc;
      const Lmin = p.rollerDia;
      const trMin = Lmin / arc;
      if (trMin >= 0.49) {
        alerts.push({
          level: 'E',
          text: this.t('alertTransImpossible', { seg: si + 1, d: Lmin.toFixed(2), arc: arc.toFixed(2) }),
          suggestion: this.t('sugTransImpossible')
        });
      } else if (L + 1e-6 < Lmin) {
        alerts.push({
          level: 'W',
          text: this.t('alertTransShort', {
            seg: si + 1, l: L.toFixed(2), d: Lmin.toFixed(2),
            cur: (tr * 100).toFixed(1), r: (trMin * 100).toFixed(1)
          }),
          suggestion: this.t('sugTransShort', { r: (trMin * 100).toFixed(1) })
        });
      }
    });

    // 跃度不连续
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1];
      const cur = pts[i];
      if (cur.segIdx !== prev.segIdx) {
        const deltaJ = Math.abs(cur.j - prev.j);
        if (deltaJ > 0.01 && prev.law !== 'dwell' && cur.law !== 'dwell') {
          alerts.push({
            level: 'I',
            text: this.t('alertJerk', {
              phi: prev.phi.toFixed(1),
              prev: prev.j.toFixed(3),
              cur: cur.j.toFixed(3)
            }),
            suggestion: this.t('sugJerk')
          });
        }
      }
    }

    // 首尾闭合
    const s0 = pts[0].s;
    const sEnd = pts[pts.length - 1].s;
    if (Math.abs(s0 - sEnd) > 0.001) {
      alerts.push({
        level: 'E',
        text: this.t('alertCloseMismatch', { s0: s0.toFixed(3), s1: sEnd.toFixed(3) }),
        suggestion: this.t('sugCloseMismatch')
      });
    }

    // 分辨率过低
    if (pts.length < 36) {
      alerts.push({
        level: 'I',
        text: this.t('alertLowRes', { res: p.resolution }),
        suggestion: this.t('sugLowRes')
      });
    }

    // 沟槽轴向越界：模型会被迫平移沟槽，导致实际高度与设定不符
    const pushShift = (gg, prefix) => {
      if (!gg || gg.overflow || Math.abs(gg.shift) < 1e-6) return;
      const lo = Math.max(0, gg.zMin), hi = gg.zMax;
      const wNeed = gg.wNeed.toFixed(1);
      alerts.push({
        level: 'E',
        text: (prefix ? prefix + ' — ' : '') + this.t('alertGrooveShift', {
          ih: this.fmtNum(gg.z0req), shift: Math.abs(gg.shift).toFixed(2),
          min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed
        }),
        impact: this.t('alertGrooveShiftImpact'),
        suggestion: this.t('alertGrooveShiftSug', { min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed })
      });
    };

    // 复合凸轮：层间高度关系（下工作面 vs 下工作面）
    if (compoundInfo) {
      const S = this.state.layerStore;
      const p1 = S[0] && S[0].params;
      const p2 = S[1] && S[1].params;
      const ov = compoundInfo.overflow1 || compoundInfo.overflow2;
      if (ov) {
        alerts.push({
          level: 'E',
          text: this.t('alertGrooveOpenOverflow', ov),
          suggestion: this.t('sugGrooveOpenOverflow', ov)
        });
      }
      if (compoundInfo.hViolation) {
        const rs = compoundInfo.ranges.slice(0, 4)
          .map(r => `${r[0].toFixed(1)}°~${r[1].toFixed(1)}°`).join('、')
          + (compoundInfo.ranges.length > 4 ? '…' : '');
        alerts.push({
          level: 'E',
          text: this.t('alertHeightViolation', { ranges: rs || '—', n: compoundInfo.need.toFixed(2) }),
          impact: this.t('alertHeightViolationImpact'),
          suggestion: this.t('alertHeightViolationSug', {
            a: compoundInfo.h2.toFixed(2), b: compoundInfo.hNeed.toFixed(2)
          })
        });
      }
      if (compoundInfo.fit2 === false) {
        alerts.push({
          level: 'E',
          text: this.t('alertCompoundNoFit', compoundInfo.fitInfo),
          impact: this.t('alertCompoundNoFitImpact'),
          suggestion: this.t('sugCompoundNoFit', compoundInfo.fitInfo)
        });
      }
      if (p2) {
        const R2 = p2.baseDia / 2;
        const d2 = (p2.rollerWidth || 0);
        if (R2 - d2 <= 1) {
          alerts.push({
            level: 'E',
            text: this.t('alertLayer2Deep', { r: R2.toFixed(2), d: d2.toFixed(2) }),
            impact: this.t('alertLayer2DeepImpact'),
            suggestion: this.t('sugLayer2Deep')
          });
        }
      }
      const gg1 = p1 ? this.grooveGeomFor(p1, this.state.ptsByLayer[0], true) : null;
      const gg2 = p2 ? this.grooveGeomFor(p2, this.state.ptsByLayer[1], true) : null;
      if (gg1) pushShift(gg1, this.t('layer1'));
      if (gg2) pushShift(gg2, this.t('layer2'));

      const shiftBad = [gg1, gg2].some(g => g && !g.overflow && Math.abs(g.shift) > 1e-6);
      if (!compoundInfo.hViolation && compoundInfo.fit2 !== false && !shiftBad) {
        alerts.push({
          level: 'I',
          text: this.t('infoCompoundOk', { d: compoundInfo.d2.toFixed(2) }),
          suggestion: this.t('sugCompoundOk')
        });
      }
    } else {
      pushShift(this.grooveGeomFor(p, pts), '');
    }

    this.state.alerts = alerts;
    this.renderAlerts(alerts);
  },

  renderAlerts(alerts) {
    const box = document.getElementById('alertList');
    if (!alerts || alerts.length === 0) {
      box.innerHTML = `<div class="alert alert-i"><span class="level">✓</span><span class="body">${this.t('okNoAlerts')}</span></div>`;
      return;
    }
    box.innerHTML = alerts.slice(0, 20).map(a => {
      const levelCls = a.level === 'E' ? 'alert-e' : a.level === 'W' ? 'alert-w' : 'alert-i';
      const levelLabel = a.level === 'E' ? 'E' : a.level === 'W' ? '!' : 'i';
      const impact = a.impact ? `<span class="impact">${this.t('impactPrefix')}${a.impact}</span>` : '';
      const sug = a.suggestion ? `<span class="suggestion">💡 ${a.suggestion}</span>` : '';
      return `<div class="alert ${levelCls}"><span class="level">${levelLabel}</span><span class="body"><b>${a.text}</b>${impact}${sug}</span></div>`;
    }).join('');
    if (alerts.length > 20) box.innerHTML += `<div class="alert alert-i"><span class="level">i</span><span class="body">${this.t('moreAlerts', { n: alerts.length - 20 })}</span></div>`;
  },

  /* -------- 数据表已移除：逐点数据仅在后台计算，不再渲染表格 -------- */

  /* -------- 可视化切换 -------- */
  switchViz(name, btn) {
    this.state.currentViz = name;
    document.querySelectorAll('.viz-pane').forEach(p => p.classList.toggle('hidden', p.id !== 'viz-' + name));
    document.querySelectorAll('.viz-tab').forEach(t => t.classList.toggle('active', t === btn));
    this.renderAllViz();
  },

  renderAllViz() {
    this.renderLayerUI();
    if (!this.state.points || this.state.points.length === 0) return;
    if (this.state.currentViz === 'curves') this.drawCurves();
    else if (this.state.currentViz === 'flatten') this.drawFlatten();
    else if (this.state.currentViz === 'line3d') this.draw3D();
    else if (this.state.currentViz === 'indic') this.drawIndic();
  },

  /* -------- 运动曲线图 -------- */
  cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  },

  // 按容器宽度自适应画布尺寸（保证在 1920 等宽屏下铺满右栏，不放大模糊）
  fitCanvas(cv, opts) {
    if (!cv) return 900;
    const o = opts || {};
    const wrap = cv.parentElement;
    const avail = Math.floor(((wrap && wrap.clientWidth) || 900) - 10);
    const w = Math.max(o.min || 640, Math.min(avail, o.max || 2600));
    if (cv.width !== w) cv.width = w;
    return w;
  },

  // 将颜色转为指定透明度（用于行背景浅色）
  withAlpha(color, a) {
    const c = (color || '').trim();
    if (c.charAt(0) === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h.split('').map(x => x + x).join('');
      const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
      if (isFinite(r) && isFinite(g) && isFinite(b)) return `rgba(${r},${g},${b},${a})`;
    }
    const m = c.match(/rgba?\(([^)]+)\)/);
    if (m) {
      const s = m[1].split(',').map(x => x.trim());
      return `rgba(${s[0]},${s[1]},${s[2]},${a})`;
    }
    return `rgba(140,150,170,${a})`;
  },

  drawCurves() {
    const cv = document.getElementById('cvCurves');
    if (!cv) return;
    const W = this.fitCanvas(cv, { min: 680, max: 2400 });
    const vis = this.state.visibleRows || {};
    const rowCfg = this._curveRowCfg();
    const nVis = rowCfg.filter(r => vis[r.key] !== false).length || 1;
    const isCompound = this._curveIsCompound();
    // 宽屏行高收紧；同时按窗口高度自适应，尽量一屏显示完 8 行曲线
    const tier = W >= 1500 ? 0 : (W >= 1150 ? 1 : 2);
    const rowWant = isCompound ? [104, 118, 132][tier] : [132, 150, 170][tier];
    const vhAvail = Math.max(420, ((window.innerHeight || 900) - 300));
    const rowMin = isCompound ? 84 : 92;
    const rowH = Math.max(rowMin, Math.min(rowWant, Math.floor((vhAvail - 62) / nVis)));
    const targetH = (isCompound ? 52 : 62) + rowH * nVis;
    if (cv.height !== targetH) cv.height = targetH;
    const H = cv.height;
    const ctx = cv.getContext('2d');
    const visKey = Object.keys(vis).filter(k => vis[k] === false).sort().join(',');
    const key = W + 'x' + H + 'x' + this.state.lang + 'x' + this.state.dataVersion + 'x'
      + visKey + 'x' + (isCompound ? 'CPD' : 'SGL');
    if (!this._curveCache || this._curveCache.key !== key) {
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      this.paintCurves(off.getContext('2d'), W, H);
      this._curveCache = { key, canvas: off };
    }
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(this._curveCache.canvas, 0, 0);
    this.drawProbe(ctx);
  },

  _curveIsCompound() {
    const L0 = this.state.ptsByLayer && this.state.ptsByLayer[0];
    const L1 = this.state.ptsByLayer && this.state.ptsByLayer[1];
    return this.state.camType === 'compound' && L0 && L1 && L0.length && L1.length;
  },

  _curveRowCfg() {
    const t = (k) => this.t(k);
    return [
      { key: 's', label: 's', name: t('legS'), unit: 'mm',  v: '--line-s' },
      { key: 'v_s', label: 'v', name: t('legV'), unit: 'mm/s', v: '--line-v' },
      { key: 'a_s', label: 'a', name: t('legA'), unit: 'mm/s²', v: '--line-a' },
      { key: 'j_s', label: 'j', name: t('legJ'), unit: 'mm/s³', v: '--line-j' },
      { key: 'alphaDeg', label: 'α', name: t('legAlpha'), unit: '°', v: '--line-alpha', nonNeg: true },
      { key: 'forceAxial', label: 'F', name: t('legFaxial'), unit: 'N', v: '--line-force', nonNeg: true, fold: true },
      { key: 'forceN', label: 'N', name: t('legN'), unit: 'N', v: '--line-norm', nonNeg: true, fold: true },
      { key: 'torqueNmm', label: 'T', name: t('legTorque'), unit: 'Nm', v: '--line-torque', foldT: true }
    ];
  },

  // 把底层 pts 原始值（单层或 L0）、上层 L1 值（复合）、以及复合时两层求和扭矩
  // 统一规范化到 row 显示值；torque 行需从 N·mm 转 N·m
  _curveVal(row, pt, ptL1) {
    if (!pt) return NaN;
    if (row.key === 'torqueNmm') {
      const t0 = (pt.torqueNmm || 0) / 1000;
      const t1 = ptL1 ? (ptL1.torqueNmm || 0) / 1000 : 0;
      return t0 + t1;
    }
    return pt[row.key];
  },
  _curveLayerVal(row, pt) {
    if (!pt) return NaN;
    if (row.key === 'torqueNmm') return (pt.torqueNmm || 0) / 1000;
    return pt[row.key];
  },

  paintCurves(ctx, W, H) {
    const pad = { l: 126, r: 22, t: 26, b: 42 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const maxPhi = 360;

    const isCompound = this._curveIsCompound();
    const L0 = this.state.ptsByLayer && this.state.ptsByLayer[0];
    const L1 = this.state.ptsByLayer && this.state.ptsByLayer[1];
    const pts = isCompound ? L0 : this.state.points;
    if (!pts || !pts.length) return;

    const rows = this._curveRowCfg().filter(r => (this.state.visibleRows || {})[r.key] !== false);
    if (rows.length === 0) return;

    const totalWeight = rows.reduce((a, r) => a + (r.weight || 1), 0);
    const unitH = plotH / totalWeight;
    const gridC = this.cssVar('--grid');
    const borderC = this.cssVar('--border');
    const dimC = this.cssVar('--text-dim');
    const mutedC = this.cssVar('--text-muted');
    const layer1Col = '#14568f';
    const layer2Col = '#b33326';

    const xToPx = (phi) => pad.l + (phi / maxPhi) * plotW;

    let rowY = pad.t;
    rows.forEach((row) => {
      const rowH = unitH * (row.weight || 1);
      const y0 = rowY;
      rowY += rowH;
      const y1 = y0 + rowH - 3;

      // 行浅色背景
      ctx.fillStyle = this.withAlpha(this.cssVar(row.v), 0.07);
      ctx.fillRect(0, y0, W, rowH);
      ctx.beginPath(); ctx.strokeStyle = borderC; ctx.lineWidth = 1;
      ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

      // 取值：单层直接 state.points；复合逐点分别 L0 和 L1；torque 行走 _curveVal 求和
      const vals = pts.map((p, i) => {
        const p1 = isCompound ? (L1 && L1[i]) : null;
        return this._curveVal(row, p, p1);
      });
      // 联合值域（复合非 torque 行），用 L0+L1 的值合起来算 min/max
      let joinedVals = vals;
      if (isCompound && row.key !== 'torqueNmm') {
        const v2 = L1.map(p => this._curveLayerVal(row, p));
        joinedVals = vals.concat(v2);
      }
      const vRealMax = Math.max(...joinedVals);
      const vMax = Math.max(...joinedVals.map(Math.abs), 0.01);
      const vMin = Math.min(...joinedVals);

      let yToPx, zeroY;
      if (row.fold || row.foldT) {
        const span = Math.max(vMax - vMin, 1e-9);
        yToPx = (v) => y0 + rowH - 3 - ((v - vMin) / span) * (rowH - 8);
        zeroY = null;
      } else if (row.nonNeg) {
        yToPx = (v) => y0 + rowH - 2 - (Math.abs(v) / vMax) * (rowH - 4);
        zeroY = y0 + rowH - 2;
      } else {
        yToPx = (v) => y0 + rowH / 2 - (v / vMax) * (rowH / 2 - 2);
        zeroY = y0 + rowH / 2;
      }
      row.yToPx = yToPx; row.vMin = vMin; row.vMax = vMax;
      row.rowY0 = y0; row.rowH = rowH;

      // 网格
      ctx.strokeStyle = gridC; ctx.lineWidth = 1;
      for (let k = 0; k <= 6; k++) {
        const x = pad.l + (k / 6) * plotW;
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
      if (zeroY !== null) {
        ctx.beginPath(); ctx.strokeStyle = borderC;
        ctx.moveTo(pad.l, zeroY); ctx.lineTo(pad.l + plotW, zeroY); ctx.stroke();
      }

      // 曲线（可能两条：L0 实线，L1 虚线；torque 复合只一条实线）
      const colL0 = this.cssVar(row.v);
      const colL1 = this.withAlpha(colL0, 0.45);
      const lineIsLayerCombo = row.key === 'torqueNmm'; // 复合 torque 是求和
      // --- L0 ---
      ctx.strokeStyle = colL0;
      ctx.lineWidth = (isCompound && !lineIsLayerCombo) ? 1.8 : 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      pts.forEach((pt, i) => {
        const v = this._curveLayerVal(row, pt);
        const x = xToPx(pt.phi), y = yToPx(v);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      // --- L1（仅复合 && 非 torque 行）---
      if (isCompound && !lineIsLayerCombo && L1) {
        ctx.strokeStyle = colL1; ctx.lineWidth = 1.6;
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        L1.forEach((pt, i) => {
          const v = this._curveLayerVal(row, pt);
          const x = xToPx(pt.phi), y = yToPx(v);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 左侧图例
      const lx = 10;
      ctx.textAlign = 'left';
      if (isCompound) {
        // 两行：top L1 / bottom L2；torque 行用 "Σ"
        ctx.textBaseline = 'middle';
        if (row.key === 'torqueNmm') {
          ctx.font = '600 13px sans-serif'; ctx.fillStyle = colL0;
          ctx.fillText('Σ ' + row.label, lx, y0 + rowH * 0.28);
          const lw = ctx.measureText('Σ ' + row.label).width;
          ctx.font = '12px sans-serif'; ctx.fillStyle = dimC;
          ctx.fillText(this.t('cvLayerBoth'), lx + lw + 6, y0 + rowH * 0.28);
          ctx.font = '11px sans-serif'; ctx.fillStyle = mutedC;
          ctx.fillText(this.t('cvFoldMin') + ' ' + this.fmtProbe(vMin) + ' ' + row.unit, lx, y0 + rowH * 0.62);
          ctx.fillText(this.t('cvFoldMax') + ' ' + this.fmtProbe(vRealMax) + ' ' + row.unit, lx, y0 + rowH * 0.86);
        } else {
          // L1 (top)
          ctx.font = '600 12px sans-serif'; ctx.fillStyle = colL0;
          ctx.fillText(row.label + '₁', lx, y0 + rowH * 0.28);
          let lw = ctx.measureText(row.label + '₁').width;
          ctx.font = '11px sans-serif'; ctx.fillStyle = dimC;
          ctx.fillText(this.t('cvLayer1'), lx + lw + 4, y0 + rowH * 0.28);
          // L2 (bottom)
          ctx.font = '600 12px sans-serif'; ctx.fillStyle = colL1;
          ctx.fillText(row.label + '₂', lx, y0 + rowH * 0.62);
          lw = ctx.measureText(row.label + '₂').width;
          ctx.font = '11px sans-serif'; ctx.fillStyle = dimC;
          ctx.fillText(this.t('cvLayer2'), lx + lw + 4, y0 + rowH * 0.62);
          // joint name + min/max
          ctx.font = '10px sans-serif'; ctx.fillStyle = mutedC;
          ctx.fillText(row.name, lx, y0 + rowH * 0.86);
        }
      } else {
        // 单层：原布局
        const cy = y0 + rowH / 2;
        ctx.textBaseline = 'middle';
        ctx.font = '600 13px sans-serif'; ctx.fillStyle = this.cssVar(row.v);
        ctx.fillText(row.label, lx, cy - 18);
        const lw = ctx.measureText(row.label).width;
        ctx.font = '12px sans-serif'; ctx.fillStyle = dimC;
        ctx.fillText(row.name, lx + lw + 6, cy - 18);
        ctx.font = '11px sans-serif'; ctx.fillStyle = mutedC;
        ctx.fillText(this.t('cvFoldMin') + ' ' + this.fmtProbe(vMin) + ' ' + row.unit, lx, cy);
        ctx.fillText(this.t('cvFoldMax') + ' ' + this.fmtProbe(vRealMax) + ' ' + row.unit, lx, cy + 18);
      }
      ctx.textBaseline = 'alphabetic';
    });

    // 底部轴标签 + 刻度
    ctx.fillStyle = mutedC; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    for (let a = 0; a <= 360; a += 90) {
      ctx.fillText(a + '°', xToPx(a), H - 22);
    }
    ctx.fillText(this.t('cvPhi'), W / 2, H - 5);

    this._curveGeom = { pad, plotW, plotH, maxPhi };
    this._curveRows = rows;
  },

  /* -------- 曲线取值探针：竖直游标 + 数值框 -------- */
  fmtProbe(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 1000) return v.toFixed(0);
    if (a >= 100) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.01) return v.toFixed(3);
    return v.toFixed(4);
  },

  drawProbe(ctx) {
    const geo = this._curveGeom, rows = this._curveRows;
    const phi = this.state.probePhi;
    if (!geo || !rows || phi === null || phi === undefined) return;

    const isCompound = this._curveIsCompound();
    const L0 = isCompound ? this.state.ptsByLayer[0] : (this.state.points || []);
    const L1 = isCompound ? (this.state.ptsByLayer[1] || []) : null;
    if (!L0 || !L0.length) return;

    // 在 L0 中找最近 phi（两层 phi 序列相同）
    let best = L0[0], bd = Infinity, bestIdx = 0;
    for (let i = 0; i < L0.length; i++) {
      const d = Math.abs(L0[i].phi - phi);
      if (d < bd) { bd = d; best = L0[i]; bestIdx = i; }
    }
    const best1 = isCompound ? L1[bestIdx] : null;
    const x = geo.pad.l + (best.phi / geo.maxPhi) * geo.plotW;
    const right = geo.pad.l + geo.plotW;
    const rr = (c, bx, by, bw, bh, rad) => {
      c.beginPath();
      c.moveTo(bx + rad, by);
      c.arcTo(bx + bw, by, bx + bw, by + bh, rad);
      c.arcTo(bx + bw, by + bh, bx, by + bh, rad);
      c.arcTo(bx, by + bh, bx, by, rad);
      c.arcTo(bx, by, bx + bw, by, rad);
      c.closePath();
    };
    ctx.save();
    // 竖直游标
    ctx.strokeStyle = 'rgba(232,89,12,0.85)'; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, geo.pad.t); ctx.lineTo(x, geo.pad.t + geo.plotH); ctx.stroke();
    ctx.setLineDash([]);

    // 各曲线取值圆点
    rows.forEach(r => {
      if (!r.yToPx) return;
      const colL0 = this.cssVar(r.v);
      // L0 圆点（所有行都画）
      ctx.beginPath(); ctx.fillStyle = colL0;
      ctx.arc(x, r.yToPx(this._curveLayerVal(r, best)), 3.6, 0, Math.PI * 2); ctx.fill();
      // L1 圆点（复合非 torque）
      if (isCompound && r.key !== 'torqueNmm' && best1) {
        const colL1 = this.withAlpha(colL0, 0.55);
        ctx.beginPath(); ctx.fillStyle = colL1;
        ctx.arc(x, r.yToPx(this._curveLayerVal(r, best1)), 3.0, 0, Math.PI * 2); ctx.fill();
      }
    });

    // 角度标签
    const head = best.phi.toFixed(1) + '°';
    ctx.font = '600 12px sans-serif';
    const hw = ctx.measureText(head).width + 16;
    let hx = x + 9; if (hx + hw > right) hx = x - hw - 9;
    if (hx < 4) hx = 4;
    const hy = geo.pad.t + 2;
    ctx.fillStyle = 'rgba(31,35,40,0.86)';
    rr(ctx, hx, hy, hw, 20, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(head, hx + 8, hy + 10);

    // 每行数值框
    rows.forEach(r => {
      if (!r.yToPx) return;
      const colL0 = this.cssVar(r.v);
      const colL1 = this.withAlpha(colL0, 0.7);
      const vL0 = this._curveLayerVal(r, best);
      const vL1 = isCompound && best1 ? this._curveLayerVal(r, best1) : null;
      const vSum = isCompound ? this._curveVal(r, best, best1) : null;

      let lines = []; // [{prefix, val, col}]
      if (isCompound) {
        if (r.key === 'torqueNmm') {
          lines.push({ p: 'Σ' + r.label + ' ', v: vSum, col: colL0 });
        } else {
          lines.push({ p: r.label + '₁ ', v: vL0, col: colL0 });
          lines.push({ p: r.label + '₂ ', v: vL1, col: colL1 });
        }
      } else {
        lines.push({ p: r.label + ' ', v: vL0, col: colL0 });
      }

      ctx.font = '600 12px sans-serif';
      const textBody = lines.map(l => l.p + this.fmtProbe(l.v) + ' ' + r.unit).join('  ');
      const tw = ctx.measureText(textBody).width + 22;
      const boxH = isCompound && r.key !== 'torqueNmm' ? 30 : 20;
      let tx = x + 10; if (tx + tw > right) tx = x - tw - 10;
      if (tx < 4) tx = 4;

      const yvL0 = r.yToPx(vL0);
      const top = r.rowY0 + 2, bot = r.rowY0 + r.rowH - boxH - 2;
      const yvRef = r.key === 'torqueNmm' && isCompound
        ? r.yToPx(vSum) : yvL0;
      const ty = Math.max(top, Math.min(bot, yvRef - boxH / 2));

      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
      rr(ctx, tx, ty, tw, boxH, 4); ctx.fill(); ctx.stroke();
      ctx.textAlign = 'left';
      if (lines.length === 1) {
        ctx.textBaseline = 'middle';
        ctx.fillStyle = lines[0].col;
        ctx.fillRect(tx + 1, ty + 3, 3, 14);
        ctx.fillText(lines[0].p + this.fmtProbe(lines[0].v) + ' ' + r.unit, tx + 10, ty + 10);
      } else {
        ctx.fillStyle = colL0;
        ctx.fillRect(tx + 1, ty + 3, 3, 10);
        ctx.fillRect(tx + 1, ty + 16, 3, 10);
        ctx.textBaseline = 'middle';
        ctx.fillStyle = colL0;
        ctx.fillText(lines[0].p + this.fmtProbe(lines[0].v) + ' ' + r.unit, tx + 10, ty + 9);
        ctx.fillStyle = colL1;
        ctx.fillText(lines[1].p + this.fmtProbe(lines[1].v) + ' ' + r.unit, tx + 10, ty + 21);
      }
    });
    ctx.restore();
  },

  bindRowToggles() {
    const box = document.getElementById('rowToggles');
    if (!box) return;
    const boxes = Array.from(box.querySelectorAll('input[data-row]'));
    boxes.forEach(cb => {
      cb.checked = this.state.visibleRows[cb.dataset.row] !== false;
      cb.addEventListener('change', () => {
        // 至少保留一行，避免画布为空
        if (!boxes.some(x => x.checked)) { cb.checked = true; return; }
        this.state.visibleRows[cb.dataset.row] = cb.checked;
        this._curveCache = null;
        this.drawCurves();
      });
    });
  },

  bindCurveProbe() {
    const cv = document.getElementById('cvCurves');
    if (!cv) return;
    cv.style.cursor = 'crosshair';
    const move = (e) => {
      if (this.state.currentViz !== 'curves' || !this._curveGeom) return;
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const px = (e.clientX - r.left) * (cv.width / r.width);
      const geo = this._curveGeom;
      if (px < geo.pad.l - 6 || px > geo.pad.l + geo.plotW + 6) return;
      const phi = Math.max(0, Math.min(geo.maxPhi, (px - geo.pad.l) / geo.plotW * geo.maxPhi));
      this.state.probePhi = phi;
      this.drawCurves();
    };
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      move(e);
    });
    cv.addEventListener('pointerleave', () => {
      this.state.probePhi = null;
      this.drawCurves();
    });
  },

  /* -------- 轮廓展开图 -------- */
  drawFlatten() {
    const cv = document.getElementById('cvFlatten');
    if (!cv) return;
    const W = this.fitCanvas(cv, { min: 680, max: 2400 });
    const targetH = W >= 1300 ? 560 : 480;
    if (cv.height !== targetH) cv.height = targetH;
    const ctx = cv.getContext('2d');
    const H = cv.height;
    ctx.clearRect(0, 0, W, H);

    const pad = { l: 66, r: 24, t: 60, b: 44 };
    const pts = this.state.points;
    const p = this.state.params;

    // 收集理论/工作轮廓绝对坐标，自动适配范围，确保完整显示
    let xMin = 0, xMax = 0, yMin = 0, yMax = 0;
    pts.forEach(pt => {
      const xw = pt.x_theory + (pt.x_work - pt.x_theory);
      const yw = pt.s + (pt.y_work - pt.y_theory);
      xMin = Math.min(xMin, pt.x_theory, xw);
      xMax = Math.max(xMax, pt.x_theory, xw);
      yMin = Math.min(yMin, pt.s, yw);
      yMax = Math.max(yMax, pt.s, yw);
    });
    const xPad = (xMax - xMin) * 0.03 || 1;
    const yPad = (yMax - yMin) * 0.08 || 1;
    xMin -= xPad; xMax += xPad; yMin -= yPad; yMax += yPad;

    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const xToPx = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * plotW;
    const yToPx = (y) => pad.t + plotH - ((y - yMin) / (yMax - yMin)) * plotH;
    const gridC = this.cssVar('--grid');
    const textC = this.cssVar('--text');
    const mutedC = this.cssVar('--text-muted');

    // 背景网格
    ctx.strokeStyle = gridC; ctx.lineWidth = 1;
    for (let k = 0; k <= 8; k++) {
      ctx.beginPath(); ctx.moveTo(pad.l + k * plotW / 8, pad.t); ctx.lineTo(pad.l + k * plotW / 8, pad.t + plotH); ctx.stroke();
    }
    for (let k = 0; k <= 5; k++) {
      ctx.beginPath(); ctx.moveTo(pad.l, pad.t + k * plotH / 5); ctx.lineTo(pad.l + plotW, pad.t + k * plotH / 5); ctx.stroke();
    }

    // 理论轮廓
    ctx.strokeStyle = '#4158d0'; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const x = xToPx(pt.x_theory);
      const y = yToPx(pt.s);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 工作轮廓
    ctx.strokeStyle = '#c850c0'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const yAbs = pt.s + (pt.y_work - pt.y_theory);
      const xAbs = pt.x_theory + (pt.x_work - pt.x_theory);
      const px = xToPx(xAbs);
      const py = yToPx(yAbs);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // 基圆参考线（y = 0）
    ctx.strokeStyle = mutedC; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.l, yToPx(0)); ctx.lineTo(pad.l + plotW, yToPx(0)); ctx.stroke();
    ctx.setLineDash([]);

    // 随动器示意
    const mid = pts[Math.floor(pts.length / 2)];
    const rollerX = xToPx(mid.x_theory);
    const rollerY = yToPx(mid.s);
    ctx.fillStyle = '#ff922b'; ctx.beginPath();
    ctx.arc(rollerX, rollerY, 7, 0, Math.PI * 2);
    ctx.fill();

    // 图例（顶部独立区域，不与曲线重叠）
    ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#4158d0'; ctx.fillRect(pad.l, 14, 16, 4);
    ctx.fillStyle = textC; ctx.fillText(this.t('cvTheory'), pad.l + 22, 19);
    ctx.fillStyle = '#c850c0'; ctx.fillRect(pad.l, 36, 16, 4);
    ctx.fillStyle = textC; ctx.fillText(this.t('cvWork'), pad.l + 22, 41);

    // 轴标签
    ctx.fillStyle = mutedC;
    ctx.textAlign = 'center';
    ctx.fillText(this.t('cvArc'), W / 2, H - 8);
    ctx.save(); ctx.translate(16, H / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText(this.t('cvAxial'), 0, 0); ctx.restore();
  },

  /* -------- 3D 线框 -------- */
  draw3D() {
    const cv = document.getElementById('cv3D');
    if (!cv) return;
    // 3D 视图保持较方的画幅，宽屏下居中，避免左右大片空白
    const W = this.fitCanvas(cv, { min: 620, max: 980 });
    const targetH = W >= 900 ? 560 : 520;
    if (cv.height !== targetH) cv.height = targetH;
    const ctx = cv.getContext('2d');
    const H = cv.height;
    ctx.clearRect(0, 0, W, H);

    const pts = this.state.points;
    const p = this.state.params;
    const vls = this.vizLayers();
    const RbBase = p.baseDia / 2;
    const Rb = (this.state.camType === 'compound' && this.state.layerStore[0] && this.state.layerStore[0].params)
      ? Math.max(RbBase, this.state.layerStore[0].params.baseDia / 2) : RbBase;
    const camLen = vls.reduce((m, vl) => Math.max(m, vl.p.camWidth), p.camWidth);

    // 正交投影 + 自动适配画布 + 手动视角（拖动旋转）
    const { alpha, beta } = this.state.view3d;
    const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
    const cosB = Math.cos(beta), sinB = Math.sin(beta);

    const maxLift = pts.reduce((m, pt) => Math.max(m, pt.z3d_th), 0);
    const swing = p.followerType === 'swing';
    const Rmax = Math.max(Rb + p.initialHt + 20, swing ? Rb + (p.swingLen || 100) : Rb);
    const rodLen = Math.max(50, Rb * 1.2); // 随动器杆示意长度（非参数）
    // 视野要同时容纳所有层（复合凸轮第2层可能更高）
    let zTopG = p.initialHt + maxLift;
    vls.forEach(vl => {
      const sMax = vl.pts.reduce((m, q) => Math.max(m, q.s), 0);
      zTopG = Math.max(zTopG, vl.gg.z0 + sMax + vl.gg.halfW);
    });
    const zTop = zTopG + (swing ? 0 : rodLen);
    const zOff = Rb * 0.3;
    const z1min = -zOff, z1max = zTop - zOff;
    const y2min = -z1max * cosB - Rmax * sinB;
    const y2max = -z1min * cosB + Rmax * sinB;
    const bw = 2 * Rmax;
    const bh = Math.max(y2max - y2min, 1);
    const margin = 26;
    const scale = Math.min((W - 2 * margin) / bw, (H - 2 * margin) / bh);
    const cx = W / 2;
    const cy = H / 2 - ((y2min + y2max) / 2) * scale;

    // 把 3D 点投影到 2D
    const project = (X, Y, Z) => {
      const x1 = X * cosA - Y * sinA;
      const y1 = X * sinA + Y * cosA;
      const z1 = Z - zOff;
      const x2 = x1;
      const y2 = -z1 * cosB + y1 * sinB;
      return { x: cx + x2 * scale, y: cy + y2 * scale };
    };

    // 动画相位
    const phase = this.state.anim.phase * Math.PI / 180;
    const rotate = (X, Y) => ({
      X: X * Math.cos(phase) - Y * Math.sin(phase),
      Y: X * Math.sin(phase) + Y * Math.cos(phase)
    });

    // 画圆柱基体外框（前后两个圆）
    const drawCylinder = (R, color, z0 = 0, z1 = camLen, lw = 1.2) => {
      const seg = 72;
      ctx.strokeStyle = color; ctx.lineWidth = lw;
      [z0, z1].forEach(z => {
        ctx.beginPath();
        for (let k = 0; k <= seg; k++) {
          const theta = 2 * Math.PI * k / seg;
          const { X, Y } = rotate(R * Math.cos(theta), R * Math.sin(theta));
          const pt = project(X, Y, z);
          if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      });
    };

    // 画轴（中心 + 两条母线）
    const axisFwd = project(0, 0, 0);
    const axisBack = project(0, 0, camLen);
    ctx.strokeStyle = this.cssVar('--text-muted'); ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(axisFwd.x, axisFwd.y); ctx.lineTo(axisBack.x, axisBack.y); ctx.stroke();
    ctx.setLineDash([]);

    // ---- 凸轮实体外框 ----
    // 单层：1 个圆柱；复合：开口槽——底面轮廓 + 第2层内侧凸台，上工作面已切除
    if (vls.length === 2) {
      const g1 = vls[0].gg, g2 = vls[1].gg;
      drawCylinder(g2.R, 'rgba(112,72,232,0.85)', 0, 0, 1.3);        // 内芯外圆（底）
      drawCylinder(g1.R, '#4158d0', 0, 0, 1.4);                      // 外套环外圆（底）
      drawCylinder(g1.rIn, '#0b7285', 0, 0, 1.1);                    // 环内孔（底）
      const Rhub = Math.max(0, g2.rIn);
      if (Rhub > 0.5) {
        drawCylinder(Rhub, '#7048e8', 0, vls[1].p.camWidth, 1.2);    // 内芯凸台（全高）
        // 凸台立壁：从下工作面到顶面
        ctx.strokeStyle = 'rgba(112,72,232,0.45)'; ctx.lineWidth = 1;
        for (let k = 0; k < 16; k++) {
          const th = 2 * Math.PI * k / 16;
          const zf = g2.z0 + this.sAtPhi(vls[1].pts, k * 360 / 16) - g2.halfW;
          const a = rotate(Rhub * Math.cos(th), Rhub * Math.sin(th));
          const pa = project(a.X, a.Y, zf), pb = project(a.X, a.Y, vls[1].p.camWidth);
          ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        }
      }
    } else {
      vls.forEach((vl, li) => {
        drawCylinder(vl.gg.R, li === 0 ? '#b8c0ff' : 'rgba(112,72,232,0.5)', 0, vl.p.camWidth);
      });
    }
    const LCOL = ['#d9480f', '#7048e8'], LCOLIN = ['#0b7285', '#4c6ef5'];
    vls.forEach((vl, li) => {
      const g = vl.gg;
      if (g.overflow) return;
      const oc = LCOL[li] || LCOL[0], ic = LCOLIN[li] || LCOLIN[0];
      const kk = vl.active ? 1 : 0.85;
      const curves = g.openTop ? [
        { r: g.R, dz: -g.halfW, color: oc, w: 1.8 * kk },    // 下工作面外缘
        { r: g.rIn, dz: -g.halfW, color: ic, w: 1.2 * kk }   // 下工作面内缘
      ] : [
        { r: g.R, dz: -g.halfW, color: oc, w: 1.8 * kk },   // 槽口下沿
        { r: g.R, dz: g.halfW, color: oc, w: 1.8 * kk },    // 槽口上沿
        { r: g.rIn, dz: -g.halfW, color: ic, w: 1.2 * kk }, // 槽底下沿
        { r: g.rIn, dz: g.halfW, color: ic, w: 1.2 * kk }   // 槽底上沿
      ];
      curves.forEach(c => {
        ctx.strokeStyle = c.color; ctx.lineWidth = c.w;
        ctx.beginPath();
        vl.pts.forEach((pt, i) => {
          const ph = pt.phi * Math.PI / 180;
          const { X, Y } = rotate(c.r * Math.cos(ph), c.r * Math.sin(ph));
          const pr = project(X, Y, g.z0 + pt.s + c.dz);
          if (i === 0) ctx.moveTo(pr.x, pr.y); else ctx.lineTo(pr.x, pr.y);
        });
        ctx.stroke();
      });
    });

    // 当前层随动器理论轨迹
    const al = vls.find(v => v.active) || vls[0];
    const gg = al.gg;
    ctx.strokeStyle = '#4158d0'; ctx.lineWidth = 2;
    ctx.beginPath();
    al.pts.forEach((pt, i) => {
      const { X, Y } = rotate(pt.x3d_th, pt.y3d_th);
      const pr = project(X, Y, gg.z0 + pt.z3d_th);
      if (i === 0) ctx.moveTo(pr.x, pr.y); else ctx.lineTo(pr.x, pr.y);
    });
    ctx.stroke();

    // ---- 随动器：按实际尺寸画成圆柱实体（直径 × 宽度，轴线沿径向）----
    const drawRoller = (th, z, dia, wid, Rbase, color, alpha) => {
      const rr = Math.max(1, (dia || 20) / 2);       // 滚子半径（跨凸轮轴向）
      const hl = Math.max(0.5, (wid || 20) / 2);     // 滚子半宽（沿径向）
      const Rc = Math.max(rr * 0.2 + hl, Rbase - 0.5 - hl);
      const ux = Math.cos(th), uy = Math.sin(th);
      const vx = -uy, vy = ux;
      const SEGR = 28;
      const mkCap = (s) => {
        const cc = [Rc * ux + s * hl * ux, Rc * uy + s * hl * uy, z];
        const out = [];
        for (let k = 0; k < SEGR; k++) {
          const ps = 2 * Math.PI * k / SEGR;
          out.push(project(
            cc[0] + Math.cos(ps) * rr * vx,
            cc[1] + Math.cos(ps) * rr * vy,
            cc[2] + Math.sin(ps) * rr
          ));
        }
        return out;
      };
      const capA = mkCap(-1), capB = mkCap(1);
      // 投影轮廓（凸包）→ 半透明实体
      const hp = capA.concat(capB).sort((m, n) => m.x - n.x || m.y - n.y);
      const crs = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lo2 = [], up2 = [];
      for (const q of hp) {
        while (lo2.length >= 2 && crs(lo2[lo2.length - 2], lo2[lo2.length - 1], q) <= 0) lo2.pop();
        lo2.push(q);
      }
      for (let i = hp.length - 1; i >= 0; i--) {
        const q = hp[i];
        while (up2.length >= 2 && crs(up2[up2.length - 2], up2[up2.length - 1], q) <= 0) up2.pop();
        up2.push(q);
      }
      lo2.pop(); up2.pop();
      const hull = lo2.concat(up2);
      ctx.beginPath();
      hull.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
      ctx.closePath();
      ctx.fillStyle = alpha > 0.3 ? 'rgba(255,146,43,0.42)' : 'rgba(112,72,232,0.20)';
      ctx.fill();
      // 两条端面圆边线
      ctx.strokeStyle = color; ctx.lineWidth = 1.3;
      [capA, capB].forEach(cap => {
        ctx.beginPath();
        cap.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
        ctx.closePath(); ctx.stroke();
      });
      // 侧面轮廓母线
      const pA = project(Rc * ux - hl * ux, Rc * uy - hl * uy, z);
      const pB = project(Rc * ux + hl * ux, Rc * uy + hl * uy, z);
      const axl = pB.x - pA.x, ayl = pB.y - pA.y;
      const alen = Math.hypot(axl, ayl) || 1;
      const nx2 = -ayl / alen, ny2 = axl / alen;
      let iMax = 0, iMin = 0, dMax = -1e9, dMin = 1e9;
      for (let k = 0; k < SEGR; k++) {
        const d = (capA[k].x - pA.x) * nx2 + (capA[k].y - pA.y) * ny2;
        if (d > dMax) { dMax = d; iMax = k; }
        if (d < dMin) { dMin = d; iMin = k; }
      }
      ctx.beginPath();
      ctx.moveTo(capA[iMax].x, capA[iMax].y); ctx.lineTo(capB[iMax].x, capB[iMax].y);
      ctx.moveTo(capA[iMin].x, capA[iMin].y); ctx.lineTo(capB[iMin].x, capB[iMin].y);
      ctx.stroke();
    };

    vls.forEach((vl) => {
      const g = vl.gg, pL = vl.p, ptsL = vl.pts, NPL = ptsL.length;
      const nR = Math.max(1, pL.rollerCount || 1);
      const liftAt = (worldDeg) => {
        const phi = ((worldDeg - this.state.anim.phase) % 360 + 360) % 360;
        const idx = Math.round(phi / 360 * (NPL - 1));
        const q = ptsL[Math.min(Math.max(idx, 0), NPL - 1)];
        return q ? q.z3d_th + g.z0 : g.z0;
      };
      for (let r = 0; r < nR; r++) {
        const worldDeg = (pL.rollerAngles && pL.rollerAngles[r] != null && pL.rollerAngles[r] !== '')
          ? Number(pL.rollerAngles[r]) : (360 / nR * r);
        const th = worldDeg * Math.PI / 180;
        const X = g.R * Math.cos(th), Y = g.R * Math.sin(th);
        const z = liftAt(worldDeg);
        const rollerCenter = project(X, Y, z);
        drawRoller(th, z, pL.rollerDia, Math.max(0.5, (pL.rollerWidth || 1) - 1), g.R,
          vl.active ? '#d9480f' : '#7048e8', vl.active ? 0.5 : 0.2);
        if (!vl.active) continue;
        ctx.strokeStyle = '#868e96'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        if (pL.followerType === 'swing') {
          const pivotR = g.R + (pL.swingLen || 100);
          const pivot = project(pivotR * Math.cos(th), pivotR * Math.sin(th), g.z0);
          ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y); ctx.lineTo(rollerCenter.x, rollerCenter.y); ctx.stroke();
          ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.arc(pivot.x, pivot.y, 4, 0, Math.PI * 2); ctx.fill();
        } else {
          const rodEnd = project(X, Y, z + rodLen);
          ctx.beginPath(); ctx.moveTo(rollerCenter.x, rollerCenter.y); ctx.lineTo(rodEnd.x, rodEnd.y); ctx.stroke();
          ctx.fillStyle = '#5c6370'; ctx.beginPath(); ctx.arc(rodEnd.x, rodEnd.y, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
    });

    // 显示相位
    ctx.fillStyle = this.cssVar('--text'); ctx.font = '14px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`φ = ${this.state.anim.phase.toFixed(1)}°`, 14, H - 14);
  },

  /* -------- 动画 -------- */
  animLoop(t) {
    const a = this.state.anim;
    if (a.playing) {
      const dt = a.lastT ? (t - a.lastT) / 1000 : 0;
      a.lastT = t;
      const speed = 120; // deg/s
      a.phase += speed * dt * a.dir;
      if (a.phase > 360) a.phase -= 360;
      if (a.phase < 0) a.phase += 360;
      if (this.state.currentViz === 'line3d') this.draw3D();
      document.getElementById('animSlider').value = Math.round(a.phase * 10);
      document.getElementById('animPhase').textContent = `φ = ${a.phase.toFixed(1)}°`;
    }
    requestAnimationFrame((tt) => this.animLoop(tt));
  },

  animControl(cmd) {
    const a = this.state.anim;
    a.lastT = 0;
    if (cmd === 'forward') { a.playing = true; a.dir = 1; }
    else if (cmd === 'backward') { a.playing = true; a.dir = -1; }
    else if (cmd === 'stop') { a.playing = false; }
    else if (cmd === 'stepFwd') { a.phase = (a.phase + 3) % 360; }
    else if (cmd === 'stepRev') { a.phase = (a.phase - 3 + 360) % 360; }
    document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
    const map = { forward: 3, backward: 4, stop: 5 };
    const idx = map[cmd];
    if (idx !== undefined) document.querySelectorAll('.anim-btn')[idx].classList.add('active');
    if (!a.playing) this.draw3D();
  },

  animSlider(v) {
    this.state.anim.phase = v / 10;
    this.state.anim.playing = false;
    this.draw3D();
    document.getElementById('animPhase').textContent = `φ = ${this.state.anim.phase.toFixed(1)}°`;
  },

  /* -------- 参数示意 -------- */
  drawIndic() {
    const cv = document.getElementById('cvIndic');
    if (!cv) return;
    const W = this.fitCanvas(cv, { min: 640, max: 1000 });
    const ctx = cv.getContext('2d');
    const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const camCompound = this.state.camType === 'compound'
      && this.state.layerStore && this.state.layerStore[0] && this.state.layerStore[1];
    const L0 = camCompound ? this.state.layerStore[0].params : null;
    const L1 = camCompound ? this.state.layerStore[1].params : null;
    const p = this.state.params;
    if (!p) return;

    const textC = this.cssVar('--text');
    const dimC = this.cssVar('--text-dim');
    const mutedC = this.cssVar('--text-muted');
    const accent = this.cssVar('--primary');

    const cx = W * 0.38;
    const baseDia0 = camCompound ? L0.baseDia : p.baseDia;
    const scale = Math.min(
      (W * 0.32) / Math.max(p.camWidth, 10),
      (H - 180) / Math.max(baseDia0, 10),
      (H - 180) / Math.max(p.initialHt + 30, 20)
    );
    const cy = H * 0.50;
    const w = p.camWidth * scale;
    const h0 = baseDia0 * scale;
    const h1 = camCompound ? L1.baseDia * scale : 0;
    const hMax = Math.max(h0, h1 || 0);
    const r = Math.max(5, (p.rollerDia / 2) * scale);
    const rOuter0 = h0 / 2;
    const rOuter1 = camCompound ? h1 / 2 : 0;
    const rIn1 = camCompound ? Math.max(8, rOuter1 - 2 * (p.rollerWidth * scale + 4)) : 0;

    // 画凸轮（单层圆柱；复合画两层径向嵌套 —— 外套环 + 内芯）
    ctx.strokeStyle = '#6b7bff'; ctx.lineWidth = 2;
    if (camCompound) {
      // 第1层：外套环（环形截面，上下椭圆仍画全椭圆示意）
      ctx.fillStyle = 'rgba(184,192,255,0.28)';
      ctx.beginPath(); ctx.rect(cx - w / 2, cy - h0 / 2, w, h0); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy - h0 / 2, w / 2, h0 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy + h0 / 2, w / 2, h0 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();

      // 第2层：内芯（更小直径，圆柱，位于第1层内部）
      ctx.strokeStyle = '#e67700';
      ctx.fillStyle = 'rgba(255,146,43,0.22)';
      ctx.beginPath(); ctx.rect(cx - w / 2, cy - h1 / 2, w, h1); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy - h1 / 2, w / 2, h1 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy + h1 / 2, w / 2, h1 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(184,192,255,0.28)';
      ctx.beginPath(); ctx.rect(cx - w / 2, cy - h0 / 2, w, h0); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy - h0 / 2, w / 2, h0 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy + h0 / 2, w / 2, h0 * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
    }

    // 尺寸标注工具
    const tick = (x, y) => { ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4); ctx.stroke(); };
    const dimV = (x, y1, y2, label) => {
      ctx.strokeStyle = accent; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
      tick(x, y1); tick(x, y2);
      const midY = (y1 + y2) / 2;
      ctx.save();
      ctx.translate(x - 10, midY); ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = dimC; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.font = '11px sans-serif';
      ctx.fillText(label, 0, 0);
      ctx.restore(); ctx.textBaseline = 'alphabetic';
    };
    const dimH = (y, x1, x2, label) => {
      ctx.strokeStyle = accent; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      tick(x1, y); tick(x2, y);
      ctx.fillStyle = dimC; ctx.font = '11px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(label, (x1 + x2) / 2, y + 6);
      ctx.textBaseline = 'alphabetic';
    };

    // === 尺寸 ===
    // 单层：基圆直径 / 凸轮高度（以 p.baseDia / p.camWidth 为准）
    // 复合：两层基圆各标注（左侧竖向两条；高度共用 camWidth）
    if (camCompound) {
      // 第1层基圆
      dimV(cx - w / 2 - 36, cy - h0 / 2, cy + h0 / 2, `${this.t('baseDia')}₁ ${L0.baseDia} mm`);
      // 第2层基圆（更靠左一点，避免和第1层重叠）
      dimV(cx - w / 2 - 72, cy - h1 / 2, cy + h1 / 2, `${this.t('baseDia')}₂ ${L1.baseDia} mm`);
    } else {
      dimV(cx - w / 2 - 28, cy - h0 / 2, cy + h0 / 2, `${this.t('baseDia')} ${p.baseDia} mm`);
    }
    // 凸轮高度（横向）：y 留足 58px 给 label，避免贴底
    dimH(cy + h0 / 2 + 58, cx - w / 2, cx + w / 2, `${this.t('camWidth')} ${p.camWidth} mm`);

    // 随动器（只画当前层的滚子 + 杆）
    const rx = cx + w / 2 + 90;
    const rollerCy = cy;
    const wR = Math.max(8, p.rollerWidth * scale);
    ctx.fillStyle = '#ff922b'; ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(rx - wR / 2, rollerCy - r, wR, 2 * r); ctx.fill(); ctx.stroke();
    // 杆（朝上，长度固定示意）
    const rodTop = rollerCy - Math.max(70, 2.2 * r);
    ctx.strokeStyle = '#868e96'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx, rollerCy); ctx.lineTo(rx, rodTop); ctx.stroke();
    ctx.lineCap = 'butt';
    // 滚子宽度（横向）：留足 22px
    dimH(rollerCy + r + 22, rx - wR / 2, rx + wR / 2, `${this.t('rollerWidth')} ${p.rollerWidth} mm`);
    // 滚子直径（竖向）
    dimV(rx + wR / 2 + 26, rollerCy - r, rollerCy + r, `${this.t('rollerDia')} ${p.rollerDia} mm`);

    // 初始高度（凸轮内向上）：单层用 p.initialHt；复合用当前活动层参数
    const liftHt = p.initialHt;
    const liftY = cy + h0 / 2 - liftHt * scale;
    ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx - w / 2, liftY); ctx.lineTo(cx + w / 2, liftY); ctx.stroke();
    ctx.setLineDash([]);
    const liftLabel = camCompound
      ? `${this.t('initialHt')}（${this.t('layer1')}${this.state.activeLayer === 1 ? '₂' : '₁'}）${liftHt} mm`
      : `${this.t('initialHt')} ${liftHt} mm`;
    dimV(cx + w / 2 + 16, liftY, cy + h0 / 2, liftLabel);

    // 复合模式右下角加一行提示
    if (camCompound) {
      ctx.fillStyle = mutedC; ctx.textAlign = 'right'; ctx.font = '12px sans-serif';
      ctx.fillText(this.t('cvLayerBoth') + ' —— ' + this.t('cvLayer1') + ' + ' + this.t('cvLayer2'),
        W - 14, H - 14);
    } else {
      ctx.fillStyle = mutedC; ctx.textAlign = 'left'; ctx.font = '12px sans-serif';
      ctx.fillText(`φ = 360°`, 14, H - 14);
    }
  },

  /* -------- 数据存取 -------- */
  saveJSON() {

      format: 'cylindrical-cam-designer-v2',
      camType: this.state.camType || 'single',
      params: this.state.params,
      segments: this.state.segments,
      layers: (this.state.camType === 'compound' && this.state.layerStore[0] && this.state.layerStore[1])
        ? this.state.layerStore.map(L => ({ params: L.params, segments: L.segments }))
        : null,
      savedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cam-design-${new Date().toISOString().slice(0, 10)}.json`;

  onLoadFile(input) {
    const f = input.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const comp = data.camType === 'compound' && Array.isArray(data.layers)
          && data.layers[0] && data.layers[1];
        if (comp) {
          document.getElementById('p_camType').value = 'compound';
          this.state.camType = 'compound';
          this.state.layerStore = data.layers;
          this.state.activeLayer = 0;
          this.state.ptsByLayer = [null, null];
          this.applyLayerToUI(data.layers[0]);
          this.syncLayer2Derived();
          this.compute();
          return;
        }
        document.getElementById('p_camType').value = 'single';
        this.state.camType = 'single';
        this.state.layerStore = [null, null];
        this.state.ptsByLayer = [null, null];
        if (data.segments) this.state.segments = data.segments;
        if (data.params) {
          const p = data.params;
          const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
          set('p_baseDia', p.baseDia); set('p_camWidth', p.camWidth);
          set('p_rollerDia', p.rollerDia); set('p_rollerWidth', p.rollerWidth);
          set('p_initialHt', p.initialHt); set('p_resolution', p.resolution);
          set('p_camSpeed', p.camSpeed != null ? p.camSpeed : 60);
          set('p_followerType', p.followerType); set('p_handedness', p.handedness);
          set('p_offset', p.offset || 0); set('p_motionDir', p.motionDir);
          document.getElementById('p_offset').dataset.userSet = '1';
          set('p_tiltAngle', p.tiltAngle || 0);
          set('p_loadMass', p.loadMass); set('p_springForce', p.springForce);
          set('p_efficiency', Math.round(p.efficiency * 100));
          set('p_pressAngleLimit', p.pressAngleLimit);
          set('p_rollerCount', p.rollerCount);
          if (p.rollerAngles) set('p_rollerAngles', p.rollerAngles.join(', '));
        }
        this.renderSegTable();
        this.onFollowerTypeChange();
        this.compute();
      } catch (e) { alert(this.t('alertJsonFail') + e.message); }
    };
    reader.readAsText(f);
  },

  exportCSV() {
