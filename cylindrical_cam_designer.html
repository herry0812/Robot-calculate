  /* -------- 凸轮沟槽几何（STEP 导出与 3D 预览共用） --------
     openTop=true：复合模式，无上工作面——只保留下工作面（槽底），槽口向上敞开 */
  grooveGeomFor(p, pts, openTop) {
    pts = pts || [];
    const open = !!openTop;
    const R = p.baseDia / 2;
    const halfW = (p.rollerDia + 0.2) / 2;   // 沟槽轴向半宽（随动器直径 + 0.2 间隙）
    const depth = p.rollerWidth;              // 沟槽径向深度（用户直接输入，不再额外加余量）
    const rIn = Math.max(1, R - depth);       // 槽底半径
    const zLow = 0, zHigh = p.camWidth;
    const sMin = pts.length ? Math.min.apply(null, pts.map(q => q.s)) : 0;
    const sMax = pts.length ? Math.max.apply(null, pts.map(q => q.s)) : 0;
    // 封闭槽需要容纳上下两条棱；开口槽只需容纳下工作面（槽底）
    const need = (open ? 0 : 2 * halfW) + (sMax - sMin) + 0.1;
    const z0req = p.initialHt;                // 下工作面基准高度（用户设定）
    let z0 = z0req;
    let overflow = null;
    if (need > zHigh) {
      overflow = {
        need: need.toFixed(1), w: zHigh.toFixed(1),
        rd: p.rollerDia.toFixed(1), lift: (sMax - sMin).toFixed(1)
      };
    } else if (open) {
      if (z0 + sMin - halfW < 0.05) z0 += 0.05 - (z0 + sMin - halfW);
      if (z0 + sMax - halfW > zHigh - 0.05) z0 -= (z0 + sMax - halfW) - (zHigh - 0.05);
    } else {
      if (z0 + sMin - halfW < 0.05) z0 += 0.05 - (z0 + sMin - halfW);
      if (z0 + sMax + halfW > zHigh - 0.05) z0 -= (z0 + sMax + halfW) - (zHigh - 0.05);
    }
    const zMin = open ? (0.05 - sMin + halfW) : (0.05 - sMin + halfW);
    const zMax = open ? (zHigh - 0.05 - sMax + halfW) : (zHigh - 0.05 - sMax - halfW);
    const wNeed = z0req + sMax + (open ? -halfW : halfW) + 0.05; // 容纳不下时所需的凸轮高度
    return { R, halfW, depth, rIn, zLow, zHigh, z0, z0req, openTop: open,
      shift: z0 - z0req, zMin, zMax, need, wNeed, sMin, sMax, overflow };
  },

  camGrooveGeom() {
    return this.grooveGeomFor(this.state.params, this.state.points || [], false);
  },

  /* 3D 显示用的层列表：单层 1 项，复合 2 项（第1层在外圈） */
  vizLayers() {
    const S = this.state.layerStore, P = this.state.ptsByLayer;
    if (this.state.camType === 'compound' && S[0] && S[1] && P[0] && P[1]) {
      const out = [];
      for (let i = 0; i < 2; i++) {
        out.push({
          p: S[i].params, pts: P[i],
          gg: this.grooveGeomFor(S[i].params, P[i], true),
          active: i === this.state.activeLayer, idx: i
        });
      }
      return out;
    }
    return [{
      p: this.state.params, pts: this.state.points || [],
      gg: this.camGrooveGeom(), active: true, idx: 0
    }];
  },

  /* -------- STEP AP214 导出 -------- */
  exportSTEP() {
    const pts = this.state.points;
    if (!pts || pts.length === 0) { alert(this.t('needCompute')); return; }
    if (this.state.hasFatalInput) {
      const first = (this.state.inputIssues || []).find(x => x.level === 'E');
      alert((first ? first.text + '\n' + (first.impact || '') + '\n' : '') +
        (first && first.suggestion ? first.suggestion : this.t('inputStale')));
      return;
    }

    /* ---- 实体定义（mm）----
       单层: 圆柱毛坯 − 沟槽（一条通道）
       复合: 第1层 = 外套环（外径 R1、内孔 = 第2层外径 R2），沟槽自外圆切到近内孔；
             第2层 = 内芯圆柱（外径 R2），沟槽自 R2 向内切 R2−d2
       两者同轴、分别成体，写在同一个 STEP 文件里 */
    const compound = this.state.camType === 'compound' && this.state.layerStore[0]
      && this.state.layerStore[1] && this.state.ptsByLayer[0] && this.state.ptsByLayer[1];
    const N = compound ? 240 : 360; // 每 1.5° / 1° 一段
    const mkSAt = (arr) => (deg) => {
      const d = ((deg % 360) + 360) % 360;
      const i = Math.min(arr.length - 2, Math.floor(d / 360 * (arr.length - 1)));
      const a = arr[i], b = arr[i + 1] || a;
      const t = (d - a.phi) / ((b.phi - a.phi) || 1);
      return a.s + (b.s - a.s) * Math.max(0, Math.min(1, t));
    };

    const bodies = [];
    if (compound) {
      const L1 = this.state.layerStore[0], L2 = this.state.layerStore[1];
      const info = this.state.compoundInfo;
      if (info && info.fit2 === false) {
        alert(this.t('alertCompoundNoFit', info.fitInfo) + '\n' + this.t('sugCompoundNoFit', info.fitInfo));
        return;
      }
      if (info && info.hViolation) {
        alert(this.t('alertHeightViolation', {
          ranges: info.ranges.map(r => `${r[0].toFixed(1)}°~${r[1].toFixed(1)}°`).join('、'),
          n: info.need.toFixed(2)
        }) + '\n' + this.t('alertHeightViolationSug', { a: info.h2.toFixed(2), b: info.hNeed.toFixed(2) }));
        return;
      }
      const g1 = this.grooveGeomFor(L1.params, this.state.ptsByLayer[0], true);
      const g2 = this.grooveGeomFor(L2.params, this.state.ptsByLayer[1], true);
      if (g1.overflow) {
        alert(this.t('alertGrooveOpenOverflow', g1.overflow) + '\n' + this.t('sugGrooveOpenOverflow', g1.overflow));
        return;
      }
      if (g2.overflow) {
        alert(this.t('alertGrooveOpenOverflow', g2.overflow) + '\n' + this.t('sugGrooveOpenOverflow', g2.overflow));
        return;
      }
      if (g2.R - g2.depth <= 1) {
        alert(this.t('alertLayer2Deep', { r: g2.R.toFixed(2), d: g2.depth.toFixed(2) }) + '\n' + this.t('sugLayer2Deep'));
        return;
      }
      const shiftBody = Math.abs(g1.shift) >= Math.abs(g2.shift) ? g1 : g2;
      if (Math.abs(shiftBody.shift) > 1e-6) {
        const lo = Math.max(0, shiftBody.zMin), hi = shiftBody.zMax;
        const wNeed = shiftBody.wNeed.toFixed(1);
        alert(this.t('alertGrooveShift', {
          ih: this.fmtNum(shiftBody.z0req), shift: Math.abs(shiftBody.shift).toFixed(2),
          min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed
        }) + '\n' + this.t('alertGrooveShiftSug', {
          min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed
        }));
        return;
      }
      bodies.push({
        name: 'CamLayer1_Ring', ring: true, openTop: true,
        R_out: g1.R, R_in: g2.R,
        halfW: g1.halfW, zLow: 0, zHigh: L1.params.camWidth, z0: g1.z0,
        sAt: mkSAt(this.state.ptsByLayer[0])
      });
      bodies.push({
        name: 'CamLayer2_Core', ring: false, openTop: true,
        R_out: g2.R, R_in: g2.rIn,
        halfW: g2.halfW, zLow: 0, zHigh: L2.params.camWidth, z0: g2.z0,
        sAt: mkSAt(this.state.ptsByLayer[1])
      });
    } else {
      const geom = this.camGrooveGeom();
      if (geom.overflow) {
        alert(this.t('alertGrooveOverflow', geom.overflow) + '\n' + this.t('sugGrooveOverflow', geom.overflow));
        return;
      }
      if (Math.abs(geom.shift) > 1e-6) {
        const lo = Math.max(0, geom.zMin), hi = geom.zMax;
        const wNeed = geom.wNeed.toFixed(1);
        alert(this.t('alertGrooveShift', {
          ih: this.fmtNum(geom.z0req), shift: Math.abs(geom.shift).toFixed(2),
          min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed
        }) + '\n' + this.t('alertGrooveShiftSug', {
          min: lo.toFixed(2), max: hi.toFixed(2), need: wNeed
        }));
        return;
      }
      bodies.push({
        name: 'CamGroove', ring: false,
        R_out: geom.R, R_in: geom.rIn,
        halfW: geom.halfW, zLow: geom.zLow, zHigh: geom.zHigh, z0: geom.z0,
        sAt: mkSAt(pts)
      });
    }

    const lines = [];
    const push = (s = '') => lines.push(s);
    let id = 0;
    const nid = () => ++id;

    push('ISO-10303-21;');
    push('HEADER;');
    push("FILE_DESCRIPTION(('Cylindrical cam solid with groove'),'2;1');");
    push(`FILE_NAME('cam-solid-${new Date().toISOString().slice(0, 10)}.step','${new Date().toISOString()}',('TraeCam'),(''),'solid','','');`);
    push("FILE_SCHEMA(('AUTOMOTIVE_DESIGN'));");
    push('ENDSEC;');
    push('DATA;');

    const ctx = nid();
    const a1 = nid(), a2 = nid(), a3 = nid();
    const pr = nid(), pcf = nid(), pdf = nid(), pdc = nid(), pd = nid(), pds = nid(), sdr = nid();
    const rep = nid();
    push(`#${a1}=APPLICATION_CONTEXT('automotive design');`);
    push(`#${a2}=APPLICATION_PROTOCOL_DEFINITION('international standard','automotive_design',2000,#${a1});`);
    push(`#${a3}=PRODUCT_CONTEXT('',#${a1},'mechanical');`);
    push(`#${pr}=PRODUCT('CamGroove','Cam Groove','',(#${a3}));`);
    push(`#${pcf}=PRODUCT_DEFINITION_FORMATION('','',#${pr});`);
    push(`#${pdc}=PRODUCT_DEFINITION_CONTEXT('part definition',#${a1},'design');`);
    push(`#${pd}=PRODUCT_DEFINITION('design','',#${pcf},#${pdc});`);
    push(`#${pdf}=PRODUCT_DEFINITION_SHAPE('','',#${pd});`);
    push(`#${sdr}=SHAPE_DEFINITION_REPRESENTATION(#${pdf},#${rep});`);

    const u1 = nid(), u2 = nid(), u3 = nid(), unc = nid();
    push(`#${u1}=(LENGTH_UNIT() NAMED_UNIT(*) SI_UNIT(.MILLI.,.METRE.));`);
    push(`#${u2}=(NAMED_UNIT(*) PLANE_ANGLE_UNIT() SI_UNIT($,.RADIAN.));`);
    push(`#${u3}=(NAMED_UNIT(*) SOLID_ANGLE_UNIT() SI_UNIT($,.STERADIAN.));`);
    push(`#${unc}=UNCERTAINTY_MEASURE_WITH_UNIT(LENGTH_MEASURE(0.001),#${u1},'distance_accuracy_value','');`);
    push(`#${ctx}=(GEOMETRIC_REPRESENTATION_CONTEXT(3) GLOBAL_UNCERTAINTY_ASSIGNED_CONTEXT((#${unc})) GLOBAL_UNIT_ASSIGNED_CONTEXT((#${u1},#${u2},#${u3})) REPRESENTATION_CONTEXT('',''));`);

    // ---- 逐体生成闭合 B-rep（每个体 = 闭合壳 + 若干平面三角面）----
    const brepIds = [];
    bodies.forEach((b) => {
      const isRing = !!b.ring;
      const K = b.openTop ? (isRing ? 4 : 6) : 8;
      const vert = [];
      let axLow = -1, axHigh = -1;
      if (!isRing) {
        axLow = vert.length; vert.push([0, 0, b.zLow]);
        axHigh = vert.length; vert.push([0, 0, b.zHigh]);
      }
      // 每个角度的截面多边形（逆时针）
      // 封闭槽：外圆下 → 槽口下 → 槽底 → 槽口上 → 外圆上
      // 开口槽：外圆下 → 下工作面（槽底）→ 内侧立面 → 顶面（仅第2层保留内侧凸台）
      const prof = (z1, z2) => {
        if (b.openTop) {
          return isRing
            ? [[b.R_in, b.zLow], [b.R_out, b.zLow], [b.R_out, z1], [b.R_in, z1]]
            : [[0, b.zLow], [b.R_out, b.zLow], [b.R_out, z1], [b.R_in, z1], [b.R_in, b.zHigh], [0, b.zHigh]];
        }
        return isRing
          ? [[b.R_in, b.zLow], [b.R_out, b.zLow], [b.R_out, z1], [b.R_floor, z1],
             [b.R_floor, z2], [b.R_out, z2], [b.R_out, b.zHigh], [b.R_in, b.zHigh]]
          : [[0, b.zLow], [b.R_out, b.zLow], [b.R_out, z1], [b.R_in, z1],
             [b.R_in, z2], [b.R_out, z2], [b.R_out, b.zHigh], [0, b.zHigh]];
      };

      const vid = [];
      for (let i = 0; i < N; i++) {
        const ph = i * 2 * Math.PI / N;
        const zc = b.z0 + b.sAt(i * 360 / N);
        const z1 = zc - b.halfW, z2 = zc + b.halfW;
        const cx = Math.cos(ph), sy = Math.sin(ph);
        const row = prof(z1, z2);
        vid[i] = [];
        for (let k = 0; k < K; k++) {
          const r = row[k][0], z = row[k][1];
          if (r < 1e-9) vid[i][k] = (z <= b.zLow + 1e-9) ? axLow : axHigh;
          else { vid[i][k] = vert.length; vert.push([r * cx, r * sy, z]); }
        }
      }

      // 顶点：CARTESIAN_POINT + VERTEX_POINT
      const cpId = [], vpId = [];
      for (let g = 0; g < vert.length; g++) {
        const v = vert[g];
        const cp = nid();
        push(`#${cp}=CARTESIAN_POINT('',(${v[0].toFixed(4)},${v[1].toFixed(4)},${v[2].toFixed(4)}));`);
        const vp = nid();
        push(`#${vp}=VERTEX_POINT('',#${cp});`);
        cpId.push(cp); vpId.push(vp);
      }

      // 棱：按"无向顶点对"去重，每条棱生成一次 EDGE_CURVE（低编号→高编号）
      const edgeCache = new Map();
      const getEdge = (a, c) => {
        const lo = a < c ? a : c, hi = a < c ? c : a;
        const key = lo + '_' + hi;
        let e = edgeCache.get(key);
        if (!e) {
          const P = vert[lo], Q = vert[hi];
          const dx = Q[0] - P[0], dy = Q[1] - P[1], dz = Q[2] - P[2];
          const len = Math.hypot(dx, dy, dz) || 1e-9;
          const dir = nid();
          push(`#${dir}=DIRECTION('',(${(dx / len).toFixed(9)},${(dy / len).toFixed(9)},${(dz / len).toFixed(9)}));`);
          const vec = nid();
          push(`#${vec}=VECTOR('',#${dir},${len.toFixed(6)});`);
          const line = nid();
          push(`#${line}=LINE('',#${cpId[lo]},#${vec});`);
          const ec = nid();
          push(`#${ec}=EDGE_CURVE('',#${vpId[lo]},#${vpId[hi]},#${line},.T.);`);
          e = { id: ec, from: lo };
          edgeCache.set(key, e);
        }
        return { id: e.id, same: a === e.from };
      };

      // 面：每个三角面 = EDGE_LOOP → FACE_OUTER_BOUND → ADVANCED_FACE(PLANE)
      const faces = [];
      const addTri = (ga, gb, gc) => {
        const A = vert[ga], B = vert[gb], C = vert[gc];
        let nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
        let ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
        let nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
        const nl = Math.hypot(nx, ny, nz);
        if (nl < 1e-12) return; // 退化三角（零面积）跳过
        nx /= nl; ny /= nl; nz /= nl;
        const mkOE = (u, w) => {
          const ed = getEdge(u, w);
          const oe = nid();
          push(`#${oe}=ORIENTED_EDGE('',*,*,#${ed.id},${ed.same ? '.T.' : '.F.'});`);
          return oe;
        };
        const oe1 = mkOE(ga, gb), oe2 = mkOE(gb, gc), oe3 = mkOE(gc, ga);
        const loop = nid();
        push(`#${loop}=EDGE_LOOP('',(#${oe1},#${oe2},#${oe3}));`);
        const bound = nid();
        push(`#${bound}=FACE_OUTER_BOUND('',#${loop},.T.);`);
        const ax = nid(), rf = nid();
        const rl = Math.hypot(B[0] - A[0], B[1] - A[1], B[2] - A[2]) || 1;
        push(`#${ax}=DIRECTION('',(${nx.toFixed(9)},${ny.toFixed(9)},${nz.toFixed(9)}));`);
        push(`#${rf}=DIRECTION('',(${((B[0] - A[0]) / rl).toFixed(9)},${((B[1] - A[1]) / rl).toFixed(9)},${((B[2] - A[2]) / rl).toFixed(9)}));`);
        const pl = nid();
        push(`#${pl}=AXIS2_PLACEMENT_3D('',#${cpId[ga]},#${ax},#${rf});`);
        const plane = nid();
        push(`#${plane}=PLANE('',#${pl});`);
        const face = nid();
        push(`#${face}=ADVANCED_FACE('',(#${bound}),#${plane},.T.);`);
        faces.push(face);
      };

      const isAxis = (v) => vert[v][0] === 0 && vert[v][1] === 0;
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N;
        for (let k = 0; k < K; k++) {
          const k2 = (k + 1) % K;
          const ai = vid[i][k], aj = vid[j][k], bi = vid[i][k2], bj = vid[j][k2];
          const aa = isAxis(ai), bb = isAxis(bi);
          if (aa && bb) continue;          // 轴线上的退化条带
          if (aa) addTri(ai, bj, bi);      // 极点扇形（端面）
          else if (bb) addTri(ai, aj, bi);
          else { addTri(ai, aj, bj); addTri(ai, bj, bi); }
        }
      }

      const shell = nid();
      push(`#${shell}=CLOSED_SHELL('',(${faces.map(f => '#' + f).join(',')}));`);
      const brep = nid();
      push(`#${brep}=MANIFOLD_SOLID_BREP('${b.name}',#${shell});`);
      brepIds.push(brep);
    });

    push(`#${rep}=ADVANCED_BREP_SHAPE_REPRESENTATION('CamSolid',(${brepIds.map(x => '#' + x).join(',')}),#${ctx});`);

    push('ENDSEC;');
    push('END-ISO-10303-21;');

    const text = lines.join('\n');
    const blob = new Blob([text], { type: 'application/step' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cam-solid-${new Date().toISOString().slice(0, 10)}.step`;
    a.click();
    URL.revokeObjectURL(url);
    this.toast(this.t('msgExported'));
  },

  /* -------- 刷新 -------- */
  refreshUI() {
    this.renderSegTable();
    this.onFollowerTypeChange();
    this.compute();
  }
};

/* =====================================================================
   方案管理 / 文件导入导出 / A4 打印（OKS 风格工具栏）
   ===================================================================== */
const $id = (id) => document.getElementById(id);
const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

Object.assign(App, {
  STORE_KEY: 'cam_schemes',
  DRAFT_KEY: 'cam_draft',
  SCHEMA: 'cylindricalcam',

  /* ---------- 基础工具 ---------- */
  toast(msg) {
    const el = $id('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => el.classList.remove('on'), 1900);
  },

  download(name, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  },

  markDirty(v) {
    this.state.dirty = !!v;
    const d = $id('dirty');
    if (d) d.hidden = !v;
  },

  schemeName() {
    const el = $id('schemeName');
    return (el && el.value || '').trim();
  },

  setSchemeName(name) {
    const el = $id('schemeName');
    if (el) el.value = name || '';
  },

  /* ---------- 草稿 ---------- */
  loadDraft() {
    try { return JSON.parse(localStorage.getItem(this.DRAFT_KEY) || 'null'); } catch (e) { return null; }
  },

  persistDraft() {
    clearTimeout(this._draftT);
    this._draftT = setTimeout(() => {
      try {
        localStorage.setItem(this.DRAFT_KEY, JSON.stringify({
          name: this.schemeName(), data: this.payload(this.schemeName()), at: Date.now()
        }));
      } catch (e) { /* 忽略配额错误 */ }
    }, 500);
  },

  clearDraft() {
    clearTimeout(this._draftT);
    try { localStorage.removeItem(this.DRAFT_KEY); } catch (e) {}
  },

  /* ---------- 方案数据 ---------- */
  payload(name) {
    const st = this.state;
    if (st.camType === 'compound') {
      st.layerStore[st.activeLayer] = { params: this.getParamFields(), segments: st.segments };
    }
    const layers = (st.camType === 'compound' && st.layerStore[0] && st.layerStore[1])
      ? JSON.parse(JSON.stringify(st.layerStore)) : null;
    return {
      schema: this.SCHEMA, version: '1.1',
      name: name || this.schemeName() || '未命名方案',
      camType: st.camType || 'single',
      params: JSON.parse(JSON.stringify(st.params || this.getParamFields())),
      segments: JSON.parse(JSON.stringify(st.segments || [])),
      layers,
      savedAt: new Date().toISOString()
    };
  },

  applyPayload(data) {
    if (!data || typeof data !== 'object' || !data.params) return false;
    const set = (id, v) => { const el = $id(id); if (el && v !== undefined && v !== null) el.value = v; };
    const comp = data.camType === 'compound' && Array.isArray(data.layers) && data.layers[0] && data.layers[1];

    if (comp) {
      set('p_camType', 'compound');
      this.state.camType = 'compound';
      this.state.layerStore = JSON.parse(JSON.stringify(data.layers));
      this.state.activeLayer = 0;
      this.state.ptsByLayer = [null, null];
      this.applyLayerToUI(this.state.layerStore[0]);
      this.syncLayer2Derived();
      this.renderLayerUI();
      this.compute();
      return true;
    }

    set('p_camType', 'single');
    this.state.camType = 'single';
    this.state.layerStore = [null, null];
    this.state.ptsByLayer = [null, null];
    if (Array.isArray(data.segments) && data.segments.length) {
      this.state.segments = JSON.parse(JSON.stringify(data.segments));
    }
    const p = data.params || {};
    const map = [
      ['p_baseDia', p.baseDia], ['p_camWidth', p.camWidth], ['p_rollerDia', p.rollerDia],
      ['p_rollerWidth', p.rollerWidth], ['p_initialHt', p.initialHt], ['p_resolution', p.resolution],
      ['p_handedness', p.handedness], ['p_followerType', p.followerType],
      ['p_offset', p.offset], ['p_motionDir', p.motionDir], ['p_tiltAngle', p.tiltAngle],
      ['p_swingLen', p.swingLen], ['p_fulcrumDist', p.fulcrumDist], ['p_swingInitAngle', p.swingInitAngle],
      ['p_camSpeed', p.camSpeed], ['p_loadMass', p.loadMass], ['p_springForce', p.springForce],
      ['p_pressAngleLimit', p.pressAngleLimit], ['p_rollerCount', p.rollerCount]
    ];
    map.forEach(([id, v]) => set(id, v));
    if (p.efficiency != null) set('p_efficiency', Math.round(p.efficiency * 100));
    if (Array.isArray(p.rollerAngles)) set('p_rollerAngles', p.rollerAngles.join(', '));
    const off = $id('p_offset');
    if (off) off.dataset.userSet = '1';

    this.renderSegTable();
    this.onFollowerTypeChange();
    this.compute();
    return true;
  },

  onLoadFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!this.applyPayload(data)) throw new Error('schema');
        this.markDirty(false);
        this.toast(this.t('msgLoaded'));
      } catch (e) {
        this.toast(this.t('msgBadFile'));
      }
      input.value = '';
    };
    reader.readAsText(f);
  },

  /* ---------- 指标 / 卡片 / 状态 ---------- */
  // 在点列上按角度线性插值取扭矩（N·mm）
  torqueAtPhi(pts, deg) {
    if (!pts || !pts.length) return 0;
    const d = ((deg % 360) + 360) % 360;
    let lo = 0, hi = pts.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (pts[mid].phi <= d) lo = mid; else hi = mid;
    }
    const a = pts[lo], b = pts[hi] || a;
    const k = (d - a.phi) / ((b.phi - a.phi) || 1);
    const t = Math.max(0, Math.min(1, k));
    return (a.torqueNmm || 0) + ((b.torqueNmm || 0) - (a.torqueNmm || 0)) * t;
  },

  metrics() {
    const single = this.state.points || [];
    const compound = this._curveIsCompound();
    const P0 = compound ? (this.state.ptsByLayer[0] || []) : [];
    const P1 = compound ? (this.state.ptsByLayer[1] || []) : [];
    const layers = compound ? [P0, P1] : [single];
    let amax = 0, nmax = 0, smin = Infinity, smax = -Infinity, ptsCount = 0;
    layers.forEach(pts => {
      if (!pts || !pts.length) return;
      ptsCount += pts.length;
      pts.forEach(q => {
        amax = Math.max(amax, Math.abs(q.alphaDeg || 0));
        nmax = Math.max(nmax, Math.abs(q.forceN || 0));
        smin = Math.min(smin, q.s); smax = Math.max(smax, q.s);
      });
    });
    if (ptsCount === 0) return null;
    // 输入扭矩：同一根轴上逐相位叠加各层扭矩，再取最大绝对值
    let tmaxNmm = 0;
    if (compound && P0.length && P1.length) {
      for (let d = 0; d < 360; d += 0.5) {
        const t = this.torqueAtPhi(P0, d) + this.torqueAtPhi(P1, d);
        if (Math.abs(t) > tmaxNmm) tmaxNmm = Math.abs(t);
      }
    } else {
      layers[0].forEach(q => { if (Math.abs(q.torqueNmm || 0) > tmaxNmm) tmaxNmm = Math.abs(q.torqueNmm || 0); });
    }
    const al = this.state.alerts || [];
    return {
      amax, tmax: tmaxNmm / 1000, nmax, stroke: smax - smin, points: compound ? ptsCount : (this.state.points || []).length,
      e: al.filter(a => a.level === 'E').length,
      w: al.filter(a => a.level === 'W').length,
      limit: (this.state.params && this.state.params.pressAngleLimit) || 30
    };
  },

  renderCards() {
    const box = $id('cards');
    if (!box) return;
    const m = this.metrics();
    if (!m) { box.innerHTML = ''; return; }
    const cls = m.amax > m.limit ? 'bad' : (m.amax > m.limit * 0.85 ? 'warn' : 'ok');
    const chk = m.e > 0 ? 'bad' : (m.w > 0 ? 'warn' : 'ok');
    const card = (c, label, val, unit, sub) =>
      `<div class="card ${c}"><div class="cl">${label}</div><div class="cv">${val}<small>${unit || ''}</small></div><div class="cs">${sub || ''}</div></div>`;
    const eta = (this.state.params && isFinite(this.state.params.efficiency)) ? this.state.params.efficiency : null;
    const etaTxt = eta != null ? ` · η ${(eta * 100).toFixed(0)}%` : '';
    box.innerHTML =
      card(cls, this.t('cardAlpha'), m.amax.toFixed(2), '°', this.t('cardLimit', { v: m.limit.toFixed(0) })) +
      card('', this.t('cardTorque'), m.tmax.toFixed(2), 'N·m', 'T<sub>max</sub>' + etaTxt) +
      card('', this.t('cardForce'), m.nmax.toFixed(0), 'N', 'N<sub>max</sub>') +
      card('', this.t('cardStroke'), m.stroke.toFixed(2), 'mm', 's<sub>max</sub> − s<sub>min</sub>') +
      card('', this.t('cardPoints'), m.points, '', 'φ 0 – 360°') +
      card(chk, this.t('cardChecks'), (m.e + m.w) ? ('✕' + m.e + ' !' + m.w) : '✓', '', this.t('outStatus'));
  },

  updateStatus() {
    const pill = $id('statusSum');
    const m = this.metrics();
    const fatal = this.state.hasFatalInput;
    if (pill) {
      if (fatal) { pill.className = 'pill bad'; pill.textContent = this.t('statusBad'); }
      else if (!m) { pill.className = 'pill'; pill.textContent = this.t('statusIdle'); }
      else if (m.e > 0) { pill.className = 'pill bad'; pill.textContent = this.t('statusBad'); }
      else if (m.w > 0) { pill.className = 'pill warn'; pill.textContent = this.t('statusWarn'); }
      else { pill.className = 'pill ok'; pill.textContent = this.t('statusOk'); }
    }
    const at = $id('alertTag');
    if (at) at.textContent = m ? ('E ' + m.e + ' · W ' + m.w) : '';
    const vt = $id('vizTag');
    if (vt) vt.textContent = m ? (m.points + ' pts') : '';
    const ct = $id('calcTime');
    if (ct) ct.textContent = m ? new Date().toLocaleTimeString() : '';
    const segCnt = $id('cntSegs');
    if (segCnt) {
      const sum = (this.state.segments || []).reduce((a, s) => a + (+s.angle || 0), 0);
      segCnt.textContent = (this.state.segments || []).length + ' 段 · Σ ' + sum.toFixed(0) + '°';
    }
  },

  updateCounts() {
    document.querySelectorAll('.left-col .grp').forEach(g => {
      const cnt = g.querySelector('.cnt');
      if (!cnt || cnt.id === 'cntSegs') return;
      const n = g.querySelectorAll('.rows input, .rows select').length;
      cnt.textContent = n ? (n + ' 项') : '';
    });
  },

  afterCompute() {
    this.renderCards();
    this.updateStatus();
    this.updateCounts();
    if (this.state.dirty) this.persistDraft();
  },

  /* ---------- 方案存储 ---------- */
  Store: {
    list() {
      try {
        const a = JSON.parse(localStorage.getItem('cam_schemes') || '[]');
        return Array.isArray(a) ? a : [];
      } catch (e) { return []; }
    },
    saveAll(a) {
      try { localStorage.setItem('cam_schemes', JSON.stringify(a)); }
      catch (e) { if (App.toast) App.toast('localStorage 写入失败'); }
    }
  },

  summaryOf() {
    const m = this.metrics();
    const p = this.state.params || {};
    return m ? { base: p.baseDia, stroke: +m.stroke.toFixed(2), amax: +m.amax.toFixed(2), e: m.e, w: m.w } : null;
  },

  saveScheme(forceNew) {
    const name0 = this.schemeName();
    if (!name0) { this.toast(this.t('msgNoname')); return; }
    let name = name0;
    const list = this.Store.list();
    let idx = list.findIndex(s => s.id === this.state.curId);
    if (idx >= 0 && forceNew) { idx = -1; this.state.curId = null; }
    if (idx < 0) {
      const dup = list.findIndex(s => s.name === name);
      if (dup >= 0) {
        if (!forceNew && confirm(this.t('msgDup'))) idx = dup;
        else name = name + ' (副本)';
      }
    }
    const now = new Date().toISOString();
    const o = this.payload(name);
    o.id = idx >= 0 ? list[idx].id : ('s' + Date.now() + Math.floor(Math.random() * 100));
    o.createdAt = idx >= 0 ? (list[idx].createdAt || now) : now;
    o.updatedAt = now;
    o.summary = this.summaryOf();
    if (idx >= 0) list[idx] = o; else { list.push(o); this.state.curId = o.id; }
    this.setSchemeName(name);
    this.Store.saveAll(list);
    this.markDirty(false);
    this.clearDraft();
    this.renderDrawer();
    this.toast(this.t('msgSaved'));
  },

  renderDrawer() {
    const box = $id('schList');
    if (!box) return;
    const list = this.Store.list();
    if (!list.length) { box.innerHTML = '<div class="empty">' + escHtml(this.t('drawerEmpty')) + '</div>'; return; }
    box.innerHTML = '<div style="font-size:10.5px;color:#8b95a5;margin:0 2px 6px">' +
      escHtml(this.t('drawerCount', { n: list.length })) + '</div>' +
      list.map(s => {
        const sm = s.summary || {};
        const sb = [
          sm.base ? ('Ø' + sm.base + ' mm') : '',
          sm.stroke != null ? ('s ' + sm.stroke + ' mm') : '',
          sm.amax != null ? ('α ' + sm.amax + '°') : '',
          (sm.e || sm.w) ? ('✕' + (sm.e || 0) + ' !' + (sm.w || 0)) : '✓'
        ].filter(Boolean).join(' · ');
        return '<div class="sch' + (s.id === this.state.curId ? ' cur' : '') + '" data-id="' + s.id + '">' +
          '<div class="sn">' + escHtml(s.name) + (s.id === this.state.curId ? '<span class="cur">CURRENT</span>' : '') + '</div>' +
          '<div class="sm">' + (s.updatedAt ? new Date(s.updatedAt).toLocaleString() : '') + '</div>' +
          '<div class="sm">' + escHtml(sb) + '</div>' +
          '<div class="sb"><button data-op="load">' + escHtml(this.t('btnLoad')) + '</button>' +
          '<button data-op="copy">' + escHtml(this.t('btnCopy')) + '</button>' +
          '<button data-op="rename">' + escHtml(this.t('btnRename')) + '</button>' +
          '<button data-op="del" class="del">' + escHtml(this.t('btnDel')) + '</button></div></div>';
      }).join('');
  },

  drawerOp(ev) {
    const btn = ev.target.closest('button[data-op]');
    if (!btn) return;
    const id = btn.closest('.sch').dataset.id;
    const list = this.Store.list();
    const i = list.findIndex(s => s.id === id);
    if (i < 0) { this.toast(this.t('msgNoScheme')); return; }
    const op = btn.dataset.op;
    if (op === 'load') {
      if (!this.applyPayload(list[i])) { this.toast(this.t('msgBadFile')); return; }
      this.state.curId = id;
      this.setSchemeName(list[i].name);
      this.markDirty(false);
      this.clearDraft();
      this.renderDrawer();
      this.toast(this.t('msgLoaded'));
    } else if (op === 'copy') {
      const o = JSON.parse(JSON.stringify(list[i]));
      o.id = 's' + Date.now();
      o.name = list[i].name + ' (副本)';
      o.updatedAt = new Date().toISOString();
      list.push(o);
      this.Store.saveAll(list);
      this.renderDrawer();
      this.toast(this.t('msgCopied'));
    } else if (op === 'rename') {
      const n = prompt(this.t('btnRename'), list[i].name);
      if (!n || !n.trim()) return;
      list[i].name = n.trim();
      list[i].updatedAt = new Date().toISOString();
      this.Store.saveAll(list);
      if (this.state.curId === id) this.setSchemeName(n.trim());
      this.renderDrawer();
      this.toast(this.t('msgRenamed'));
    } else if (op === 'del') {
      if (!confirm(this.t('btnDel') + ' "' + list[i].name + '" ?')) return;
      list.splice(i, 1);
      this.Store.saveAll(list);
      if (this.state.curId === id) this.state.curId = null;
      this.renderDrawer();
      this.toast(this.t('msgDeleted'));
    }
  },

  /* ---------- 导入 / 导出 ---------- */
  exportJSON(all) {
    if (all) {
      this.download('cam-schemes.json', JSON.stringify({
        schema: this.SCHEMA, version: '1.1', exportedAt: new Date().toISOString(),
        schemes: this.Store.list()
      }, null, 2));
    } else {
      const o = this.payload(this.schemeName() || 'scheme');
      o.summary = this.summaryOf();
      this.download((o.name || 'scheme') + '.json', JSON.stringify(o, null, 2));
    }
    this.toast(this.t('msgExported'));
  },

  importJson(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { this.toast(this.t('msgBadFile')); return; }
    // 旧版单方案文件（含 params 但无 schema）→ 直接载入
    if (data && data.params && !data.schema && !Array.isArray(data.schemes)) {
      if (this.applyPayload(data)) {
        this.setSchemeName(data.name || this.schemeName());
        this.state.curId = null;
        this.markDirty(true);
        this.toast(this.t('msgLoaded'));
      } else this.toast(this.t('msgBadFile'));
      return;
    }
    const arr = Array.isArray(data) ? data
      : (data && Array.isArray(data.schemes)) ? data.schemes
        : (data && data.params) ? [data] : null;
    if (!arr) { this.toast(this.t('msgBadFile')); return; }
    const list = this.Store.list();
    let n = 0;
    arr.forEach(o => {
      if (!o || typeof o !== 'object' || !o.params) return;
      const now = new Date().toISOString();
      let name = String(o.name || '导入方案');
      if (list.some(s => s.name === name)) name += ' ' + new Date().toLocaleTimeString();
      const item = {
        id: 's' + Date.now() + Math.floor(Math.random() * 1000) + n,
        schema: this.SCHEMA, version: '1.1', name,
        createdAt: o.createdAt || now, updatedAt: now,
        camType: o.camType || 'single', params: o.params, segments: o.segments || [],
        layers: o.layers || null, summary: o.summary || null
      };
      list.push(item);
      n++;
    });
    if (!n) { this.toast(this.t('msgBadFile')); return; }
    this.Store.saveAll(list);
    this.renderDrawer();
    this.toast(this.t('msgImported', { n }));
  },

  /* ---------- 重置 ---------- */
  resetAll() {
    // 回到默认的单层结构，清空复合层缓存，避免残留上一层参数
    const sel = $id('p_camType');
    if (sel) sel.value = 'single';
    this.state.camType = 'single';
    this.state.activeLayer = 0;
    this.state.layerStore = [null, null];
    this.state.ptsByLayer = [null, null];
    this.state.compoundInfo = null;
    this.loadDefault();
    this.state.curId = null;
    this.setSchemeName('未命名方案');
    this.clearDraft();
    this.markDirty(false);
    this.toast(this.t('msgReset'));
  },

  /* ---------- A4 计算书 ---------- */
  buildPrint() {
    const root = $id('printRoot');
    if (!root) return;
    const p = this.state.params || this.getParamFields();
    const m = this.metrics();
    const name = this.schemeName() || '未命名方案';
    const dt = new Date().toLocaleString();
    const pct = (v) => (v * 100).toFixed(0) + ' %';
    const row = (k, v, u) => '<tr><td class="pn">' + escHtml(k) + '</td><td class="pv">' + escHtml(v) +
      '</td><td class="pu">' + escHtml(u || '') + '</td></tr>';
    const rows = [
      [this.t('baseDia'), p.baseDia, 'mm'], [this.t('camWidth'), p.camWidth, 'mm'],
      [this.t('rollerDia'), p.rollerDia, 'mm'], [this.t('rollerWidth'), p.rollerWidth, 'mm'],
      [this.t('initialHt'), p.initialHt, 'mm'], [this.t('divRes'), p.resolution, 'pts/rev'],
      [this.t('handedness'), p.handedness === 'lh' ? this.t('handLH') : this.t('handRH'), ''],
      [this.t('followerType'), p.followerType === 'swing' ? this.t('followerSwing') : this.t('followerTrans'), ''],
      [this.t('offsetDist'), p.offset, 'mm'], [this.t('motionDir'), this.t(p.motionDir === 'horizontal' ? 'dirHoriz' : p.motionDir === 'tilted' ? 'dirTilt' : 'dirVert'), ''],
      [this.t('tiltAngle'), p.tiltAngle, '°'],
      [this.t('camSpeed'), p.camSpeed, 'rpm'], [this.t('loadMass'), p.loadMass, 'kg'],
      [this.t('springForce'), p.springForce, 'N'], [this.t('camEfficiency'), pct(p.efficiency), ''],
      [this.t('pressAngleLimit'), p.pressAngleLimit, '°'],
      [this.t('rollerCount'), p.rollerCount, ''], [this.t('rollerAngles'), (p.rollerAngles || []).join(' / '), '°']
    ];
    const segs = (this.state.segments || []).map((s, i) =>
      '<tr><td class="pv">' + (i + 1) + '</td><td>' + escHtml(s.name) + '</td><td class="pv">' + s.angle +
      '</td><td class="pv">' + s.lift + '</td><td>' + escHtml(this.t(LAW_LABEL_KEY[s.law] || s.law)) + '</td></tr>').join('');
    const alerts = (this.state.alerts || []).map(a => {
      const cls = a.level === 'E' ? 'st-fail' : a.level === 'W' ? 'st-warn' : 'st-pass';
      const st = a.level === 'E' ? '✕' : a.level === 'W' ? '!' : 'i';
      const note = [a.impact ? this.t('impactPrefix') + a.impact : '', a.suggestion ? '→ ' + a.suggestion : ''].filter(Boolean).join(' ');
      return '<tr class="' + cls + '"><td class="ps">' + st + '</td><td>' + escHtml(a.text) +
        (note ? '<br><i>' + escHtml(note) + '</i>' : '') + '</td></tr>';
    }).join('');
    let chart = '';
    try {
      const cv = $id('cvCurves');
      if (cv && cv.width) chart = '<div class="pr-charts"><img src="' + cv.toDataURL('image/png') + '" alt="curves"></div>';
    } catch (e) {}
    const metricLine = m ? [
      this.t('cardAlpha') + ' ' + m.amax.toFixed(2) + '°',
      this.t('cardTorque') + ' ' + m.tmax.toFixed(2) + ' N·m',
      this.t('cardForce') + ' ' + m.nmax.toFixed(0) + ' N',
      this.t('cardStroke') + ' ' + m.stroke.toFixed(2) + ' mm'
    ].join('　|　') : '';

    root.innerHTML =
      '<div class="pr-hd"><div class="pr-t">' + escHtml(this.t('printTitle')) + '</div>' +
      '<div class="pr-m">' + escHtml(name) + '　·　' + escHtml(this.t('printTime')) + ' ' + escHtml(dt) + '</div>' +
      (metricLine ? '<div class="pr-m">' + escHtml(metricLine) + '</div>' : '') + '</div>' +
      '<h2>' + escHtml(this.t('printParams')) + '</h2>' +
      '<table class="pr-tbl"><tbody>' + rows.map(r => row(r[0], r[1], r[2])).join('') + '</tbody></table>' +
      '<h2>' + escHtml(this.t('printSegs')) + '</h2>' +
      '<table class="pr-tbl pr-dt"><thead><tr><th>#</th><th>' + escHtml(this.t('segName')) + '</th><th>' + escHtml(this.t('segAngle')) +
      '</th><th>' + escHtml(this.t('segLift')) + '</th><th>' + escHtml(this.t('segLaw')) + '</th></tr></thead><tbody>' + segs + '</tbody></table>' +
      (alerts ? '<h2>' + escHtml(this.t('printChecks')) + '</h2><table class="pr-tbl pr-chk"><tbody>' + alerts + '</tbody></table>' : '') +
      (chart ? '<h2>' + escHtml(this.t('printCurves')) + '</h2>' + chart : '') +
      '<div class="pr-foot">' + escHtml(this.t('printFoot')) + '</div>';
  },

  printDoc() {
    if (!this.state.points || !this.state.points.length) { this.toast(this.t('needCompute')); return; }
    this.buildPrint();
    setTimeout(() => window.print(), 120);
  },

  /* ---------- 初始化外壳 ---------- */
  initShell() {
    if (this._shellReady) return;
    this._shellReady = true;
    if (this.state.curId === undefined) this.state.curId = null;

    const on = (id, ev, fn) => { const el = $id(id); if (el) el.addEventListener(ev, fn); };

    on('btnSave', 'click', () => this.saveScheme(false));
    on('btnSaveAs', 'click', () => this.saveScheme(true));
    on('btnSchemes', 'click', () => { $id('drawer').hidden = false; this.renderDrawer(); });
    on('btnDrawerClose', 'click', () => { $id('drawer').hidden = true; });
    on('schList', 'click', (e) => this.drawerOp(e));
    on('btnImport', 'click', () => $id('fileIn').click());
    on('btnImport2', 'click', () => $id('fileIn').click());
    on('fileIn', 'change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { this.importJson(String(r.result)); e.target.value = ''; };
      r.readAsText(f);
    });
    on('btnExport', 'click', () => this.exportJSON(false));
    on('btnExportAll', 'click', () => this.exportJSON(true));
    on('btnCsv', 'click', () => this.exportCSV());
    on('btnStep', 'click', () => this.exportSTEP());
    on('btnPrint', 'click', () => this.printDoc());
    on('btnReset', 'click', () => this.resetAll());
    on('langSel', 'change', (e) => this.setLang(e.target.value));

    const nm = $id('schemeName');
    if (nm) {
      nm.addEventListener('input', () => this.markDirty(true));
      nm.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.saveScheme(false); });
    }

    // 顶栏 / 侧栏折叠
    document.querySelectorAll('.blk>h3').forEach(h => {
      h.addEventListener('click', () => h.parentNode.classList.toggle('closed'));
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); this.saveScheme(false); }
    });

    // 修改即脏 + 草稿
    document.addEventListener('input', (e) => {
      if (!e.target.closest) return;
      if (e.target.closest('.left-col') || e.target.closest('.seg-list')) {
        this.markDirty(true);
        this.persistDraft();
      }
    });
    document.addEventListener('change', (e) => {
      if (!e.target.closest) return;
      if (e.target.closest('.left-col') || e.target.closest('.seg-list')) {
        this.markDirty(true);
        this.persistDraft();
      }
    });

    // 恢复草稿（上次未保存的编辑）
    const d = this.loadDraft();
    if (d && d.data) {
      try {
        if (this.applyPayload(d.data)) {
          if (d.name) this.setSchemeName(d.name);
          this.markDirty(true);
        }
      } catch (e) {}
    }

    this.renderCards();
    this.updateStatus();
    this.updateCounts();
  }
});

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
