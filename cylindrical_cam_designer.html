<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆柱凸轮设计工具 · Cylindrical Cam Designer</title>
<style>
/* ========== OKS 工程计算视觉系统（与「整机设计计算工具」一致） ========== */
:root{
  --bg:#e9edf3; --panel:#ffffff; --panel2:#f5f7fa; --panel-alt:#f5f7fa;
  --ink:#1b2430; --ink2:#5b6676; --ink3:#8b95a5;
  --text:#1b2430; --text-dim:#5b6676; --text-muted:#8b95a5;
  --line:#d3dae4; --line2:#e6ebf2; --border:#d3dae4; --border-strong:#c3ccd8;
  --acc:#14568f; --acc2:#e7f0f9; --acc3:#bfd6ea; --primary:#14568f; --primary-alt:#14568f;
  --primary-grad:linear-gradient(180deg,#173a58,#0e2337);
  --ok:#1c7a45; --okbg:#e9f6ee; --warn:#9a6b12; --warnbg:#fcf5e2; --bad:#b33326; --badbg:#fdecea;
  --info:#14568f; --info-bg:#e7f0f9; --warn-bg:#fcf5e2; --err-bg:#fdecea;
  --top:#0e2337; --top2:#173a58;
  --shadow:0 1px 6px rgba(9,20,32,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;
  --canvas-bg:#ffffff; --axis:#8b95a5; --grid:#e6ebf2;
  --line-s:#14568f; --line-v:#0b7285; --line-a:#b45309; --line-j:#1c7a45;
  --line-alpha:#6d28d9; --line-force:#0f766e; --line-norm:#b33326; --line-torque:#c026d3;
  --cam-surface:#c9d9e8; --cam-edge:#14568f; --roller:#c2410c; --follower-rod:#8b95a5;
  --stroke-good:#1c7a45; --stroke-warn:#9a6b12; --stroke-info:#14568f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:12px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font-family:inherit;font-size:12px;color:inherit}
button{cursor:pointer}
canvas{max-width:100%;display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c2cbd8;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 14px;background:linear-gradient(180deg,var(--top2),var(--top));color:#dce7f2;
  border-bottom:1px solid #0a1a28;box-shadow:0 1px 6px rgba(9,20,32,.25)}
.tt{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.tt .logo{color:#5fa8e0;font-size:14px}
.tt .t1{font-size:13.5px;font-weight:600;letter-spacing:.3px}
.tt .t2{font-size:10px;color:#7e99b3;font-family:var(--mono)}
.scheme{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.name{width:190px;padding:4px 7px;background:#0a1c2c;border:1px solid #2a4b6a;color:#eaf2fa;border-radius:var(--r)}
.name:focus{outline:none;border-color:#5fa8e0}
.dirty{font-size:10px;padding:1px 6px;border-radius:9px;background:#7a4a05;color:#ffd98a;border:1px solid #a97516;white-space:nowrap}
.acts{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:auto}
.acts button{padding:4px 9px;background:#1b3d5c;border:1px solid #2f587c;color:#dbe8f5;border-radius:var(--r);white-space:nowrap}
.acts button:hover{background:#28577f;border-color:#4d7ea8}
.acts button:active{background:#0f2c45}
.acts button.pri{background:#1f5f92;border-color:#3f80b5}
.acts .sel{padding:4px 5px;background:#0a1c2c;border:1px solid #2a4b6a;color:#dbe8f5;border-radius:var(--r);max-width:130px}
.acts .sep{width:1px;height:18px;background:#2a4b6a}

/* ---------- 提示条 ---------- */
.notice{display:flex;gap:8px;align-items:flex-start;padding:6px 14px;background:#fff8e1;color:#7a5406;
  border-bottom:1px solid #f0dfa8;font-size:11.5px}

/* ---------- 布局：强制左右两栏（兼容 1280/1366 笔记本与系统缩放） ---------- */
main{display:grid;grid-template-columns:clamp(324px,23vw,470px) minmax(0,1fr);gap:14px;align-items:start;
  width:100%;max-width:1920px;margin:0 auto;padding:14px 18px}
@media (max-width:1439px){
  main{grid-template-columns:334px minmax(0,1fr);gap:10px;padding:10px 12px}
}
@media (min-width:1600px){
  main{grid-template-columns:clamp(420px,23vw,480px) minmax(0,1fr);gap:16px;padding:16px 22px}
}
@media (max-width:1023px){
  main{grid-template-columns:300px minmax(0,1fr);gap:8px;padding:8px}
}
@media (max-width:759px){
  main{grid-template-columns:264px minmax(0,1fr);gap:7px;padding:7px}
}
.left-col{position:sticky;top:48px;max-height:calc(100vh - 58px);overflow:auto;padding-right:2px;min-width:0}
.right-col{min-width:0}

/* ---------- 参数分组 ---------- */
.grp,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.grp>summary{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-weight:600;font-size:12px;list-style:none;cursor:pointer;user-select:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .no{font-family:var(--mono);color:var(--acc);font-size:11px}
.grp>summary .cnt{margin-left:auto;font-weight:400;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.grp>summary .car{color:var(--ink3);font-size:10px;transition:transform .15s}
.grp[open]>summary .car{transform:rotate(90deg)}
.grp .rows{padding:5px 8px 7px}
.panel>h2{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-size:12px;font-weight:600}
.panel>h2 .icon{font-size:11px;color:var(--acc)}
.panel>.param-grid,.panel>.seg-list,.panel>.panel-hint{padding-left:8px;padding-right:8px}

/* ---------- 参数行 ---------- */
.form-row{display:grid;grid-template-columns:minmax(0,1fr) 94px;gap:6px;align-items:center;
  padding:2px 0;border-bottom:1px dashed #eef1f6}
.form-row:last-child{border-bottom:none}
.form-row>label{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);min-width:0}
.form-row>label>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-row .unit{font-size:10px;color:var(--ink3);font-family:var(--mono);white-space:nowrap}
.form-row input[type=number],.form-row input[type=text],.form-row select{
  width:100%;padding:3px 5px;background:#fbfcfe;border:1px solid var(--line);border-radius:3px;
  font-family:var(--mono);font-size:11.5px}
.form-row input[type=number],.form-row input[type=text]{text-align:right}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 2px var(--acc2)}
.form-row input:disabled{background:#eef1f5;color:var(--ink3);cursor:not-allowed}
.form-row input.bad{border-color:var(--bad);background:var(--badbg)}
.type-note{grid-column:1/-1;font-size:10px;color:var(--ink3);font-family:var(--mono);padding:0 0 2px 2px}
.form-row h3{grid-column:1/-1;font-size:11px;color:var(--acc);font-weight:600;margin:6px 0 2px}

/* 复合凸轮层切换 */
.layer-bar{display:flex;gap:4px;padding:6px 8px 0}
.layer-btn{padding:3px 10px;background:#eef2f7;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--ink2)}
.layer-btn.active{background:var(--acc2);border-color:var(--acc3);color:var(--acc);font-weight:600}
.layer-hint{margin:6px 8px 8px;padding:5px 7px;background:var(--acc2);border:1px solid var(--acc3);
  border-radius:3px;font-size:10.5px;color:#28496b;line-height:1.55}

/* ---------- 右侧结果 ---------- */
.outbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px}
.outbar .lb{font-size:11px;color:var(--ink3)}
.outbar .sp{margin-left:auto}
.outbar button{padding:3px 9px;background:#eef2f7;border:1px solid var(--line);border-radius:3px;font-size:11px}
.outbar button:hover{background:var(--acc2);border-color:var(--acc3)}
.pill{font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--ink2);background:#fbfcfe;font-family:var(--mono)}
.pill.ok{background:var(--okbg);border-color:#b9e0c8;color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:#eddb9f;color:var(--warn)}
.pill.bad{background:var(--badbg);border-color:#f2c2bc;color:var(--bad)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px;margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:var(--r);
  padding:6px 8px 7px;min-height:64px;position:relative}
.card.ok{border-left-color:var(--ok)}
.card.warn{border-left-color:var(--warn)}
.card.bad{border-left-color:var(--bad)}
.card .cl{font-size:10.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.card .cl em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:9.5px}
.card .cv{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.25;
  font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.card .cv small{font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:3px;letter-spacing:0}
.card .cs{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.bad .cv{color:var(--bad)}
.card.warn .cv{color:var(--warn)}

.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.blk>h3{margin:0;padding:6px 9px;background:var(--panel2);border-bottom:1px solid var(--line2);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.blk>h3 .car{color:var(--ink3);font-size:10px;transition:transform .15s}
.blk.closed>h3 .car{transform:rotate(-90deg)}
.blk.closed>.body{display:none}
.blk>h3 .tag{margin-left:auto;font-weight:400;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.blk .body{padding:0}

/* 校验提示 */
.alert-list{padding:2px 0}
.alert{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;align-items:start;
  padding:5px 9px;border-bottom:1px solid #f0f3f7;font-size:11.5px}
.alert:last-child{border-bottom:none}
.alert .level{width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;
  font-size:9px;font-family:var(--mono);font-weight:600;margin-top:1px}
.alert-i .level{background:var(--acc2);color:var(--acc);border:1px solid var(--acc3)}
.alert-w .level{background:var(--warnbg);color:var(--warn);border:1px solid #eddb9f}
.alert-e .level{background:var(--badbg);color:var(--bad);border:1px solid #f2c2bc}
.alert .body b{font-weight:600;color:var(--ink)}
.alert .impact{display:block;font-size:10.5px;color:var(--ink2);margin-top:1px}
.alert .suggestion{display:block;font-size:10.5px;color:var(--acc);margin-top:1px}

/* 可视化 */
.viz-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line2);background:#fbfcfe}
.viz-tab{padding:3px 10px;background:#eef2f7;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--ink2)}
.viz-tab:hover{background:var(--acc2);border-color:var(--acc3)}
.viz-tab.active{background:var(--acc);border-color:var(--acc);color:#fff}
.viz-pane{padding:8px}
.canvas-wrap{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:4px;overflow:auto}
.canvas-wrap>canvas{margin:0 auto}
.panel-hint{font-size:10.5px;color:var(--ink3);line-height:1.6;padding:5px 2px 1px}
.row-toggles{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 0 6px}
.rt-label{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.rt-chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink2);
  background:#fbfcfe;border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer}
.rt-chip:hover{border-color:var(--acc3);background:var(--acc2)}
.rt-chip input{margin:0}
.anim-controls{display:flex;align-items:center;gap:5px;padding:6px 2px 0;flex-wrap:wrap}
.anim-btn{width:26px;height:24px;background:#eef2f7;border:1px solid var(--line);border-radius:3px;
  font-size:11px;color:var(--ink2);line-height:1}
.anim-btn:hover{background:var(--acc2);border-color:var(--acc3)}
.anim-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.phase-label{font-family:var(--mono);font-size:11px;color:var(--acc);min-width:88px}
.anim-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}

/* ---------- 运动分段 ---------- */
.seg-list{display:flex;flex-direction:column;gap:6px;padding-top:3px}
.seg-card{border:1px solid var(--line);border-radius:var(--r);background:#fcfdff;overflow:hidden}
.seg-head{display:flex;align-items:center;gap:6px;padding:3px 6px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.seg-idx{font-family:var(--mono);font-size:10px;color:#fff;background:var(--acc);border-radius:9px;padding:0 6px;line-height:15px}
.seg-name{flex:1;min-width:0;padding:2px 5px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:11.5px}
.seg-name:focus{outline:none;border-color:var(--acc)}
.seg-del{width:20px;height:20px;background:transparent;border:1px solid transparent;border-radius:3px;
  color:var(--ink3);font-size:11px;line-height:1}
.seg-del:hover{background:var(--badbg);border-color:#f2c2bc;color:var(--bad)}
.seg-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;padding:5px 6px}
.seg-field{display:flex;flex-direction:column;gap:1px;font-size:10px;color:var(--ink3);min-width:0}
.seg-field .seg-lbl{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.seg-field input,.seg-field select{width:100%;padding:2px 4px;background:#fff;border:1px solid var(--line);
  border-radius:3px;font-family:var(--mono);font-size:11px}
.seg-field input:focus,.seg-field select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.seg-field input:disabled{background:#eef1f5;color:var(--ink3)}
.seg-static{padding:2px 4px;font-family:var(--mono);font-size:11px;color:var(--ink2);background:#f5f7fa;
  border:1px solid var(--line2);border-radius:3px}
.seg-field .follow{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;color:var(--acc)}
.seg-field .follow input{margin:0}
.seg-trans{grid-column:1/-1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  padding:4px 5px;background:var(--acc2);border:1px solid var(--acc3);border-radius:3px;font-size:10px;color:var(--ink2)}
.seg-trans select,.seg-trans input{width:auto;max-width:92px;padding:2px 4px;background:#fff;border:1px solid var(--line);
  border-radius:3px;font-family:var(--mono);font-size:10.5px}
.trans-lbl{color:var(--ink2)}
.trans-eq,.trans-min,.trans-unit{font-family:var(--mono);color:var(--ink3)}
.trans-warn{color:var(--bad);font-family:var(--mono)}
.seg-trans.trans-bad{background:var(--badbg);border-color:#f2c2bc}
.seg-sum{margin:6px 8px 2px;padding:3px 7px;border-radius:3px;font-family:var(--mono);font-size:11px}
.sum-ok{background:var(--okbg);color:var(--ok);border:1px solid #b9e0c8}
.sum-bad{background:var(--badbg);color:var(--bad);border:1px solid #f2c2bc}

/* ---------- 方案抽屉 ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(14,35,55,.18);z-index:60;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--top);color:#dce7f2}
.drawer .dh b{font-size:12.5px}
.drawer .dh button{margin-left:auto;background:#1b3d5c;border:1px solid #2f587c;color:#dbe8f5;padding:2px 8px;border-radius:3px}
.drawer .dl{flex:1;overflow:auto;padding:8px}
.drawer .df{padding:8px 12px;border-top:1px solid var(--line2);display:flex;gap:6px}
.drawer .df button{flex:1;padding:5px;background:#eef2f7;border:1px solid var(--line);border-radius:3px}
.drawer .df button:hover{background:var(--acc2);border-color:var(--acc3)}
.drawer[hidden]{display:none!important}
.sch{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;margin-bottom:6px;background:#fcfdff}
.sch.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc2)}
.sch .sn{font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.sch .sn .cur{font-size:9px;color:var(--acc);border:1px solid var(--acc3);border-radius:8px;padding:0 5px}
.sch .sm{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin:2px 0 4px}
.sch .sb{display:flex;gap:4px;flex-wrap:wrap}
.sch .sb button{padding:2px 7px;font-size:10.5px;background:#eef2f7;border:1px solid var(--line);border-radius:3px}
.sch .sb button:hover{background:var(--acc2);border-color:var(--acc3)}
.sch .sb button.del:hover{background:var(--badbg);border-color:#e5b3ad;color:var(--bad)}
.empty{text-align:center;color:var(--ink3);font-size:11.5px;padding:28px 10px;line-height:1.8}

/* ---------- 提示 / 吐司 ---------- */
.tip{position:fixed;z-index:90;max-width:300px;background:#12283d;color:#dce7f2;font-size:11px;line-height:1.6;
  padding:6px 9px;border-radius:var(--r);box-shadow:0 4px 16px rgba(10,25,40,.3);pointer-events:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;background:#12283d;color:#e8f1f9;
  padding:7px 15px;border-radius:16px;font-size:11.5px;box-shadow:0 6px 20px rgba(10,25,40,.35);opacity:0;
  transition:opacity .18s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- 打印：A4 计算书 ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .topbar,.notice,.left-col,.right-col,.drawer,.tip,.toast{display:none!important}
  main{display:block;padding:0}
  #printRoot{display:block;color:#111;font-size:9pt;line-height:1.45}
  #printRoot h2{font-size:10.5pt;margin:10px 0 4px;padding-bottom:2px;border-bottom:1px solid #999;break-after:avoid}
  .pr-hd{border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
  .pr-hd .pr-t{font-size:15pt;font-weight:700}
  .pr-hd .pr-m{font-size:9pt;color:#333;margin-top:2px}
  .pr-tbl{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
  .pr-tbl th,.pr-tbl td{border:1px solid #bbb;padding:2px 4px;vertical-align:top;word-break:break-word}
  .pr-tbl th{background:#eee;text-align:left;font-weight:600}
  .pr-tbl tr{break-inside:avoid}
  .pr-tbl .pn{width:34%;color:#222}
  .pr-tbl .pv{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
  .pr-tbl .pu{width:10%;color:#666}
  .pr-chk .ps{width:52px;font-weight:700;text-align:center}
  .pr-chk tr.st-pass .ps{color:#1c7a45}
  .pr-chk tr.st-warn .ps{color:#9a6b12}
  .pr-chk tr.st-fail .ps{color:#b33326}
  .pr-chk i{color:#666;font-style:normal;font-size:7.5pt}
  .pr-charts img{width:100%;border:1px solid #ddd}
  .pr-foot{margin-top:10px;border-top:1px solid #999;padding-top:5px;font-size:7.5pt;color:#444}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="tt"><span class="logo">▣</span><span class="t1" data-i18n="title">圆柱凸轮设计工具</span><span class="t2">v1.3</span></div>
  <div class="scheme">
    <input id="schemeName" class="name" value="未命名方案" maxlength="40" spellcheck="false" placeholder="方案名称">
    <span id="dirty" class="dirty" hidden data-i18n="unsaved">未保存</span>
  </div>
  <div class="acts">
    <span class="sep"></span>
    <button id="btnSave" data-i18n="btnSaveScheme">保存</button>
    <button id="btnSaveAs" data-i18n="btnSaveAs">另存为</button>
    <button id="btnSchemes" data-i18n="btnSchemes">方案管理</button>
    <span class="sep"></span>
    <button id="btnImport" data-i18n="btnImport">导入</button>
    <button id="btnExport" data-i18n="btnExportJson">导出 JSON</button>
    <button id="btnCsv" data-i18n="btnExportCsv">导出 CSV</button>
    <button id="btnStep" data-i18n="btnExportStep">导出 STEP</button>
    <button id="btnPrint" data-i18n="btnPrint">打印 / PDF</button>
    <span class="sep"></span>
    <button id="btnReset" data-i18n="btnReset">重置</button>
    <select id="langSel" class="sel">
      <option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option>
    </select>
  </div>
</header>

<div class="notice">
  <b>⚠</b>
  <span data-i18n="appNotice">本工具为凸轮机构初算辅助：结果须由工程师结合加工能力、材料与实测复核，不替代强度校核与型式试验。</span>
</div>

<main>
  <!-- ========== 左侧：参数输入 ========== -->
  <aside class="left-col" id="params">

    <details class="grp" open>
      <summary><span class="no">①</span><span data-i18n="secCamType">凸轮类型</span><span class="cnt" id="cntCamType"></span><span class="car">▸</span></summary>
      <div class="rows">
        <div class="form-row" style="grid-template-columns:1fr">
          <label data-i18n="camTypeLbl">结构形式</label>
          <select id="p_camType" onchange="App.onCamTypeChange()">
            <option value="single" data-i18n="camSingle">单层圆柱凸轮</option>
            <option value="compound" data-i18n="camCompound">复合圆柱凸轮（两层）</option>
          </select>
        </div>
      </div>
      <div class="layer-bar" id="layerBar" style="display:none">
        <button type="button" class="layer-btn active" data-layer="0" onclick="App.switchLayer(0)" data-i18n="layer1">第1层</button>
        <button type="button" class="layer-btn" data-layer="1" onclick="App.switchLayer(1)" data-i18n="layer2">第2层</button>
      </div>
      <div class="layer-hint" id="layerHint" style="display:none" data-i18n="layerHint"></div>
    </details>

    <details class="grp" open>
      <summary><span class="no">②</span><span data-i18n="secBasic">基础参数</span><span class="cnt" id="cntBasic"></span><span class="car">▸</span></summary>
      <div class="rows">
        <div class="form-row">
          <label><span data-i18n="baseDia">基圆直径</span><span class="unit">mm</span></label>
          <input type="number" id="p_baseDia" value="80" step="0.5" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="camWidth">凸轮高度</span><span class="unit">mm</span></label>
          <input type="number" id="p_camWidth" value="60" step="1" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerDia">随动器直径</span><span class="unit">mm</span></label>
          <input type="number" id="p_rollerDia" value="16" step="0.5" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerWidth">凸轮沟槽深度</span><span class="unit">mm</span></label>
          <input type="number" id="p_rollerWidth" value="20" step="1" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="initialHt">初始高度</span><span class="unit">mm</span></label>
          <input type="number" id="p_initialHt" value="20" step="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="divRes">分度分辨率</span><span class="unit" data-i18n="unitPtsRev">点/转</span></label>
          <input type="number" id="p_resolution" value="3600" step="36" min="36">
        </div>
        <div class="form-row">
          <label data-i18n="handedness">旋向</label>
          <select id="p_handedness">
            <option value="rh" data-i18n="handRH">右旋</option>
            <option value="lh" data-i18n="handLH">左旋</option>
          </select>
        </div>
        <div class="type-note" id="noteBaseDia" style="display:none" data-i18n="baseDiaDerivedNote"></div>
      </div>
    </details>

    <details class="grp" open>
      <summary><span class="no">③</span><span data-i18n="secFollower">从动件</span><span class="cnt" id="cntFollower"></span><span class="car">▸</span></summary>
      <div class="rows">
        <div class="form-row">
          <label data-i18n="followerType">从动件类型</label>
          <select id="p_followerType">
            <option value="trans" data-i18n="followerTrans">直动</option>
            <option value="swing" data-i18n="followerSwing">摆动</option>
          </select>
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerCount">随动器数量</span><span class="unit" data-i18n="unitPcs">个</span></label>
          <input type="number" id="p_rollerCount" value="1" step="1" min="1" max="8">
        </div>
        <div class="form-row" style="grid-template-columns:1fr">
          <label><span data-i18n="rollerAngles">相对角度</span><span class="unit">°</span></label>
          <input type="text" id="p_rollerAngles" value="" data-i18n-ph="phRollerAngles">
        </div>

        <div id="groupTrans">
          <div class="form-row"><h3 data-i18n="subTrans">直动参数</h3></div>
          <div class="form-row">
            <label><span data-i18n="offsetDist">随动器中心距</span><span class="unit">mm</span></label>
            <input type="number" id="p_offset" value="40" step="1">
          </div>
          <div class="form-row">
            <label data-i18n="motionDir">运动方向</label>
            <select id="p_motionDir">
              <option value="vertical" data-i18n="dirVert">竖直</option>
              <option value="horizontal" data-i18n="dirHoriz">水平</option>
              <option value="tilted" data-i18n="dirTilt">倾斜</option>
            </select>
          </div>
          <div class="form-row">
            <label><span data-i18n="tiltAngle">倾斜角</span><span class="unit">°</span></label>
            <input type="number" id="p_tiltAngle" value="0" step="5" min="-90" max="90">
          </div>
        </div>

        <div id="groupSwing" class="hidden">
          <div class="form-row"><h3 data-i18n="subSwing">摆动参数</h3></div>
          <div class="form-row">
            <label><span data-i18n="swingLen">摆杆长度</span><span class="unit">mm</span></label>
            <input type="number" id="p_swingLen" value="100" step="1" min="1">
          </div>
          <div class="form-row">
            <label><span data-i18n="fulcrumDist">支点距轴线</span><span class="unit">mm</span></label>
            <input type="number" id="p_fulcrumDist" value="80" step="1" min="1">
          </div>
          <div class="form-row">
            <label><span data-i18n="initialAngle">初始安装角</span><span class="unit">°</span></label>
            <input type="number" id="p_swingInitAngle" value="30" step="1">
          </div>
        </div>
      </div>
    </details>

    <details class="grp" open>
      <summary><span class="no">④</span><span data-i18n="secForce">工况与受力</span><span class="cnt" id="cntForce"></span><span class="car">▸</span></summary>
      <div class="rows">
        <div class="form-row">
          <label><span data-i18n="camSpeed">凸轮转速</span><span class="unit">rpm</span></label>
          <input type="number" id="p_camSpeed" value="60" step="10" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="loadMass">负载质量</span><span class="unit">kg</span></label>
          <input type="number" id="p_loadMass" value="5" step="0.5" min="0">
        </div>
        <div class="form-row">
          <label><span data-i18n="springForce">最大弹簧复位力</span><span class="unit">N</span></label>
          <input type="number" id="p_springForce" value="50" step="5" min="0">
        </div>
        <div class="form-row">
          <label><span data-i18n="camEfficiency">凸轮传动效率</span><span class="unit">%</span></label>
          <input type="number" id="p_efficiency" value="95" step="1" min="10" max="100">
        </div>
        <div class="form-row">
          <label><span data-i18n="pressAngleLimit">压力角限值</span><span class="unit">°</span></label>
          <input type="number" id="p_pressAngleLimit" value="30" step="1" min="5" max="90">
        </div>
      </div>
    </details>

    <details class="grp" open>
      <summary><span class="no">⑤</span><span data-i18n="secSegments">运动分段</span><span class="cnt" id="cntSegs"></span><span class="car">▸</span></summary>
      <div class="rows">
        <div class="form-row" style="grid-template-columns:1fr auto;border-bottom:none">
          <span class="panel-hint" style="padding:0" data-i18n="segHint">勾选「跟随」沿用工况与受力中的转速/负载质量；取消后可单独设置。</span>
          <button class="layer-btn" onclick="App.addSegment()">+ <span data-i18n="addSeg">新增</span></button>
        </div>
        <div class="seg-list" id="segList"></div>
        <div class="seg-sum sum-ok" id="segSum">Σ = 360° ✓</div>
      </div>
    </details>

  </aside>

  <!-- ========== 右侧：结果 + 可视化 ========== -->
  <section class="right-col" id="out">

    <div class="outbar">
      <span class="lb" data-i18n="outStatus">校核状态</span>
      <span id="statusSum" class="pill">—</span>
      <span class="lb" id="calcTime"></span>
      <span class="sp"></span>
      <button onclick="App.compute()" data-i18n="btnRecompute">重新计算</button>
    </div>

    <div id="cards" class="cards"></div>

    <section class="blk" id="blkAlerts">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="secAlerts">校验与提示</span><span class="tag" id="alertTag"></span></h3>
      <div class="body">
        <div class="alert-list" id="alertList">
          <div class="alert alert-i"><span class="level">i</span><span class="body" data-i18n="alertRunCompute">请填写参数后点击"计算"</span></div>
        </div>
      </div>
    </section>

    <section class="blk" id="blkViz">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="secViz">可视化</span><span class="tag" id="vizTag"></span></h3>
      <div class="body">
        <div class="viz-tabs">
          <button class="viz-tab active" onclick="App.switchViz('curves',this)" data-i18n="vizCurves">运动曲线</button>
          <button class="viz-tab" onclick="App.switchViz('flatten',this)" data-i18n="vizFlatten">轮廓展开</button>
          <button class="viz-tab" onclick="App.switchViz('line3d',this)" data-i18n="viz3D">3D 线框</button>
          <button class="viz-tab" onclick="App.switchViz('indic',this)" data-i18n="vizIndic">参数示意</button>
        </div>

        <div id="viz-curves" class="viz-pane">
          <div class="row-toggles" id="rowToggles">
            <span class="rt-label" data-i18n="cvShow">显示</span>
            <label class="rt-chip"><input type="checkbox" data-row="s" checked><span data-i18n="legS">位置</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="v_s" checked><span data-i18n="legV">速度</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="a_s" checked><span data-i18n="legA">加速度</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="j_s" checked><span data-i18n="legJ">跃度</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="alphaDeg" checked><span data-i18n="legAlpha">压力角</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="forceAxial" checked><span data-i18n="legFaxial">沿运动方向</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="forceN" checked><span data-i18n="legN">法向正压力</span></label>
            <label class="rt-chip"><input type="checkbox" data-row="torqueNmm" checked><span data-i18n="legTorque">输入扭矩</span></label>
          </div>
          <div class="canvas-wrap"><canvas id="cvCurves" width="900" height="1260"></canvas></div>
          <p class="panel-hint" data-i18n="cvProbeHint">在曲线上移动或拖动鼠标，查看该角度各参数数值</p>
        </div>

        <div id="viz-flatten" class="viz-pane hidden">
          <div class="canvas-wrap"><canvas id="cvFlatten" width="900" height="480"></canvas></div>
        </div>

        <div id="viz-line3d" class="viz-pane hidden">
          <div class="canvas-wrap"><canvas id="cv3D" width="900" height="520"></canvas></div>
          <p class="panel-hint" data-i18n="view3dHint">拖动旋转视角 · 双击复位</p>
          <div class="anim-controls">
            <button class="anim-btn" onclick="App.animControl('stepRev')" data-i18n-title="tStepRev" title="步进反转">⏮</button>
            <button class="anim-btn" onclick="App.animControl('backward')" data-i18n-title="tBack" title="连续反转">◀</button>
            <button class="anim-btn" onclick="App.animControl('stop')" data-i18n-title="tStop" title="停止">■</button>
            <button class="anim-btn active" onclick="App.animControl('forward')" data-i18n-title="tFwd" title="连续正转">▶</button>
            <button class="anim-btn" onclick="App.animControl('stepFwd')" data-i18n-title="tStepFwd" title="步进正转">⏭</button>
            <span class="phase-label" id="animPhase">φ = 0.0°</span>
            <input type="range" id="animSlider" min="0" max="3600" value="0" oninput="App.animSlider(this.value)">
          </div>
        </div>

        <div id="viz-indic" class="viz-pane hidden">
          <div class="canvas-wrap"><canvas id="cvIndic" width="900" height="460"></canvas></div>
        </div>
      </div>
    </section>

  </section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="dh">
    <b data-i18n="drawerTitle">已保存方案</b>
    <button id="btnDrawerClose" data-i18n="btnClose">关闭</button>
  </div>
  <div class="dl" id="schList"></div>
  <div class="df">
    <button id="btnExportAll" data-i18n="btnExportAll">导出全部方案</button>
    <button id="btnImport2" data-i18n="btnImport">导入</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="printRoot"></div>

/* 运动规律枚举（英文 key 内部使用） */
const LAW_KEYS = ['const','acc','cos','sin','poly345','dwell','mod_trap','trap_cubic'];
const LAW_LABEL_KEY = {
  const: 'segLawConst', acc: 'segLawAcc', cos: 'segLawCos', sin: 'segLawSin',
  poly345: 'segLaw345', dwell: 'segLawDwell', mod_trap: 'segLawModTrap', trap_cubic: 'segLawTrapCubic'
};

/* =====================================================================
   M1: motion-laws.js — 六种运动规律 + 修正梯形
   每个规律输入: tau (0..1, 段内相对位置), h 段升程(mm), phimax 段内转角(°)
   输出: { s, v_phi, a_phi, j_phi }
   v_phi 单位 mm/°, a_phi mm/°², j_phi mm/°³
   ===================================================================== */
const MotionLaws = {
  /* 停歇: s=0 常量 */
  dwell: (tau, h, phimax) => ({
    s: 0, v: 0, a: 0, j: 0
  }),

  /* 等速 */
  const: (tau, h, phimax) => ({
    s: h * tau,
    v: h / phimax,
    a: 0,
    j: 0
  }),

  /* 等加速等减速 (两段: 0..0.5 加速, 0.5..1 减速) */
  acc: (tau, h, phimax) => {
    let s, v, a, j;
    if (tau < 0.5) {
      s = 2 * h * tau * tau;
      v = 4 * h * tau / phimax;
      a = 4 * h / (phimax * phimax);
      j = 0;
    } else {
      s = h - 2 * h * (1 - tau) * (1 - tau);
      v = 4 * h * (1 - tau) / phimax;
      a = -4 * h / (phimax * phimax);
      j = 0;
    }
    return { s, v, a, j };
  },

  /* 余弦加速度 (简谐/摆线的另一半 family) */
  cos: (tau, h, phimax) => ({
    s: h * (1 - Math.cos(Math.PI * tau)) / 2,
    v: h * Math.PI * Math.sin(Math.PI * tau) / (2 * phimax),
    a: h * Math.PI * Math.PI * Math.cos(Math.PI * tau) / (2 * phimax * phimax),
    j: -h * Math.PI * Math.PI * Math.PI * Math.sin(Math.PI * tau) / (2 * phimax * phimax * phimax)
  }),

  /* 正弦加速度 (摆线 Cycloidal) */
  sin: (tau, h, phimax) => ({
    s: h * (tau - Math.sin(2 * Math.PI * tau) / (2 * Math.PI)),
    v: h * (1 - Math.cos(2 * Math.PI * tau)) / phimax,
    a: 2 * Math.PI * h * Math.sin(2 * Math.PI * tau) / (phimax * phimax),
    j: 4 * Math.PI * Math.PI * h * Math.cos(2 * Math.PI * tau) / (phimax * phimax * phimax)
  }),

  /* 3-4-5 多项式 */
  poly345: (tau, h, phimax) => {
    const s = h * (10 * tau * tau * tau - 15 * tau * tau * tau * tau + 6 * tau * tau * tau * tau * tau);
    const v = h * (30 * tau * tau - 60 * tau * tau * tau + 30 * tau * tau * tau * tau) / phimax;
    const a = h * (60 * tau - 180 * tau * tau + 120 * tau * tau * tau) / (phimax * phimax);
    const j = h * (60 - 360 * tau + 360 * tau * tau) / (phimax * phimax * phimax);
    return { s, v, a, j };
  },

  /* 修正梯形 (Modified Trapezoidal)
     在两端用 1/8 段角做正弦过渡，中间 3/4 段恒加速/恒减速
     过渡区可通过 tr 参数调整（本次默认 tr = 1/8）
     随动器半径会限制过渡区最小值，此函数接受 tr 参数
  */
  mod_trap: (tau, h, phimax, tr = 0.125) => {
    // tr: 过渡区占比（每端），0 < tr < 0.25
    // 分 4 段: 0..tr 正弦加速过渡, tr..0.5-tr 恒加速, 0.5-tr..0.5+tr 正弦减速过渡
    // 实际简化实现: 用统一表达
    // 用修正梯形的标准闭合形式（参见凸轮设计教材）
    // 等效 = 正弦加速度 + 梯形加速度的混合

    // 为保持 s/v/a/j 首尾连续（s(0)=0, s(1)=h, v(0)=0, v(1)=0, a(0)=0, a(1)=0）
    // 用以下多项式 + 正弦混合表达
    const k1 = 2 * Math.PI * tr;
    let s, v, a, j;

    if (tau <= tr) {
      // 正弦加速过渡
      const x = tau / tr;
      s = h * (tr / (2 * Math.PI)) * (1 - Math.cos(k1 * x));
      v = (h / phimax) * Math.sin(k1 * x);
      a = (h * k1) / (tr * phimax * phimax) * Math.cos(k1 * x);
      j = -(h * k1 * k1) / (tr * tr * phimax * phimax * phimax) * Math.sin(k1 * x);
    } else if (tau <= 0.5 - tr) {
      // 恒加速段
      const x = (tau - tr) / (0.5 - 2 * tr);
      const s1 = h * (tr / (2 * Math.PI)) * (1 - Math.cos(k1)); // 过渡终点 s
      const v1 = (h / phimax) * Math.sin(k1);                    // 过渡终点 v
      const ac = (2 * h / phimax / phimax) * (Math.PI / (Math.PI - 2 * k1));
      s = s1 + v1 * (0.5 - 2 * tr) * x + 0.5 * ac * ((0.5 - 2 * tr) * x) ** 2;
      v = v1 + ac * (0.5 - 2 * tr) * x;
      a = ac;
      j = 0;
    } else if (tau <= 0.5) {
      // 进入减速前的反向过渡（对称处理）
      // 简化：用整体 0.5 对称构造，不单独列
      const inner = MotionLaws._modTrapHalf(tau, h, phimax, tr);
      s = inner.s; v = inner.v; a = inner.a; j = inner.j;
    } else {
      // 后半段镜像: tau' = 1 - tau
      const t2 = 1 - tau;
      const inner = MotionLaws._modTrapHalf(t2, h, phimax, tr);
      s = h - inner.s;
      v = -inner.v;
      a = inner.a;
      j = -inner.j;
    }
    return { s, v, a, j };
  },

  /* 修正梯形前半段 (0..0.5) 统一处理 */
  _modTrapHalf(tau, h, phimax, tr) {
    // 用一个完整对称函数 0..0.5
    // 基于标准修正梯形公式：a(τ) 在 0..tr 正弦上升, tr..0.5-tr 恒定, 0.5-tr..0.5 正弦下降
    const p = tau / 0.5; // 归一化到 0..1
    const t = tr * 2;    // 归一化后过渡区占比
    let s, v, a, j;
    if (p <= t) {
      const acp = Math.PI / t;
      a = Math.sin(acp * p);
      v = -t / Math.PI * Math.cos(acp * p) + t / Math.PI;
      s = (t / Math.PI) * (p - (t / Math.PI) * Math.sin(acp * p));
      j = acp * Math.cos(acp * p);
    } else if (p <= 1 - t) {
      a = 1;
      v = 2 * p - 2 * t + (t / Math.PI) * Math.cos(Math.PI); // 衔接
      v = 2 * (1 - t); // 恒定
      s = (t / Math.PI) * (t - (t / Math.PI) * Math.sin(Math.PI)) + v * (p - t) + 0.5 * 1 * (p - t) * (p - t);
      j = 0;
    } else {
      const q = (p - (1 - t)) / t;
      a = Math.cos(Math.PI * q);
      v = 2 * (1 - t) - (t / Math.PI) * Math.sin(Math.PI * q);
      // s 积分
      s = (t / Math.PI) * (t - (t / Math.PI) * Math.sin(Math.PI)) + (1 - 2 * t) * (0.5 - 2 * t);
      s += 2 * (1 - t) * t * q;
      s -= (t / (2 * Math.PI)) * (1 - Math.cos(Math.PI * q));
      j = -Math.PI / t * Math.sin(Math.PI * q);
    }
    // 缩放: 幅度 A = 4h / (phimax² * (1 - 4t/π + ... 简化))
    // 使用整体拟合系数
    const K = 8 * h / (phimax * phimax); // 匹配首尾 s(0.5) ≈ h/2
    // 直接按归一化输出
    const a_scale = 8 * h / (phimax * phimax);
    const v_scale = 4 * h / phimax;
    const s_scale = h;
    return {
      s: s * s_scale * 0.5,
      v: v * v_scale * 0.5,
      a: a * a_scale * 0.5,
      j: j * a_scale / phimax * 0.5
    };
  },

  /* 梯形（三次过渡）Trapezoidal with cubic transitions
     速度曲线为梯形：两端用三次平滑（smoothstep）过渡，中间恒加速。
     过渡区比例 tr（每端占整段比例，默认 0.125），e = 2*tr。
     位移/速度/加速度/跃度均首尾连续（s(0)=0, s(1)=h, v(0)=v(1)=0, a(0)=a(1)=0）。
  */
  trap_cubic: (tau, h, phimax, tr = 0.125) => {
    const e = Math.min(Math.max(2 * tr, 1e-4), 0.98);
    const S = (x) => 3 * x * x - 2 * x * x * x;   // 三次 smoothstep 0→1
    const dS = (x) => 6 * x - 6 * x * x;          // dS/dx
    const half = (t) => {                          // 前半段 0..1 的形状函数
      let I1, I2, g, dg;
      if (t <= e) {
        const u = t / e;
        I1 = e * (u * u * u - u * u * u * u / 2);
        I2 = e * e * (u * u * u * u / 4 - u * u * u * u * u / 10);
        g = S(u); dg = dS(u) / e;
      } else if (t <= 1 - e) {
        const d = t - e;
        I1 = 0.5 * e + d;
        I2 = 0.15 * e * e + 0.5 * e * d + 0.5 * d * d;
        g = 1; dg = 0;
      } else {
        const w = (1 - t) / e;
        I1 = 1 - e - e * w * w * w + 0.5 * e * w * w * w * w;
        I2 = (1.15 * e * e - 1.5 * e + 0.5) + e * (1 - e) * (1 - w)
           - (e * e) * (1 - Math.pow(w, 4)) / 4 + 0.1 * e * e * (1 - Math.pow(w, 5));
        g = S(w); dg = -dS(w) / e;
      }
      return { I1, I2, g, dg };
    };
    const firstHalf = tau <= 0.5;
    const t = firstHalf ? tau / 0.5 : (1 - tau) / 0.5;
    const r = half(t);
    const norm = 1 - e;
    const s1 = h * r.I2 / norm;
    const v1 = 2 * h / (norm * phimax) * r.I1;
    const a1 = 4 * h / (norm * phimax * phimax) * r.g;
    const j1 = 8 * h / (norm * phimax * phimax * phimax) * r.dg;
    if (firstHalf) return { s: s1, v: v1, a: a1, j: j1 };
    return { s: h - s1, v: v1, a: -a1, j: j1 };
  },

  /* 公共入口: 根据 law key 调用 */
  compute: (lawKey, tau, h, phimax, extra) => {
    const fn = MotionLaws[lawKey];
    if (!fn) { console.warn('Unknown law:', lawKey); return { s: 0, v: 0, a: 0, j: 0 }; }
    if (lawKey === 'mod_trap' || lawKey === 'trap_cubic') {
      const tr = (extra && extra.transitionRatio) || 0.125;
      return MotionLaws[lawKey](tau, h, phimax, tr);
    }
    return fn(tau, h, phimax);
  }
};

/* =====================================================================
   App: 主控制器
   ===================================================================== */
const App = {
  // 状态
  state: {
    params: null,
    segments: [],
    points: [],    // 逐点结果
    alerts: [],
    currentViz: 'curves',
    lang: 'zh',
    anim: { phase: 0, playing: true, dir: 1, lastT: 0 },
    view3d: { alpha: Math.PI / 6, beta: Math.PI / 5 },
    probePhi: null,
    visibleRows: {},
    dataVersion: 0,
    dirty: false,
    /* 复合圆柱凸轮（两层，同轴径向嵌套） */
    camType: 'single',          // 'single' | 'compound'
    activeLayer: 0,             // 当前编辑/显示的层
    layerStore: [null, null],   // 每层缓存 { params, segments }
    ptsByLayer: [null, null],   // 每层点列
    compoundInfo: null,         // 复合校核结果（层间高度/嵌套可行性）
    inputIssues: [],            // 当前输入自检结果（定位/影响/建议）
    hasFatalInput: false        // 存在致命输入问题时不再重算
  },

  /* -------- 初始化 -------- */
  init() {
    // 恢复语言
    const saved = localStorage.getItem('cam_lang') || 'zh';
    this.setLang(saved, true);
    // 恢复/加载默认分段
    this.loadDefault();
    // 绑定事件
    document.getElementById('p_followerType').addEventListener('change', () => this.onFollowerTypeChange());
    document.getElementById('p_rollerCount').addEventListener('change', () => this.updateRollerAnglesAuto());
    document.getElementById('p_baseDia').addEventListener('change', () => this.onBaseDiaChange());
    document.getElementById('p_offset').addEventListener('input', () => {
      document.getElementById('p_offset').dataset.userSet = '1';
    });
    this.bind3DRotate();
    this.bindCurveProbe();
    this.bindRowToggles();
    // 参数修改后自动重算（无需按计算按钮）
    document.addEventListener('input', (e) => {
      if (e.target.closest && e.target.closest('.left-col')) this.scheduleCompute();
    });
    document.addEventListener('change', (e) => {
      if (e.target.closest && e.target.closest('.left-col')) this.scheduleCompute();
    });
    requestAnimationFrame((t) => this.animLoop(t));
    this.refreshUI();
    this.initShell();
    // 窗口尺寸变化后重新适配画布（宽屏/缩放/分屏）
    window.addEventListener('resize', () => {
      clearTimeout(this._rzT);
      this._rzT = setTimeout(() => {
        this._curveCache = null;
        this.renderAllViz();
      }, 140);
    });
  },

  // 随动器中心距默认跟随基圆直径的一半，人工修改后不再自动跟随
  onBaseDiaChange() {
    const off = document.getElementById('p_offset');
    if (off.dataset.userSet === '1') return;
    const d = parseFloat(document.getElementById('p_baseDia').value);
    if (isFinite(d)) off.value = +(d / 2).toFixed(2);
  },

  // 3D 视图：拖动旋转视角，双击复位
  bind3DRotate() {
    const cv = document.getElementById('cv3D');
    if (!cv) return;
    let dragging = false, lx = 0, ly = 0;
    cv.style.cursor = 'grab';
    cv.addEventListener('pointerdown', (e) => {
      dragging = true; lx = e.clientX; ly = e.clientY;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      cv.style.cursor = 'grabbing';
    });
    cv.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      this.state.view3d.alpha += dx * 0.01;
      this.state.view3d.beta = Math.max(-1.45, Math.min(1.45, this.state.view3d.beta + dy * 0.01));
      if (this.state.currentViz === 'line3d') this.draw3D();
    });
    const stop = () => { dragging = false; cv.style.cursor = 'grab'; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
    cv.addEventListener('pointerleave', stop);
    cv.addEventListener('dblclick', () => {
      this.state.view3d.alpha = Math.PI / 6;
      this.state.view3d.beta = Math.PI / 5;
      if (this.state.currentViz === 'line3d') this.draw3D();
    });
  },

  /* -------- 语言 -------- */
  t(key, vars) {
    const dict = I18N[this.state.lang] || I18N.zh;
    let str = dict[key];
    if (str == null) str = (I18N.en[key] != null ? I18N.en[key] : key);
    if (vars) for (const k in vars) str = str.split('{' + k + '}').join(vars[k]);
    return str;
  },

  setLang(lang) {
    this.state.lang = lang;
    localStorage.setItem('cam_lang', lang);
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : (lang === 'ja' ? 'ja' : 'en');
    const lsel = document.getElementById('langSel');
    if (lsel) lsel.value = lang;
    document.querySelectorAll('[data-lang]').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    const dict = I18N[lang] || I18N.zh;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v != null) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const v = dict[el.dataset.i18nPh];
      if (v != null) el.setAttribute('placeholder', v);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const v = dict[el.dataset.i18nTitle];
      if (v != null) el.setAttribute('title', v);
    });
    // 重新渲染所有依赖语言的动态内容（分段卡片、警告、画布图例）
    document.title = this.t('title');
    this.localizeDefaultSegNames();
    if (this.state.segments && this.state.segments.length) this.renderSegTable(true);
    if (this.state.alerts) this.renderAlerts(this.state.alerts);
    this.renderAllViz();
    if (this.renderCards) this.renderCards();
    if (this.updateStatus) this.updateStatus();
  },

  // 默认分段名（停歇/升程/回程）随语言切换，用户自定义名称保持不动
  localizeDefaultSegNames() {
    const keys = ['segDefaultDwell1', 'segDefaultRise', 'segDefaultDwell2', 'segDefaultFall'];
    const variants = {};
    keys.forEach(k => {
      variants[k] = new Set(['zh', 'en', 'ja'].map(l => I18N[l] && I18N[l][k]).filter(Boolean));
    });
    (this.state.segments || []).forEach(seg => {
      for (const k of keys) {
        if (variants[k].has(seg.name)) { seg.name = this.t(k); break; }
      }
    });
  },

  /* -------- 默认参数 -------- */
  loadDefault() {
    this.getParamFields(); // 读取当前 UI
    // 覆盖默认
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    set('p_baseDia', 80);
    set('p_camWidth', 60);
    set('p_rollerDia', 16);
    set('p_rollerWidth', 20);
    set('p_initialHt', 20);
    set('p_resolution', 3600);
    set('p_followerType', 'trans');
    set('p_handedness', 'rh');
    set('p_offset', 40);
    document.getElementById('p_offset').dataset.userSet = '';
    set('p_motionDir', 'vertical');
    set('p_tiltAngle', 0);
    set('p_camSpeed', 60);
    set('p_loadMass', 5);
    set('p_springForce', 50);
    set('p_efficiency', 95);
    set('p_pressAngleLimit', 30);
    set('p_rollerCount', 1);
    set('p_rollerAngles', '');
    // 默认 4 段: 停歇 90° + 升程 120° + 停歇 60° + 回程 90°
    this.state.segments = [
      { name: this.t('segDefaultDwell1'), angle: 90,  lift: 0,  law: 'dwell',      speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultRise'),   angle: 120, lift: 20, law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultDwell2'), angle: 60,  lift: 20, law: 'dwell',      speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultFall'),   angle: 90,  lift: 0,  law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125 }
    ];
    this.state.segments.forEach(s => {
      if (s.law === 'trap_cubic' || s.law === 'mod_trap') this.applyMinTransition(s);
    });
    this.updateRollerAnglesAuto();
    this.renderSegTable();
    this.onFollowerTypeChange();
    this.compute();
  },

  /* -------- 读取参数 -------- */
  getParamFields() {
    const n = (id) => parseFloat(document.getElementById(id).value);
    const s = (id) => document.getElementById(id).value;
    const rollerCount = parseInt(s('p_rollerCount'), 10);
    let rollerAngles = [];
    const raw = s('p_rollerAngles').trim();
    const parsed = raw ? raw.split(/[,;\s]+/).map(v => parseFloat(v)).filter(v => !isNaN(v)) : [];
    if (parsed.length >= rollerCount) {
      rollerAngles = parsed.slice(0, rollerCount);
    } else {
      // 第一个随动器固定在 0° 作为基准，其余为输入的相对角度，不足的自动均布补齐
      rollerAngles = [0, ...parsed];
      while (rollerAngles.length < rollerCount) rollerAngles.push((360 / rollerCount) * rollerAngles.length);
    }
    this.state.params = {
      baseDia: n('p_baseDia'),
      camWidth: n('p_camWidth'),
      rollerDia: n('p_rollerDia'),
      rollerWidth: n('p_rollerWidth'),
      initialHt: n('p_initialHt'),
      resolution: n('p_resolution'),
      followerType: s('p_followerType'),
      handedness: s('p_handedness'),
      offset: n('p_offset'),
      motionDir: s('p_motionDir'),
      tiltAngle: n('p_tiltAngle'),
      swingLen: n('p_swingLen'),
      fulcrumDist: n('p_fulcrumDist'),
      swingInitAngle: n('p_swingInitAngle'),
      loadMass: n('p_loadMass'),
      camSpeed: n('p_camSpeed'),
      springForce: n('p_springForce'),
      efficiency: n('p_efficiency') / 100,
      pressAngleLimit: n('p_pressAngleLimit'),
      rollerCount,
      rollerAngles
    };
    return this.state.params;
  },

  onFollowerTypeChange() {
    const t = document.getElementById('p_followerType').value;
    document.getElementById('groupTrans').classList.toggle('hidden', t !== 'trans');
    document.getElementById('groupSwing').classList.toggle('hidden', t !== 'swing');
    this.scheduleCompute();
  },

  updateRollerAnglesAuto() {
    const n = parseInt(document.getElementById('p_rollerCount').value) || 1;
    const angles = [];
    for (let i = 1; i < n; i++) angles.push(+(360 / n * i).toFixed(1));
    document.getElementById('p_rollerAngles').value = angles.join(', ');
  },

  /* -------- 分段卡片 -------- */
  addSegment() {
    this.state.segments.push({
      name: this.t('segNo') + (this.state.segments.length + 1),
      angle: 60, lift: 10, law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125
    });
    this.applyMinTransition(this.state.segments[this.state.segments.length - 1]);
    this.renderSegTable();
    this.scheduleCompute();
  },

  removeSegment(idx) {
    this.state.segments.splice(idx, 1);
    this.renderSegTable();
    this.scheduleCompute();
  },

  renderSegTable(skipLawRefresh) {
    const sum = this.state.segments.reduce((a, s) => a + s.angle, 0);
    const list = document.getElementById('segList');
    const lawLabel = (k) => this.t(LAW_LABEL_KEY[k] || k);
    list.innerHTML = this.state.segments.map((seg, i) => {
      const cum = this.state.segments.slice(0, i).reduce((a, s) => a + s.angle, 0);
      const lawOpts = LAW_KEYS.map(k =>
        `<option value="${k}" ${k === seg.law ? 'selected' : ''}>${lawLabel(k)}</option>`
      ).join('');
      const massFollow = (seg.mass === null || seg.mass === undefined);
      const speedFollow = (seg.speed === null || seg.speed === undefined);
      const defSpeed = parseFloat((document.getElementById('p_camSpeed') || {}).value) || 60;
      const defMass = parseFloat((document.getElementById('p_loadMass') || {}).value);
      const speedDisp = speedFollow ? defSpeed : seg.speed;
      const massDisp = massFollow ? (isNaN(defMass) ? '' : defMass) : seg.mass;

      // 梯形过渡可编辑行（比例 / 长度）
      let transRow = '';
      if (seg.law === 'trap_cubic' || seg.law === 'mod_trap') {
        const RbNow = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
        const rollerDia = parseFloat((document.getElementById('p_rollerDia') || {}).value) || 8;
        const arc = RbNow * Math.abs(seg.angle) * Math.PI / 180;
        const mode = seg.transitionMode === 'length' ? 'length' : 'ratio';
        const tr = this.getSegTr(seg, RbNow);
        const lenMm = tr * arc;
        const minPct = arc > 0 ? (rollerDia / arc * 100) : 0;
        const bad = lenMm + 1e-9 < rollerDia;
        const val = mode === 'length'
          ? (seg.transitionLength > 0 ? seg.transitionLength : lenMm).toFixed(2)
          : (tr * 100).toFixed(2);
        transRow = `<div class="seg-trans ${bad ? 'trans-bad' : ''}">
          <span class="trans-lbl">${this.t('segTransLbl')}</span>
          <select onchange="App.setTransMode(${i},this.value)">
            <option value="ratio" ${mode === 'ratio' ? 'selected' : ''}>${this.t('transByRatio')}</option>
            <option value="length" ${mode === 'length' ? 'selected' : ''}>${this.t('transByLength')}</option>
          </select>
          <input type="number" min="0.01" step="0.5" value="${val}" onchange="App.setTransValue(${i},this.value)">
          <span class="trans-unit">${mode === 'ratio' ? '%' : 'mm'}</span>
          <span class="trans-eq">${mode === 'ratio' ? '≈ ' + lenMm.toFixed(2) + ' mm' : '≈ ' + (tr * 100).toFixed(1) + ' %'}</span>
          <span class="trans-min">${this.t('transMin', { d: rollerDia.toFixed(2), r: minPct.toFixed(1) })}</span>
          ${bad ? `<span class="trans-warn">⚠ ${this.t('transTooShort', { l: lenMm.toFixed(2), d: rollerDia.toFixed(2) })}</span>` : ''}
        </div>`;
      }

      return `<div class="seg-card" data-idx="${i}">
        <div class="seg-head">
          <span class="seg-idx">${i + 1}</span>
          <input type="text" class="seg-name" value="${seg.name}" onchange="App.state.segments[${i}].name=this.value">
          <button class="seg-del" onclick="App.removeSegment(${i})" title="✕">✕</button>
        </div>
        <div class="seg-fields">
          <label class="seg-field"><span>${this.t('segAngleLbl')}</span>
            <input type="number" value="${seg.angle}" step="1" onchange="App.state.segments[${i}].angle=+this.value;App.renderSegTable();App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segLiftLbl')}</span>
            <input type="number" value="${seg.lift}" step="0.5" onchange="App.state.segments[${i}].lift=+this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segLawLbl')}</span>
            <select onchange="App.onSegLawChange(${i},this.value)">${lawOpts}</select></label>
          <label class="seg-field"><span class="seg-lbl">${this.t('segSpeedLbl')}
              <span class="follow"><input type="checkbox" ${speedFollow ? 'checked' : ''} onchange="App.toggleSegFollow(${i},'speed',this.checked)">${this.t('followDefault')}</span></span>
            <input type="number" value="${speedDisp}" step="10" min="1" ${speedFollow ? 'disabled' : ''}
              onchange="App.state.segments[${i}].speed = +this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span class="seg-lbl">${this.t('segMassLbl')}
              <span class="follow"><input type="checkbox" ${massFollow ? 'checked' : ''} onchange="App.toggleSegFollow(${i},'mass',this.checked)">${this.t('followDefault')}</span></span>
            <input type="number" value="${massDisp}" step="0.5" min="0" ${massFollow ? 'disabled' : ''}
              onchange="App.state.segments[${i}].mass = +this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segCumLbl')}</span>
            <div class="seg-static">${i === 0 ? '—' : cum + '°'}</div></label>
          ${transRow}
        </div>
      </div>`;
    }).join('');

    const sumCell = document.getElementById('segSum');
    if (Math.abs(sum - 360) < 0.01) {
      sumCell.className = 'seg-sum sum-ok';
      sumCell.textContent = this.t('sumOk', { sum: sum });
    } else {
      sumCell.className = 'seg-sum sum-bad';
      sumCell.textContent = this.t('sumBad', { sum: sum, diff: (360 - sum).toFixed(1) });
    }
  },

  // 分段转速/负载质量：勾选=跟随工况值（null），取消=写入当前工况值后可单独编辑
  toggleSegFollow(i, field, checked) {
    const seg = this.state.segments[i];
    if (field !== 'speed' && field !== 'mass') return;
    if (checked) {
      seg[field] = null;
    } else {
      const gid = field === 'speed' ? 'p_camSpeed' : 'p_loadMass';
      const g = parseFloat(document.getElementById(gid).value);
      seg[field] = isFinite(g) ? g : 0;
    }
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 有效过渡比例（每端占整段比例）：支持按比例或按弧长(mm)输入
  getSegTr(seg, Rb) {
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    let tr;
    if (seg.transitionMode === 'length' && seg.transitionLength > 0 && arc > 0) {
      tr = seg.transitionLength / arc;
    } else {
      tr = (seg.transitionRatio != null ? seg.transitionRatio : 0.125);
    }
    return Math.min(Math.max(tr, 0.001), 0.49);
  },

  setTransMode(i, mode) {
    const seg = this.state.segments[i];
    const Rb = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    if (mode === 'length') {
      if (!(seg.transitionLength > 0)) {
        const tr = (seg.transitionRatio != null ? seg.transitionRatio : 0.125);
        seg.transitionLength = +(tr * arc).toFixed(2);
      }
    } else if (arc > 0 && !(seg.transitionRatio > 0)) {
      seg.transitionRatio = +((seg.transitionLength || 0) / arc).toFixed(4);
    }
    seg.transitionMode = (mode === 'length' ? 'length' : 'ratio');
    seg.transAuto = false;
    this.renderSegTable();
    this.scheduleCompute();
  },

  setTransValue(i, val) {
    const seg = this.state.segments[i];
    const v = parseFloat(val);
    if (!isFinite(v) || v <= 0) {
      // 不静默改回旧值：保留用户输入并报错，由校验面板说明问题
      seg._transBad = String(val);
      this.scheduleCompute();
      return;
    }
    seg._transBad = null;
    if (seg.transitionMode === 'length') {
      seg.transitionLength = v;
    } else {
      seg.transitionRatio = v / 100;
    }
    seg.transAuto = false;
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 过渡长度取允许的最小值（由随动器直径决定）
  applyMinTransition(seg) {
    const Rb = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
    const D = parseFloat((document.getElementById('p_rollerDia') || {}).value) || 8;
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    seg.transitionMode = 'length';
    seg.transitionLength = +(arc > 0 ? Math.min(D, arc * 0.49) : D).toFixed(2);
    seg.transitionRatio = arc > 0 ? +Math.min(D / arc, 0.49).toFixed(4) : 0.125;
    seg.transAuto = true;
  },

  // 随动器直径/基圆变化时，自动过渡的段重新取最小值
  reapplyAutoTransitions() {
    this.state.segments.forEach(s => {
      if (s.transAuto && (s.law === 'trap_cubic' || s.law === 'mod_trap')) this.applyMinTransition(s);
    });
  },

  // 切换运动规律：选择梯形时过渡自动设为最小值
  onSegLawChange(i, law) {
    const seg = this.state.segments[i];
    seg.law = law;
    if (law === 'trap_cubic' || law === 'mod_trap') this.applyMinTransition(seg);
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 参数修改后自动重算（防抖）
  scheduleCompute() {
    clearTimeout(this._autoTimer);
    this._autoTimer = setTimeout(() => {
      try {
        this.reapplyAutoTransitions();
        this.compute();
        // 刷新分段卡片中的过渡最小值/换算/警示（正在编辑分段输入框时跳过，避免打断输入）
        const ae = document.activeElement;
        const editingSeg = ae && ae.closest && ae.closest('#segList');
        // 输入有致命问题时保持表格原样，避免把用户刚输入的内容冲掉
        if (!this.state.hasFatalInput && !editingSeg) this.renderSegTable(true);
      } catch (e) { console.error(e); }
    }, 300);
  },
  /* 由参数 + 分段生成整周点列（纯计算，不写 state） */
  buildPoints(p, segs) {
    const totalAngle = segs.reduce((a, s) => a + s.angle, 0);
    const resolutions = Math.max(36, p.resolution);
    const step = 360 / resolutions;

    const Rb = p.baseDia / 2;
    const dR = p.rollerDia / 2;
    // 工作轮廓半径（圆柱毛坯外径 = Rb + initialHt + 最大升程 / π 展开？这里取 Rb + maxLift/π 作为展开基准）
    // 圆柱凸轮展开：圆弧长 = Rb * φ (φ in rad)，轴向位移 = s(φ)
    // 随动器轨迹 = 理论轮廓 (Rb*φ, s(φ))，工作轮廓 = 理论轮廓 + 沿法线偏移 dR
    // 注：圆柱凸轮通常用展开坐标 (x=弧长, y=轴向) 表示
    // 理论轮廓（随动器中心轨迹）: x_theory = Rb * φ_rad, y_theory = s(φ)  (直动情况)
    // 工作轮廓: 理论轮廓沿法线向内偏移 dR（随动器半径）
    // 压力角 α = arctan( |ds/d(Rb·φ)| ) = arctan( |ds/(Rb·dφ)| )

    let cumLift = 0; // 段间升程累积（段末作为下一段起点）
    const pts = [];

    for (let segIdx = 0; segIdx < segs.length; segIdx++) {
      const seg = segs[segIdx];
      const phimax = seg.angle;
      const s0 = cumLift;               // 本段起点位移
      const hSeg = seg.lift - s0;       // 本段升程（相对）
      // 注意：如果段末升程大于下一段起点需要处理
      // 这里假设：每个 seg.lift 是"段末绝对位移"，方便用户直观设置
      // 如果 seg.lift < s0，则理解为回程（hSeg 可以为负）

      const nSteps = Math.max(2, Math.round(phimax / step));
      const dphi = phimax / nSteps;

      for (let k = 0; k <= nSteps; k++) {
        const tau = k / nSteps;
        const phi_in_seg = tau * phimax;
        const phi_abs = pts.length > 0 ? pts[pts.length - 1].phi + dphi : 0;
        // 用 MotionLaws 计算相对增量
        // 梯形三次过渡公式仅在 e=2tr ≤ 0.5 时成立，tr 过大时位移会发散，这里做安全钳制
        // （过渡长度不足仍由 validateInputs/过渡校核给出提示）
        const trLaw = Math.min(this.getSegTr(seg, Rb), 0.25);
        const rel = MotionLaws.compute(seg.law, tau, Math.abs(hSeg), phimax, { transitionRatio: trLaw });
        // 位移: s0 ± 量
        let ds = rel.s;
        if (hSeg < 0) ds = -rel.s;
        const s_abs = s0 + ds;

        // v, a, j 都是对段内 φ 的导数, 直接输出
        // 若 hSeg < 0，v/a/j 符号也需要取反（因为方向相反）
        const sign = hSeg >= 0 ? 1 : -1;
        const v = rel.v * sign;
        const a = rel.a * sign;
        const j = rel.j * sign;

        // 压力角：α = arctan( |ds/dx| )，x = Rb·φ(rad)
        // v 的单位是 mm/°，需换成 mm/rad 再除以 Rb
        const vRad = v * (180 / Math.PI);          // mm/rad
        const aRad = a * (180 / Math.PI) * (180 / Math.PI); // mm/rad²
        const alphaRad = Math.atan(Math.abs(vRad) / Math.max(Rb, 0.1));
        const alphaDeg = alphaRad * 180 / Math.PI;

        // 理论轮廓坐标 (圆柱展开)
        // 直动: x = Rb * φ_abs (弧长 mm), y = s_abs (轴向 mm)
        const x_theory = Rb * (phi_abs * Math.PI / 180);
        const y_theory = s_abs;

        // 工作轮廓: 理论轮廓沿法线向内偏移 dR
        // 法线方向: 对 (x_theory, y_theory)，切线方向由 ds/dφ 决定
        // 切线斜率 dy/dx = (ds/dφ) / (Rb) = v / Rb
        // 法线方向 = (-dy/dx, 1) 归一化
        // 切线/法线：dx/dφ(deg) = Rb·π/180，dy/dφ(deg) = v (mm/°)
        const dxd = Rb * Math.PI / 180;
        const norm = Math.sqrt(dxd * dxd + v * v);
        const nx = -v / norm;    // 法线 x
        const ny = dxd / norm;   // 法线 y
        const x_work = x_theory + dR * nx;
        const y_work = y_theory + dR * ny;

        // 三维坐标 (圆柱参数方程)
        // 理论: X=Rb·cos(φ), Y=Rb·sin(φ), Z=s_abs
        // 右旋: 轴向增加方向沿 Z+
        const phi_rad = phi_abs * Math.PI / 180;
        const hx_hex = Rb * Math.cos(phi_rad);
        const hy_hex = Rb * Math.sin(phi_rad);
        const hz_hex = s_abs;

        // 受力分析
        // 直动竖直: 正压力 N = (F_load + F_spring + m_total·a_dyn) / cos(α)
        // 方向始终认为正值（分力朝上为正）
        const phi_r = phi_abs * Math.PI / 180;
        const speedEff = (seg.speed === null || seg.speed === undefined) ? p.camSpeed : seg.speed;
        const omega_rad = speedEff * 2 * Math.PI / 60;
        const omegaDeg = omega_rad * 180 / Math.PI;   // °/s
        // 实际线速度/加速度：v 单位 mm/°，a 单位 mm/°²
        const v_dyn = v * omegaDeg;                   // mm/s
        const a_dyn = a * omegaDeg * omegaDeg;        // mm/s²
        const j_dyn = j * omegaDeg * omegaDeg * omegaDeg; // mm/s³
        // 合力：重力（负载质量，按段可单独设置）+ 弹簧力 + 惯性力
        const g = 9.81;
        const segMass = (seg.mass === null || seg.mass === undefined) ? p.loadMass : seg.mass;
        const massTotal = segMass;
        const forceGravity = massTotal * g;             // N, 沿 +s 方向的重力分量（始终阻碍升程）
        const forceSpring = p.springForce;              // N, 复位弹簧，方向恒为 -s
        const forceInertia = massTotal * a_dyn / 1000;  // N, 有符号，随加速度方向变化
        // 沿 +s 方向平衡：F_cam = 重力分量 + 弹簧 + m·a
        // 升程段重力/弹簧阻碍（+），回程段重力/弹簧助力、加速度项可能为负（凸轮需反向拉住随动器）
        let F_cam;
        if (p.motionDir === 'vertical') {
          F_cam = forceGravity + forceSpring + forceInertia;
        } else if (p.motionDir === 'horizontal') {
          F_cam = forceSpring + forceInertia;
        } else {
          F_cam = forceGravity * Math.sin((p.tiltAngle || 0) * Math.PI / 180) + forceSpring + forceInertia;
        }
        // 曲线统一显示幅值（F/N 无负值），方向信息由扭矩符号体现
        const forceAxial = Math.abs(F_cam);             // 沿运动方向的力（= N·cosα）
        const N_normal = forceAxial / Math.cos(alphaRad); // 法向正压力 = F / cosα

        // 输入扭矩 T = F·(ds/dφ)/η = Rb·N·sinα/η
        // Rb、ds/dφ 均以 mm 计，故结果单位为 N·mm（显示/导出时 ÷1000 得 N·m）
        // 用带符号的 F_cam 与 vRad 相乘：回程时若弹簧/重力驱动随动器，扭矩为负（凸轮被反驱）
        const T_input = F_cam * vRad / Math.max(p.efficiency, 0.01);

        pts.push({
          phi: phi_abs, phiRad: phi_r,
          s: s_abs, v, a, j,
          v_s: v_dyn, a_s: a_dyn, j_s: j_dyn,
          alphaDeg, alphaRad, vRad, aRad,
          x_theory, y_theory,
          x_work, y_work,
          x3d_th: hx_hex, y3d_th: hy_hex, z3d_th: hz_hex,
          forceN: N_normal,
          forceAxial: forceAxial,
          torqueNmm: T_input,
          segIdx,
          segName: seg.name
        });
      }
      cumLift = seg.lift; // 本段末升程作为下一段起点
    }

    return pts;
  },

  /* -------- 计算入口（单层 / 复合两层） -------- */
  compute() {
    const camType = this.state.camType || 'single';
    const p = this.getParamFields();
    const segs = this.state.segments;
    this.state.params = p;

    if (camType === 'compound') {
      this.state.layerStore[this.state.activeLayer] = { params: p, segments: segs };
      if (this.state.activeLayer === 0) {
        // 第1层尺寸变化时，第2层外径随之派生
        this.syncLayer2Derived();
      } else {
        const d2 = this.derivedBaseDia2();
        if (d2 > 0) p.baseDia = d2;
      }
    }

    // 输入自检：有问题时明确报出位置/影响/建议，绝不静默改回旧值
    const issues = this.validateInputs();
    this.state.inputIssues = issues;
    this.state.hasFatalInput = issues.some(x => x.level === 'E');
    this.markBadInputs(issues);
    if (this.state.hasFatalInput) {
      this.renderInputIssues(issues);
      this.afterCompute();
      return;
    }

    const pts = this.buildPoints(p, segs);
    this.state.points = pts;
    this.state.dataVersion++;
    this._curveCache = null;

    this.state.compoundInfo = null;
    if (camType === 'compound') {
      this.state.ptsByLayer[this.state.activeLayer] = pts;
      this.compoundPrecheck();
    } else {
      this.state.ptsByLayer = [pts, null];
      this.state.layerStore = [null, null];
    }

    this.runValidator(segs, p, pts, this.state.compoundInfo);
    this.renderAllViz();
    this.renderLayerUI();
    this.afterCompute();
  },

  /* ======== 复合凸轮：层管理 ======== */
  onCamTypeChange() {
    const v = document.getElementById('p_camType').value;
    const pNow = this.getParamFields();
    if (this.state.camType === 'compound' && this.state.layerStore[this.state.activeLayer]) {
      this.state.layerStore[this.state.activeLayer] = { params: pNow, segments: this.state.segments };
    }
    this.state.camType = v;
    if (v === 'compound') {
      if (!this.state.layerStore[0]) {
        this.state.layerStore[0] = { params: pNow, segments: JSON.parse(JSON.stringify(this.state.segments)) };
      }
      if (!this.state.layerStore[1]) {
        const c1 = this.state.layerStore[0];
        const p2 = JSON.parse(JSON.stringify(c1.params));
        p2.initialHt = +(c1.params.initialHt + (c1.params.rollerDia + 0.2)).toFixed(2);
        this.state.layerStore[1] = { params: p2, segments: JSON.parse(JSON.stringify(c1.segments)) };
      }
      this.state.activeLayer = 0;
      this.syncLayer2Derived();
      this.applyLayerToUI(this.state.layerStore[0]);
    } else {
      if (this.state.layerStore[0]) {
        this.state.activeLayer = 0;
        this.applyLayerToUI(this.state.layerStore[0]);
      }
      this.state.ptsByLayer = [null, null];
    }
    this.renderLayerUI();
    this.compute();
  },

  switchLayer(i) {
    if (this.state.camType !== 'compound' || i === this.state.activeLayer) return;
    this.state.layerStore[this.state.activeLayer] = {
      params: this.getParamFields(), segments: this.state.segments
    };
    this.state.activeLayer = i;
    this.applyLayerToUI(this.state.layerStore[i]);
    this.compute();
  },

  /* 把某一层的参数写回左侧面板 */
  applyLayerToUI(L) {
    if (!L || !L.params) return;
    const p = L.params;
    const set = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
    set('p_baseDia', p.baseDia); set('p_camWidth', p.camWidth);
    set('p_rollerDia', p.rollerDia); set('p_rollerWidth', p.rollerWidth);
    set('p_initialHt', p.initialHt); set('p_resolution', p.resolution);
    set('p_camSpeed', p.camSpeed); set('p_followerType', p.followerType);
    set('p_handedness', p.handedness); set('p_offset', p.offset);
    set('p_motionDir', p.motionDir); set('p_tiltAngle', p.tiltAngle);
    set('p_swingLen', p.swingLen); set('p_fulcrumDist', p.fulcrumDist);
    set('p_swingInitAngle', p.swingInitAngle);
    set('p_loadMass', p.loadMass); set('p_springForce', p.springForce);
    set('p_efficiency', isFinite(p.efficiency) ? Math.round(p.efficiency * 100) : '');
    set('p_pressAngleLimit', p.pressAngleLimit);
    set('p_rollerCount', p.rollerCount);
    set('p_rollerAngles', (p.rollerAngles || []).join(', '));
    this.state.segments = L.segments;
    this.renderSegTable();
    const gt = document.getElementById('groupTrans'), gs = document.getElementById('groupSwing');
    if (gt) gt.classList.toggle('hidden', p.followerType !== 'trans');
    if (gs) gs.classList.toggle('hidden', p.followerType !== 'swing');
  },

  /* 第2层外径 = 第1层沟槽底部直径 */
  derivedBaseDia2() {
    const L1 = this.state.layerStore[0];
    if (!L1 || !L1.params) return 0;
    const p1 = L1.params;
    const depth1 = (p1.rollerWidth || 0);
    return Math.max(2, +(p1.baseDia - 2 * depth1).toFixed(3));
  },

  syncLayer2Derived() {
    const L2 = this.state.layerStore[1];
    if (!L2 || !L2.params) return;
    L2.params.baseDia = this.derivedBaseDia2();
  },

  /* 层控件显示状态 */
  renderLayerUI() {
    const comp = this.state.camType === 'compound';
    const isL2 = comp && this.state.activeLayer === 1;
    const bar = document.getElementById('layerBar');
    const hint = document.getElementById('layerHint');
    const note = document.getElementById('noteBaseDia');
    const nb = document.getElementById('p_baseDia');
    if (bar) bar.style.display = comp ? '' : 'none';
    if (hint) hint.style.display = comp ? '' : 'none';
    document.querySelectorAll('.layer-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.layer) === this.state.activeLayer);
    });
    if (nb) {
      nb.readOnly = isL2;
      nb.classList.toggle('derived', isL2);
      if (isL2) nb.value = this.derivedBaseDia2();
    }
    if (note) note.style.display = isL2 ? '' : 'none';
    if (hint) {
      hint.textContent = isL2
        ? this.t('layerHint2', { d: this.derivedBaseDia2().toFixed(2) })
        : this.t('layerHint');
    }
  },

  /* 按角度插值取位移 */
  sAtPhi(pts, deg) {
    if (!pts || !pts.length) return 0;
    const d = ((deg % 360) + 360) % 360;
    let lo = 0, hi = pts.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (pts[mid].phi <= d) lo = mid; else hi = mid;
    }
    const a = pts[lo], b = pts[hi] || a;
    const t = (d - a.phi) / ((b.phi - a.phi) || 1);
    return a.s + (b.s - a.s) * Math.max(0, Math.min(1, t));
  },

  /* 复合校核（开口槽，无上工作面）：第2层下工作面必须全程高于第1层下工作面 */
  compoundPrecheck() {
    const S = this.state.layerStore;
    const other = 1 - this.state.activeLayer;
    if (S[other]) this.state.ptsByLayer[other] = this.buildPoints(S[other].params, S[other].segments);
    const P0 = this.state.ptsByLayer[0], P1 = this.state.ptsByLayer[1];
    const L1 = S[0], L2 = S[1];
    if (!P0 || !P1 || !L1 || !L2) return;
    const p1 = L1.params, p2 = L2.params;
    const hw1 = (p1.rollerDia + 0.2) / 2, hw2 = (p2.rollerDia + 0.2) / 2;

    let need = 0;
    const ranges = [];
    let prevBad = false, startD = 0;
    const D = 0.5;
    for (let d = 0; d < 360 - 1e-9; d += D) {
      const low1 = p1.initialHt + this.sAtPhi(P0, d) - hw1;   // 第1层下工作面（槽底）
      const low2 = p2.initialHt + this.sAtPhi(P1, d) - hw2;   // 第2层下工作面（槽底）
      const gap = low1 - low2;                                // >0 表示第2层偏低
      if (gap > 1e-6) {
        if (gap > need) need = gap;
        if (!prevBad) { startD = d; prevBad = true; }
      } else if (prevBad) {
        ranges.push([startD, d - D]); prevBad = false;
      }
    }
    if (prevBad) ranges.push([startD, 360]);

    const hViolation = need > 1e-6;
    const hNeed = hViolation ? +(p2.initialHt + need + 0.1).toFixed(2) : p2.initialHt;
    const g1 = this.grooveGeomFor(p1, P0, true);
    const g2 = this.grooveGeomFor(p2, P1, true);
    // 第2层下工作面能否落在它自己的凸轮高度内（开口槽，只需下工作面）
    const zB = g2.z0 + g2.sMin - hw2;
    const zT = g2.z0 + g2.sMax - hw2;
    const fit2 = (zB >= 0.05) && (zT <= p2.camWidth - 0.05);
    this.state.compoundInfo = {
      hViolation, need, hNeed, ranges,
      d2: this.derivedBaseDia2(),
      h1: p1.initialHt, h2: p2.initialHt,
      overflow1: g1.overflow, overflow2: g2.overflow,
      shift1: g1.shift, shift2: g2.shift,
      fit2,
      fitInfo: {
        z: (zT - zB).toFixed(1),
        w: Number(p2.camWidth).toFixed(1),
        need: (Math.max(zT, zT - zB) + 0.2).toFixed(1)
      }
    };
  },

  /* -------- 输入自检：定位 / 影响 / 建议（不静默改值） -------- */
  fieldLabel(id) {
    const el = document.getElementById(id);
    const row = el && el.closest ? el.closest('.form-row') : null;
    const lab = row ? row.querySelector('label') : null;
    if (!lab) return id;
    const span = lab.querySelector('[data-i18n]');
    return (span ? span.textContent : lab.textContent).replace(/\s+/g, ' ').trim();
  },

  fmtNum(v) {
    return (typeof v === 'number' && isFinite(v)) ? String(+v.toFixed(4)) : String(v);
  },

  numSpecs() {
    return [
      { id: 'p_baseDia', min: 1, unit: 'mm' },
      { id: 'p_camWidth', min: 1, unit: 'mm' },
      { id: 'p_rollerDia', min: 0.1, unit: 'mm' },
      { id: 'p_rollerWidth', min: 0.1, unit: 'mm' },
      { id: 'p_initialHt', min: 0, unit: 'mm' },
      { id: 'p_resolution', min: 36, max: 36000, integer: true },
      { id: 'p_rollerCount', min: 1, max: 8, integer: true },
      { id: 'p_offset', min: -1e6, max: 1e6, unit: 'mm' },
      { id: 'p_tiltAngle', min: -90, max: 90, unit: '°' },
      { id: 'p_swingLen', min: 1, unit: 'mm' },
      { id: 'p_fulcrumDist', min: 1, unit: 'mm' },
      { id: 'p_swingInitAngle', min: -360, max: 360, unit: '°' },
      { id: 'p_camSpeed', min: 0.1, unit: 'rpm' },
      { id: 'p_loadMass', min: 0, unit: 'kg' },
      { id: 'p_springForce', min: 0, unit: 'N' },
      { id: 'p_efficiency', min: 10, max: 100, unit: '%' },
      { id: 'p_pressAngleLimit', min: 5, max: 90, unit: '°' }
    ];
  },

  validateInputs() {
    const out = [];
    const impact = this.t('inputIssueImpact');
    const add = (level, id, text, sug, segIndex) => out.push({ level, id, text, impact, suggestion: sug, segIndex });

    for (const spec of this.numSpecs()) {
      const el = document.getElementById(spec.id);
      if (!el) continue;
      if (el.closest && el.closest('.hidden')) continue; // 隐藏的参数组不参与
      const f = this.fieldLabel(spec.id);
      const raw = String(el.value == null ? '' : el.value).trim();
      const v = raw === '' ? NaN : Number(raw);
      if (raw === '' || !isFinite(v)) {
        add('E', spec.id,
          raw === '' ? this.t('inputEmpty', { f }) : this.t('inputNaN', { f, v: raw }),
          this.t('inputEmptySug'));
        continue;
      }
      const min = spec.min != null ? spec.min : -Infinity;
      const max = spec.max != null ? spec.max : Infinity;
      const minTxt = min === -Infinity ? '−∞' : min;
      const maxTxt = max === Infinity ? '∞' : max;
      if (v < min || v > max) {
        add('E', spec.id,
          this.t('inputRange', { f, v: this.fmtNum(v), unit: spec.unit || '', min: minTxt, max: maxTxt }),
          this.t('inputRangeSug', { min: minTxt, max: maxTxt, unit: spec.unit || '' }));
        continue;
      }
      if (spec.integer && !Number.isInteger(v)) {
        add('E', spec.id, this.t('inputInt', { f, v: this.fmtNum(v) }),
          this.t('inputIntSug', { min: minTxt, max: maxTxt }));
      }
    }

    // 复合模式：另一层缓存的参数也必须有效，否则层间校核无法进行
    if (this.state.camType === 'compound') {
      const other = 1 - this.state.activeLayer;
      const O = this.state.layerStore[other];
      if (O && O.params) {
        const q = O.params;
        const keys = ['baseDia', 'camWidth', 'rollerDia', 'rollerWidth', 'initialHt', 'camSpeed', 'loadMass', 'pressAngleLimit'];
        const badParams = keys.some(k => !(typeof q[k] === 'number' && isFinite(q[k])));
        const badSegs = (O.segments || []).some(sg =>
          !(typeof sg.angle === 'number' && isFinite(sg.angle) && sg.angle > 0) ||
          !(typeof sg.lift === 'number' && isFinite(sg.lift)));
        if (badParams || badSegs) {
          const lname = this.t(other === 0 ? 'layer1' : 'layer2');
          add('E', null, this.t('alertOtherLayerBad', { layer: lname }),
            this.t('alertOtherLayerBadSug', { layer: lname }));
        }
      }
    }

    // 随动器相对角度：只允许数字
    const ra = document.getElementById('p_rollerAngles');
    if (ra && String(ra.value).trim()) {
      const toks = String(ra.value).trim().split(/[,;\s]+/).filter(Boolean);
      const bad = toks.find(x => !isFinite(parseFloat(x)));
      if (bad) add('E', 'p_rollerAngles', this.t('alertRollerAngles', { v: bad }), this.t('alertRollerAnglesSug'));
    }

    // 分段参数
    (this.state.segments || []).forEach((seg, i) => {
      const n = i + 1;
      const val = (x) => (typeof x === 'number' && isFinite(x)) ? this.fmtNum(x) : '—';
      if (!(typeof seg.angle === 'number' && isFinite(seg.angle) && seg.angle > 0))
        add('E', null, this.t('alertSegAngle', { i: n, v: val(seg.angle) }), this.t('alertSegAngleSug'), i);
      if (!(typeof seg.lift === 'number' && isFinite(seg.lift)))
        add('E', null, this.t('alertSegLift', { i: n, v: val(seg.lift) }), this.t('alertSegLiftSug'), i);
      if (seg.speed !== null && seg.speed !== undefined && !(isFinite(seg.speed) && seg.speed > 0))
        add('E', null, this.t('alertSegSpeed', { i: n, v: val(seg.speed) }), this.t('alertSegSpeedSug'), i);
      if (seg.mass !== null && seg.mass !== undefined && !(isFinite(seg.mass) && seg.mass >= 0))
        add('E', null, this.t('alertSegMass', { i: n, v: val(seg.mass) }), this.t('alertSegMassSug'), i);
      if (seg._transBad !== undefined && seg._transBad !== null && String(seg._transBad) !== '')
        add('E', null, this.t('alertTransValue', { i: n, v: seg._transBad }), this.t('alertTransValueSug'), i);
    });

    return out;
  },

  markBadInputs(issues) {
    document.querySelectorAll('.left-col .input-bad').forEach(el => el.classList.remove('input-bad'));
    document.querySelectorAll('#segList .seg-bad').forEach(el => el.classList.remove('seg-bad'));
    issues.forEach(x => {
      if (x.id) {
        const el = document.getElementById(x.id);
        if (el) el.classList.add('input-bad');
      }
      if (x.segIndex != null) {
        const card = document.querySelector(`#segList .seg-card[data-idx="${x.segIndex}"]`);
        if (card) card.classList.add('seg-bad');
      }
    });
  },

  renderInputIssues(issues) {
    const list = [{ level: 'I', text: this.t('inputStale') }].concat(issues);
    this.state.alerts = list;
    this.renderAlerts(list);
  },

  /* -------- 校验 -------- */
