<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆柱凸轮设计工具 · Cylindrical Cam Designer</title>
<style>
/* ========== 浅灰主题 ========== */
:root {
  --bg: #f2f3f5;
  --panel: #ffffff;
  --panel-alt: #f8f9fb;
  --border: #dfe1e5;
  --border-strong: #c9ccd1;
  --text: #1f2328;
  --text-dim: #5c6370;
  --text-muted: #8c9299;
  --primary: #4158d0;
  --primary-alt: #c850c0;
  --primary-grad: linear-gradient(135deg, #4158d0, #c850c0);
  --ok: #2f9e44;
  --warn: #d9480f;
  --info: #1864ab;
  --warn-bg: #fff9db;
  --err-bg: #ffe3e3;
  --info-bg: #d0ebff;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --canvas-bg: #ffffff;
  --axis: #8c9299;
  --grid: #e5e7eb;
  --line-s: #4158d0;
  --line-v: #c850c0;
  --line-a: #f76707;
  --line-j: #2f9e44;
  --line-alpha: #7048e8;
  --line-force: #0b7285;
  --line-norm: #d6336c;
  --cam-surface: #b8c0ff;
  --cam-edge: #4158d0;
  --roller: #ff922b;
  --follower-rod: #868e96;
  --stroke-good: #2f9e44;
  --stroke-warn: #d9480f;
  --stroke-info: #1864ab;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* ========== 顶部导航 ========== */
header {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px 16px;
  position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow);
}
header h1 { font-size: 1.2em; font-weight: 600; min-width: 0; }
header h1 .sub { font-weight: 400; color: var(--text-dim); font-size: 0.75em; margin-left: 8px; }
.lang-switch { display: flex; gap: 4px; background: var(--bg); border-radius: 6px; padding: 3px; }
.lang-switch button {
  border: none; background: transparent; padding: 5px 12px; border-radius: 4px;
  cursor: pointer; font-size: 0.85em; color: var(--text-dim); font-weight: 500;
}
.lang-switch button.active { background: var(--panel); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

/* ========== 主体布局 ========== */
main { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 18px; padding: 18px 24px; align-items: start; }
@media (max-width: 1240px) { main { grid-template-columns: minmax(0, 1fr); } }
.left-col { min-width: 0; }
.right-col { min-width: 0; }

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.panel h2 {
  font-size: 1em; font-weight: 600; color: var(--text);
  padding-bottom: 8px; margin-bottom: 12px;
  border-bottom: 2px solid var(--bg);
  display: flex; align-items: center; gap: 8px;
}
.panel h2 .icon { font-size: 1.1em; }
.panel h3 { font-size: 0.88em; font-weight: 600; color: var(--text-dim); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ========== 表单 ========== */
.form-row {
  display: flex; flex-direction: column; align-items: stretch;
  gap: 3px; min-width: 0;
}
.form-row label {
  font-size: 0.8em; color: var(--text-dim); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.form-row label .unit { color: var(--text-muted); font-size: 0.95em; margin-left: 3px; font-weight: 400; }
.form-row label .tip { color: var(--text-muted); font-size: 0.9em; }
input[type="number"], input[type="text"], select {
  width: 100%; min-width: 0; padding: 5px 8px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.86em; background: var(--panel); color: var(--text);
  transition: border-color 0.15s;
}
input[type="number"]:focus, select:focus, input[type="text"]:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(65,88,208,0.12);
}
input[type="checkbox"] { margin-right: 6px; }
input.inp-wide { width: 140px; }
input.inp-sm { width: 80px; }

/* ========== 分段卡片 ========== */
.seg-list { display: flex; flex-direction: column; gap: 8px; }
.seg-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px 10px; background: var(--panel-alt);
}
.seg-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.seg-head .seg-idx {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 0.72em; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
}
.seg-head input.seg-name {
  flex: 1; min-width: 0; padding: 3px 7px; font-size: 0.85em; font-weight: 600;
  border: 1px solid var(--border); border-radius: 5px; background: var(--panel);
}
.seg-head .seg-del {
  flex-shrink: 0; border: none; background: transparent; cursor: pointer;
  color: var(--text-muted); font-size: 0.95em; padding: 2px 6px; border-radius: 4px;
}
.seg-head .seg-del:hover { background: var(--err-bg); color: var(--warn); }
.seg-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; }
.seg-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seg-field > span { font-size: 0.72em; color: var(--text-muted); white-space: nowrap; }
.seg-field .seg-lbl { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.seg-field .follow { display: inline-flex; align-items: center; gap: 2px; font-size: 0.95em; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.seg-field .follow input[type="checkbox"] { margin: 0; width: 11px; height: 11px; accent-color: var(--primary); }
.seg-field input[disabled] { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
.seg-trans {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 5px 7px; border-radius: 5px; background: var(--panel);
  border: 1px dashed var(--border);
}
.seg-trans.trans-bad { border-color: #ffc9c9; background: var(--err-bg); }
.seg-trans .trans-lbl { font-size: 0.72em; color: var(--text-muted); font-weight: 600; }
.seg-trans select { width: auto; padding: 2px 4px; font-size: 0.78em; }
.seg-trans input { width: 76px; padding: 2px 5px; font-size: 0.78em; }
.seg-trans .trans-unit, .seg-trans .trans-eq { font-size: 0.72em; color: var(--text-muted); }
.seg-trans .trans-min { font-size: 0.72em; color: var(--text-muted); }
.seg-trans.trans-bad .trans-min { color: var(--warn); font-weight: 600; }
.seg-trans .trans-warn { font-size: 0.72em; color: var(--warn); font-weight: 600; }
.seg-field input, .seg-field select {
  width: 100%; min-width: 0; padding: 3px 5px; font-size: 0.8em;
  border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text);
}
.seg-field .seg-static {
  font-size: 0.8em; padding: 3px 5px; color: var(--text-dim);
  background: var(--panel); border: 1px dashed var(--border); border-radius: 5px;
  text-align: center; font-family: 'Menlo', 'Consolas', monospace;
}
.seg-sum {
  margin-top: 10px; padding: 7px 10px; border-radius: 6px;
  font-size: 0.84em; font-weight: 600; text-align: center;
  background: var(--panel-alt); border: 1px solid var(--border);
}
.seg-sum.sum-ok { color: var(--ok); }
.seg-sum.sum-bad { color: var(--warn); background: var(--err-bg); border-color: #ffc9c9; }

.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88em;
  font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #3451b2; }
.btn-secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: #e9ecef; }
.btn-danger { background: var(--panel); color: var(--warn); border: 1px solid #ffc9c9; }
.btn-danger:hover { background: var(--err-bg); }

/* ========== 警告条 ========== */
.alert-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.alert {
  padding: 8px 12px; border-radius: 6px; font-size: 0.85em; line-height: 1.5;
  border-left: 4px solid; display: flex; gap: 8px; align-items: flex-start;
}
.alert-e { background: var(--err-bg); border-color: var(--warn); color: #c92a2a; }
.alert-w { background: var(--warn-bg); border-color: #f59f00; color: #764a00; }
.alert-i { background: var(--info-bg); border-color: var(--info); color: #1864ab; }
.alert .level { font-weight: 700; flex-shrink: 0; }
.alert .body { flex: 1; }
.alert .suggestion { display: block; margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(0,0,0,0.1); font-size: 0.92em; font-weight: 500; }

/* ========== 可视化区 ========== */
.right-col { display: flex; flex-direction: column; gap: 14px; }
.viz-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 6px; padding: 3px; margin-bottom: 12px; }
.viz-tab {
  border: none; background: transparent; padding: 6px 14px; border-radius: 4px;
  cursor: pointer; font-size: 0.85em; color: var(--text-dim); font-weight: 500;
}
.viz-tab.active { background: var(--panel); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

.canvas-wrap {
  background: var(--canvas-bg); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; position: relative;
}
canvas { display: block; width: 100%; height: auto; background: var(--canvas-bg); }

/* ========== 动画控制 ========== */
.anim-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.anim-controls input[type="range"] { flex: 1; min-width: 150px; accent-color: var(--primary); }
.anim-controls .phase-label { font-size: 0.85em; color: var(--text-dim); font-family: 'Menlo', monospace; white-space: nowrap; }
.anim-btn {
  width: 34px; height: 30px; border: 1px solid var(--border); background: var(--panel);
  border-radius: 6px; cursor: pointer; font-size: 1em; display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.anim-btn:hover { background: var(--panel-alt); border-color: var(--primary); }
.anim-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ========== 工具类 ========== */
.muted { color: var(--text-muted); font-size: 0.82em; }
.hidden { display: none !important; }
hr.section { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* ========== 参数网格 ========== */
.param-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.param-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field-label-row { display: flex; align-items: center; justify-content: space-between; }
.panel-hint { font-size: 0.75em; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }

/* 运动曲线：行显示开关 */
.row-toggles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.row-toggles .rt-label { font-size: 0.8em; color: var(--text-muted); margin-right: 2px; }
.row-toggles .rt-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.8em; padding: 3px 10px; border: 1px solid var(--border);
  border-radius: 14px; background: var(--panel); cursor: pointer; user-select: none;
  transition: border-color 0.15s, background 0.15s;
}
.row-toggles .rt-chip:hover { border-color: var(--primary); }
.row-toggles .rt-chip input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--primary); }
.row-toggles .rt-chip span { color: var(--text-dim); }
.row-toggles .rt-chip:has(input:not(:checked)) { background: var(--bg); border-style: dashed; }
.row-toggles .rt-chip:has(input:not(:checked)) span { color: var(--text-muted); }

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #d1d3d8; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #b8bbc2; }
</style>
</head>
<body>

<header>
  <h1>🔵 <span data-i18n="title">Cylindrical Cam Designer</span><span class="sub" data-i18n="titleSub">v1.0</span></h1>
  <div class="lang-switch">
    <button onclick="App.setLang('en')" data-lang="en">🇬🇧 English</button>
    <button onclick="App.setLang('zh')" data-lang="zh">🇨🇳 中文</button>
    <button onclick="App.setLang('ja')" data-lang="ja">🇯🇵 日本語</button>
  </div>
</header>

<main>
  <!-- ========== 左侧：参数输入 ========== -->
  <aside class="left-col">

    <div class="panel">
      <h2><span class="icon">⚙️</span><span data-i18n="secBasic">基础参数</span></h2>
      <div class="param-grid">
        <div class="form-row">
          <label><span data-i18n="baseDia">基圆直径</span><span class="unit">mm</span></label>
          <input type="number" id="p_baseDia" value="80" step="0.5" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="camWidth">凸轮宽度</span><span class="unit">mm</span></label>
          <input type="number" id="p_camWidth" value="60" step="1" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerDia">随动器直径</span><span class="unit">mm</span></label>
          <input type="number" id="p_rollerDia" value="16" step="0.5" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerWidth">随动器宽度</span><span class="unit">mm</span></label>
          <input type="number" id="p_rollerWidth" value="20" step="1" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="initialHt">初始高度</span><span class="unit">mm</span></label>
          <input type="number" id="p_initialHt" value="20" step="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="divRes">分度分辨率</span><span class="unit" data-i18n="unitPtsRev">点/转</span></label>
          <input type="number" id="p_resolution" value="3600" step="36" min="36">
        </div>
        <div class="form-row">
          <label data-i18n="handedness">旋向</label>
          <select id="p_handedness">
            <option value="rh" data-i18n="handRH">右旋</option>
            <option value="lh" data-i18n="handLH">左旋</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel" id="panelFollower">
      <h2><span class="icon">📐</span><span data-i18n="secFollower">从动件</span></h2>
      <div class="param-grid">
        <div class="form-row">
          <label data-i18n="followerType">从动件类型</label>
          <select id="p_followerType">
            <option value="trans" data-i18n="followerTrans">直动</option>
            <option value="swing" data-i18n="followerSwing">摆动</option>
          </select>
        </div>
        <div class="form-row">
          <label><span data-i18n="rollerCount">随动器数量</span><span class="unit" data-i18n="unitPcs">个</span></label>
          <input type="number" id="p_rollerCount" value="1" step="1" min="1" max="8">
        </div>
        <div class="form-row" style="grid-column: 1 / -1;">
          <label><span data-i18n="rollerAngles">相对角度</span><span class="unit">°</span></label>
          <input type="text" id="p_rollerAngles" value="" data-i18n-ph="phRollerAngles">
        </div>
      </div>

      <div id="groupTrans">
        <h3 data-i18n="subTrans">直动参数</h3>
        <div class="param-grid">
          <div class="form-row">
            <label><span data-i18n="offsetDist">随动器中心距</span><span class="unit">mm</span></label>
            <input type="number" id="p_offset" value="40" step="1">
          </div>
          <div class="form-row">
            <label data-i18n="motionDir">运动方向</label>
            <select id="p_motionDir">
              <option value="vertical" data-i18n="dirVert">竖直</option>
              <option value="horizontal" data-i18n="dirHoriz">水平</option>
              <option value="tilted" data-i18n="dirTilt">倾斜</option>
            </select>
          </div>
          <div class="form-row">
            <label><span data-i18n="tiltAngle">倾斜角</span><span class="unit">°</span></label>
            <input type="number" id="p_tiltAngle" value="0" step="5" min="-90" max="90">
          </div>
        </div>
      </div>

      <div id="groupSwing" class="hidden">
        <h3 data-i18n="subSwing">摆动参数</h3>
        <div class="param-grid">
          <div class="form-row">
            <label><span data-i18n="swingLen">摆杆长度</span><span class="unit">mm</span></label>
            <input type="number" id="p_swingLen" value="100" step="1" min="1">
          </div>
          <div class="form-row">
            <label><span data-i18n="fulcrumDist">支点距轴线</span><span class="unit">mm</span></label>
            <input type="number" id="p_fulcrumDist" value="80" step="1" min="1">
          </div>
          <div class="form-row">
            <label><span data-i18n="initialAngle">初始安装角</span><span class="unit">°</span></label>
            <input type="number" id="p_swingInitAngle" value="30" step="1">
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2><span class="icon">⚡</span><span data-i18n="secForce">工况与受力</span></h2>
      <div class="param-grid">
        <div class="form-row">
          <label><span data-i18n="camSpeed">凸轮转速</span><span class="unit">rpm</span></label>
          <input type="number" id="p_camSpeed" value="60" step="10" min="1">
        </div>
        <div class="form-row">
          <label><span data-i18n="loadMass">负载质量</span><span class="unit">kg</span></label>
          <input type="number" id="p_loadMass" value="5" step="0.5" min="0">
        </div>
        <div class="form-row">
          <label><span data-i18n="springForce">最大弹簧复位力</span><span class="unit">N</span></label>
          <input type="number" id="p_springForce" value="50" step="5" min="0">
        </div>
        <div class="form-row">
          <label><span data-i18n="camEfficiency">凸轮传动效率</span><span class="unit">%</span></label>
          <input type="number" id="p_efficiency" value="95" step="1" min="10" max="100">
        </div>
        <div class="form-row">
          <label><span data-i18n="pressAngleLimit">压力角限值</span><span class="unit">°</span></label>
          <input type="number" id="p_pressAngleLimit" value="30" step="1" min="5" max="90">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2><span class="icon">📈</span><span data-i18n="secSegments">运动分段</span>
        <button class="btn btn-secondary" onclick="App.addSegment()" style="margin-left:auto;padding:3px 10px;font-size:0.82em;">+ <span data-i18n="addSeg">新增</span></button>
      </h2>
      <div class="seg-list" id="segList"></div>
      <div class="seg-sum sum-ok" id="segSum">Σ = 360° ✓</div>
      <p class="panel-hint" data-i18n="segHint">勾选「跟随」沿用工况与受力中的转速/负载质量；取消后可单独设置，再次勾选恢复默认。</p>
    </div>

    <div class="panel">
      <div class="btn-row">
        <button class="btn btn-primary" onclick="App.compute()"><span>🚀</span> <span data-i18n="btnCompute">计算</span></button>
        <button class="btn btn-secondary" onclick="App.loadDefault()"><span>📥</span> <span data-i18n="btnDefault">默认</span></button>
        <button class="btn btn-secondary" onclick="App.saveJSON()"><span>💾</span> <span data-i18n="btnSave">保存</span></button>
        <button class="btn btn-secondary" onclick="document.getElementById('fileLoad').click()"><span>📂</span> <span data-i18n="btnLoad">加载</span></button>
        <button class="btn btn-secondary" onclick="App.exportCSV()"><span>📊</span> CSV</button>
        <button class="btn btn-secondary" onclick="App.exportSTEP()"><span>🧊</span> STEP</button>
        <input type="file" id="fileLoad" accept=".json" style="display:none" onchange="App.onLoadFile(this)">
      </div>
    </div>

  </aside>

  <!-- ========== 右侧：可视化 + 结果 ========== -->
  <section class="right-col">

    <!-- 警告区 -->
    <div class="panel">
      <h2><span class="icon">⚠️</span><span data-i18n="secAlerts">校验与提示</span></h2>
      <div class="alert-list" id="alertList">
        <div class="alert alert-i"><span class="level">i</span><span class="body" data-i18n="alertRunCompute">点击"计算"按钮开始</span></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="panel">
