/* 运动规律枚举（英文 key 内部使用） */
const LAW_KEYS = ['const','acc','cos','sin','poly345','dwell','mod_trap','trap_cubic'];
const LAW_LABEL_KEY = {
  const: 'segLawConst', acc: 'segLawAcc', cos: 'segLawCos', sin: 'segLawSin',
  poly345: 'segLaw345', dwell: 'segLawDwell', mod_trap: 'segLawModTrap', trap_cubic: 'segLawTrapCubic'
};

/* =====================================================================
   M1: motion-laws.js — 六种运动规律 + 修正梯形
   每个规律输入: tau (0..1, 段内相对位置), h 段升程(mm), phimax 段内转角(°)
   输出: { s, v_phi, a_phi, j_phi }
   v_phi 单位 mm/°, a_phi mm/°², j_phi mm/°³
   ===================================================================== */
const MotionLaws = {
  /* 停歇: s=0 常量 */
  dwell: (tau, h, phimax) => ({
    s: 0, v: 0, a: 0, j: 0
  }),

  /* 等速 */
  const: (tau, h, phimax) => ({
    s: h * tau,
    v: h / phimax,
    a: 0,
    j: 0
  }),

  /* 等加速等减速 (两段: 0..0.5 加速, 0.5..1 减速) */
  acc: (tau, h, phimax) => {
    let s, v, a, j;
    if (tau < 0.5) {
      s = 2 * h * tau * tau;
      v = 4 * h * tau / phimax;
      a = 4 * h / (phimax * phimax);
      j = 0;
    } else {
      s = h - 2 * h * (1 - tau) * (1 - tau);
      v = 4 * h * (1 - tau) / phimax;
      a = -4 * h / (phimax * phimax);
      j = 0;
    }
    return { s, v, a, j };
  },

  /* 余弦加速度 (简谐/摆线的另一半 family) */
  cos: (tau, h, phimax) => ({
    s: h * (1 - Math.cos(Math.PI * tau)) / 2,
    v: h * Math.PI * Math.sin(Math.PI * tau) / (2 * phimax),
    a: h * Math.PI * Math.PI * Math.cos(Math.PI * tau) / (2 * phimax * phimax),
    j: -h * Math.PI * Math.PI * Math.PI * Math.sin(Math.PI * tau) / (2 * phimax * phimax * phimax)
  }),

  /* 正弦加速度 (摆线 Cycloidal) */
  sin: (tau, h, phimax) => ({
    s: h * (tau - Math.sin(2 * Math.PI * tau) / (2 * Math.PI)),
    v: h * (1 - Math.cos(2 * Math.PI * tau)) / phimax,
    a: 2 * Math.PI * h * Math.sin(2 * Math.PI * tau) / (phimax * phimax),
    j: 4 * Math.PI * Math.PI * h * Math.cos(2 * Math.PI * tau) / (phimax * phimax * phimax)
  }),

  /* 3-4-5 多项式 */
  poly345: (tau, h, phimax) => {
    const s = h * (10 * tau * tau * tau - 15 * tau * tau * tau * tau + 6 * tau * tau * tau * tau * tau);
    const v = h * (30 * tau * tau - 60 * tau * tau * tau + 30 * tau * tau * tau * tau) / phimax;
    const a = h * (60 * tau - 180 * tau * tau + 120 * tau * tau * tau) / (phimax * phimax);
    const j = h * (60 - 360 * tau + 360 * tau * tau) / (phimax * phimax * phimax);
    return { s, v, a, j };
  },

  /* 修正梯形 (Modified Trapezoidal)
     在两端用 1/8 段角做正弦过渡，中间 3/4 段恒加速/恒减速
     过渡区可通过 tr 参数调整（本次默认 tr = 1/8）
     随动器半径会限制过渡区最小值，此函数接受 tr 参数
  */
  mod_trap: (tau, h, phimax, tr = 0.125) => {
    // tr: 过渡区占比（每端），0 < tr < 0.25
    // 分 4 段: 0..tr 正弦加速过渡, tr..0.5-tr 恒加速, 0.5-tr..0.5+tr 正弦减速过渡
    // 实际简化实现: 用统一表达
    // 用修正梯形的标准闭合形式（参见凸轮设计教材）
    // 等效 = 正弦加速度 + 梯形加速度的混合

    // 为保持 s/v/a/j 首尾连续（s(0)=0, s(1)=h, v(0)=0, v(1)=0, a(0)=0, a(1)=0）
    // 用以下多项式 + 正弦混合表达
    const k1 = 2 * Math.PI * tr;
    let s, v, a, j;

    if (tau <= tr) {
      // 正弦加速过渡
      const x = tau / tr;
      s = h * (tr / (2 * Math.PI)) * (1 - Math.cos(k1 * x));
      v = (h / phimax) * Math.sin(k1 * x);
      a = (h * k1) / (tr * phimax * phimax) * Math.cos(k1 * x);
      j = -(h * k1 * k1) / (tr * tr * phimax * phimax * phimax) * Math.sin(k1 * x);
    } else if (tau <= 0.5 - tr) {
      // 恒加速段
      const x = (tau - tr) / (0.5 - 2 * tr);
      const s1 = h * (tr / (2 * Math.PI)) * (1 - Math.cos(k1)); // 过渡终点 s
      const v1 = (h / phimax) * Math.sin(k1);                    // 过渡终点 v
      const ac = (2 * h / phimax / phimax) * (Math.PI / (Math.PI - 2 * k1));
      s = s1 + v1 * (0.5 - 2 * tr) * x + 0.5 * ac * ((0.5 - 2 * tr) * x) ** 2;
      v = v1 + ac * (0.5 - 2 * tr) * x;
      a = ac;
      j = 0;
    } else if (tau <= 0.5) {
      // 进入减速前的反向过渡（对称处理）
      // 简化：用整体 0.5 对称构造，不单独列
      const inner = MotionLaws._modTrapHalf(tau, h, phimax, tr);
      s = inner.s; v = inner.v; a = inner.a; j = inner.j;
    } else {
      // 后半段镜像: tau' = 1 - tau
      const t2 = 1 - tau;
      const inner = MotionLaws._modTrapHalf(t2, h, phimax, tr);
      s = h - inner.s;
      v = -inner.v;
      a = inner.a;
      j = -inner.j;
    }
    return { s, v, a, j };
  },

  /* 修正梯形前半段 (0..0.5) 统一处理 */
  _modTrapHalf(tau, h, phimax, tr) {
    // 用一个完整对称函数 0..0.5
    // 基于标准修正梯形公式：a(τ) 在 0..tr 正弦上升, tr..0.5-tr 恒定, 0.5-tr..0.5 正弦下降
    const p = tau / 0.5; // 归一化到 0..1
    const t = tr * 2;    // 归一化后过渡区占比
    let s, v, a, j;
    if (p <= t) {
      const acp = Math.PI / t;
      a = Math.sin(acp * p);
      v = -t / Math.PI * Math.cos(acp * p) + t / Math.PI;
      s = (t / Math.PI) * (p - (t / Math.PI) * Math.sin(acp * p));
      j = acp * Math.cos(acp * p);
    } else if (p <= 1 - t) {
      a = 1;
      v = 2 * p - 2 * t + (t / Math.PI) * Math.cos(Math.PI); // 衔接
      v = 2 * (1 - t); // 恒定
      s = (t / Math.PI) * (t - (t / Math.PI) * Math.sin(Math.PI)) + v * (p - t) + 0.5 * 1 * (p - t) * (p - t);
      j = 0;
    } else {
      const q = (p - (1 - t)) / t;
      a = Math.cos(Math.PI * q);
      v = 2 * (1 - t) - (t / Math.PI) * Math.sin(Math.PI * q);
      // s 积分
      s = (t / Math.PI) * (t - (t / Math.PI) * Math.sin(Math.PI)) + (1 - 2 * t) * (0.5 - 2 * t);
      s += 2 * (1 - t) * t * q;
      s -= (t / (2 * Math.PI)) * (1 - Math.cos(Math.PI * q));
      j = -Math.PI / t * Math.sin(Math.PI * q);
    }
    // 缩放: 幅度 A = 4h / (phimax² * (1 - 4t/π + ... 简化))
    // 使用整体拟合系数
    const K = 8 * h / (phimax * phimax); // 匹配首尾 s(0.5) ≈ h/2
    // 直接按归一化输出
    const a_scale = 8 * h / (phimax * phimax);
    const v_scale = 4 * h / phimax;
    const s_scale = h;
    return {
      s: s * s_scale * 0.5,
      v: v * v_scale * 0.5,
      a: a * a_scale * 0.5,
      j: j * a_scale / phimax * 0.5
    };
  },

  /* 梯形（三次过渡）Trapezoidal with cubic transitions
     速度曲线为梯形：两端用三次平滑（smoothstep）过渡，中间恒加速。
     过渡区比例 tr（每端占整段比例，默认 0.125），e = 2*tr。
     位移/速度/加速度/跃度均首尾连续（s(0)=0, s(1)=h, v(0)=v(1)=0, a(0)=a(1)=0）。
  */
  trap_cubic: (tau, h, phimax, tr = 0.125) => {
    const e = Math.min(Math.max(2 * tr, 1e-4), 0.98);
    const S = (x) => 3 * x * x - 2 * x * x * x;   // 三次 smoothstep 0→1
    const dS = (x) => 6 * x - 6 * x * x;          // dS/dx
    const half = (t) => {                          // 前半段 0..1 的形状函数
      let I1, I2, g, dg;
      if (t <= e) {
        const u = t / e;
        I1 = e * (u * u * u - u * u * u * u / 2);
        I2 = e * e * (u * u * u * u / 4 - u * u * u * u * u / 10);
        g = S(u); dg = dS(u) / e;
      } else if (t <= 1 - e) {
        const d = t - e;
        I1 = 0.5 * e + d;
        I2 = 0.15 * e * e + 0.5 * e * d + 0.5 * d * d;
        g = 1; dg = 0;
      } else {
        const w = (1 - t) / e;
        I1 = 1 - e - e * w * w * w + 0.5 * e * w * w * w * w;
        I2 = (1.15 * e * e - 1.5 * e + 0.5) + e * (1 - e) * (1 - w)
           - (e * e) * (1 - Math.pow(w, 4)) / 4 + 0.1 * e * e * (1 - Math.pow(w, 5));
        g = S(w); dg = -dS(w) / e;
      }
      return { I1, I2, g, dg };
    };
    const firstHalf = tau <= 0.5;
    const t = firstHalf ? tau / 0.5 : (1 - tau) / 0.5;
    const r = half(t);
    const norm = 1 - e;
    const s1 = h * r.I2 / norm;
    const v1 = 2 * h / (norm * phimax) * r.I1;
    const a1 = 4 * h / (norm * phimax * phimax) * r.g;
    const j1 = 8 * h / (norm * phimax * phimax * phimax) * r.dg;
    if (firstHalf) return { s: s1, v: v1, a: a1, j: j1 };
    return { s: h - s1, v: v1, a: -a1, j: j1 };
  },

  /* 公共入口: 根据 law key 调用 */
  compute: (lawKey, tau, h, phimax, extra) => {
    const fn = MotionLaws[lawKey];
    if (!fn) { console.warn('Unknown law:', lawKey); return { s: 0, v: 0, a: 0, j: 0 }; }
    if (lawKey === 'mod_trap' || lawKey === 'trap_cubic') {
      const tr = (extra && extra.transitionRatio) || 0.125;
      return MotionLaws[lawKey](tau, h, phimax, tr);
    }
    return fn(tau, h, phimax);
  }
};

/* =====================================================================
   App: 主控制器
   ===================================================================== */
const App = {
  // 状态
  state: {
    params: null,
    segments: [],
    points: [],    // 逐点结果
    alerts: [],
    currentViz: 'curves',
    lang: 'zh',
    anim: { phase: 0, playing: true, dir: 1, lastT: 0 },
    view3d: { alpha: Math.PI / 6, beta: Math.PI / 5 },
    probePhi: null,
    visibleRows: {},
    dataVersion: 0,
    dirty: false
  },

  /* -------- 初始化 -------- */
  init() {
    // 恢复语言
    const saved = localStorage.getItem('cam_lang') || 'zh';
    this.setLang(saved, true);
    // 恢复/加载默认分段
    this.loadDefault();
    // 绑定事件
    document.getElementById('p_followerType').addEventListener('change', () => this.onFollowerTypeChange());
    document.getElementById('p_rollerCount').addEventListener('change', () => this.updateRollerAnglesAuto());
    document.getElementById('p_baseDia').addEventListener('change', () => this.onBaseDiaChange());
    document.getElementById('p_offset').addEventListener('input', () => {
      document.getElementById('p_offset').dataset.userSet = '1';
    });
    this.bind3DRotate();
    this.bindCurveProbe();
    this.bindRowToggles();
    // 参数修改后自动重算（无需按计算按钮）
    document.addEventListener('input', (e) => {
      if (e.target.closest && e.target.closest('.left-col')) this.scheduleCompute();
    });
    document.addEventListener('change', (e) => {
      if (e.target.closest && e.target.closest('.left-col')) this.scheduleCompute();
    });
    requestAnimationFrame((t) => this.animLoop(t));
    this.refreshUI();
  },

  // 随动器中心距默认跟随基圆直径的一半，人工修改后不再自动跟随
  onBaseDiaChange() {
    const off = document.getElementById('p_offset');
    if (off.dataset.userSet === '1') return;
    const d = parseFloat(document.getElementById('p_baseDia').value);
    if (isFinite(d)) off.value = +(d / 2).toFixed(2);
  },

  // 3D 视图：拖动旋转视角，双击复位
  bind3DRotate() {
    const cv = document.getElementById('cv3D');
    if (!cv) return;
    let dragging = false, lx = 0, ly = 0;
    cv.style.cursor = 'grab';
    cv.addEventListener('pointerdown', (e) => {
      dragging = true; lx = e.clientX; ly = e.clientY;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      cv.style.cursor = 'grabbing';
    });
    cv.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      this.state.view3d.alpha += dx * 0.01;
      this.state.view3d.beta = Math.max(-1.45, Math.min(1.45, this.state.view3d.beta + dy * 0.01));
      if (this.state.currentViz === 'line3d') this.draw3D();
    });
    const stop = () => { dragging = false; cv.style.cursor = 'grab'; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
    cv.addEventListener('pointerleave', stop);
    cv.addEventListener('dblclick', () => {
      this.state.view3d.alpha = Math.PI / 6;
      this.state.view3d.beta = Math.PI / 5;
      if (this.state.currentViz === 'line3d') this.draw3D();
    });
  },

  /* -------- 语言 -------- */
  t(key, vars) {
    const dict = I18N[this.state.lang] || I18N.zh;
    let str = dict[key];
    if (str == null) str = (I18N.en[key] != null ? I18N.en[key] : key);
    if (vars) for (const k in vars) str = str.split('{' + k + '}').join(vars[k]);
    return str;
  },

  setLang(lang) {
    this.state.lang = lang;
    localStorage.setItem('cam_lang', lang);
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : (lang === 'ja' ? 'ja' : 'en');
    document.querySelectorAll('[data-lang]').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    const dict = I18N[lang] || I18N.zh;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v != null) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const v = dict[el.dataset.i18nPh];
      if (v != null) el.setAttribute('placeholder', v);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const v = dict[el.dataset.i18nTitle];
      if (v != null) el.setAttribute('title', v);
    });
    // 重新渲染所有依赖语言的动态内容（分段卡片、警告、画布图例）
    document.title = this.t('title');
    this.localizeDefaultSegNames();
    if (this.state.segments && this.state.segments.length) this.renderSegTable(true);
    if (this.state.alerts) this.renderAlerts(this.state.alerts);
    this.renderAllViz();
  },

  // 默认分段名（停歇/升程/回程）随语言切换，用户自定义名称保持不动
  localizeDefaultSegNames() {
    const keys = ['segDefaultDwell1', 'segDefaultRise', 'segDefaultDwell2', 'segDefaultFall'];
    const variants = {};
    keys.forEach(k => {
      variants[k] = new Set(['zh', 'en', 'ja'].map(l => I18N[l] && I18N[l][k]).filter(Boolean));
    });
    (this.state.segments || []).forEach(seg => {
      for (const k of keys) {
        if (variants[k].has(seg.name)) { seg.name = this.t(k); break; }
      }
    });
  },

  /* -------- 默认参数 -------- */
  loadDefault() {
    this.getParamFields(); // 读取当前 UI
    // 覆盖默认
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    set('p_baseDia', 80);
    set('p_camWidth', 60);
    set('p_rollerDia', 16);
    set('p_rollerWidth', 20);
    set('p_initialHt', 20);
    set('p_resolution', 3600);
    set('p_followerType', 'trans');
    set('p_handedness', 'rh');
    set('p_offset', 40);
    document.getElementById('p_offset').dataset.userSet = '';
    set('p_motionDir', 'vertical');
    set('p_tiltAngle', 0);
    set('p_camSpeed', 60);
    set('p_loadMass', 5);
    set('p_springForce', 50);
    set('p_efficiency', 95);
    set('p_pressAngleLimit', 30);
    set('p_rollerCount', 1);
    set('p_rollerAngles', '');
    // 默认 4 段: 停歇 90° + 升程 120° + 停歇 60° + 回程 90°
    this.state.segments = [
      { name: this.t('segDefaultDwell1'), angle: 90,  lift: 0,  law: 'dwell',      speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultRise'),   angle: 120, lift: 20, law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultDwell2'), angle: 60,  lift: 20, law: 'dwell',      speed: null, mass: null, transitionRatio: 0.125 },
      { name: this.t('segDefaultFall'),   angle: 90,  lift: 0,  law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125 }
    ];
    this.state.segments.forEach(s => {
      if (s.law === 'trap_cubic' || s.law === 'mod_trap') this.applyMinTransition(s);
    });
    this.updateRollerAnglesAuto();
    this.renderSegTable();
    this.onFollowerTypeChange();
    this.compute();
  },

  /* -------- 读取参数 -------- */
  getParamFields() {
    const n = (id) => parseFloat(document.getElementById(id).value);
    const s = (id) => document.getElementById(id).value;
    const rollerCount = Math.max(1, parseInt(s('p_rollerCount')) || 1);
    let rollerAngles = [];
    const raw = s('p_rollerAngles').trim();
    const parsed = raw ? raw.split(/[,;\s]+/).map(v => parseFloat(v)).filter(v => !isNaN(v)) : [];
    if (parsed.length >= rollerCount) {
      rollerAngles = parsed.slice(0, rollerCount);
    } else {
      // 第一个随动器固定在 0° 作为基准，其余为输入的相对角度，不足的自动均布补齐
      rollerAngles = [0, ...parsed];
      while (rollerAngles.length < rollerCount) rollerAngles.push((360 / rollerCount) * rollerAngles.length);
    }
    this.state.params = {
      baseDia: n('p_baseDia'),
      camWidth: n('p_camWidth'),
      rollerDia: n('p_rollerDia'),
      rollerWidth: n('p_rollerWidth'),
      initialHt: n('p_initialHt'),
      resolution: Math.max(36, n('p_resolution') || 144),
      followerType: s('p_followerType'),
      handedness: s('p_handedness'),
      offset: n('p_offset') || 0,
      motionDir: s('p_motionDir'),
      tiltAngle: n('p_tiltAngle') || 0,
      swingLen: n('p_swingLen') || 100,
      fulcrumDist: n('p_fulcrumDist') || 80,
      swingInitAngle: n('p_swingInitAngle') || 30,
      loadMass: n('p_loadMass'),
      camSpeed: n('p_camSpeed') || 60,
      springForce: n('p_springForce') || 0,
      efficiency: (n('p_efficiency') || 95) / 100,
      pressAngleLimit: n('p_pressAngleLimit') || 30,
      rollerCount,
      rollerAngles
    };
    return this.state.params;
  },

  onFollowerTypeChange() {
    const t = document.getElementById('p_followerType').value;
    document.getElementById('groupTrans').classList.toggle('hidden', t !== 'trans');
    document.getElementById('groupSwing').classList.toggle('hidden', t !== 'swing');
    this.scheduleCompute();
  },

  updateRollerAnglesAuto() {
    const n = parseInt(document.getElementById('p_rollerCount').value) || 1;
    const angles = [];
    for (let i = 1; i < n; i++) angles.push(+(360 / n * i).toFixed(1));
    document.getElementById('p_rollerAngles').value = angles.join(', ');
  },

  /* -------- 分段卡片 -------- */
  addSegment() {
    this.state.segments.push({
      name: this.t('segNo') + (this.state.segments.length + 1),
      angle: 60, lift: 10, law: 'trap_cubic', speed: null, mass: null, transitionRatio: 0.125
    });
    this.applyMinTransition(this.state.segments[this.state.segments.length - 1]);
    this.renderSegTable();
    this.scheduleCompute();
  },

  removeSegment(idx) {
    this.state.segments.splice(idx, 1);
    this.renderSegTable();
    this.scheduleCompute();
  },

  renderSegTable(skipLawRefresh) {
    const sum = this.state.segments.reduce((a, s) => a + s.angle, 0);
    const list = document.getElementById('segList');
    const lawLabel = (k) => this.t(LAW_LABEL_KEY[k] || k);
    list.innerHTML = this.state.segments.map((seg, i) => {
      const cum = this.state.segments.slice(0, i).reduce((a, s) => a + s.angle, 0);
      const lawOpts = LAW_KEYS.map(k =>
        `<option value="${k}" ${k === seg.law ? 'selected' : ''}>${lawLabel(k)}</option>`
      ).join('');
      const massFollow = (seg.mass === null || seg.mass === undefined);
      const speedFollow = (seg.speed === null || seg.speed === undefined);
      const defSpeed = parseFloat((document.getElementById('p_camSpeed') || {}).value) || 60;
      const defMass = parseFloat((document.getElementById('p_loadMass') || {}).value);
      const speedDisp = speedFollow ? defSpeed : seg.speed;
      const massDisp = massFollow ? (isNaN(defMass) ? '' : defMass) : seg.mass;

      // 梯形过渡可编辑行（比例 / 长度）
      let transRow = '';
      if (seg.law === 'trap_cubic' || seg.law === 'mod_trap') {
        const RbNow = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
        const rollerDia = parseFloat((document.getElementById('p_rollerDia') || {}).value) || 8;
        const arc = RbNow * Math.abs(seg.angle) * Math.PI / 180;
        const mode = seg.transitionMode === 'length' ? 'length' : 'ratio';
        const tr = this.getSegTr(seg, RbNow);
        const lenMm = tr * arc;
        const minPct = arc > 0 ? (rollerDia / arc * 100) : 0;
        const bad = lenMm + 1e-9 < rollerDia;
        const val = mode === 'length'
          ? (seg.transitionLength > 0 ? seg.transitionLength : lenMm).toFixed(2)
          : (tr * 100).toFixed(2);
        transRow = `<div class="seg-trans ${bad ? 'trans-bad' : ''}">
          <span class="trans-lbl">${this.t('segTransLbl')}</span>
          <select onchange="App.setTransMode(${i},this.value)">
            <option value="ratio" ${mode === 'ratio' ? 'selected' : ''}>${this.t('transByRatio')}</option>
            <option value="length" ${mode === 'length' ? 'selected' : ''}>${this.t('transByLength')}</option>
          </select>
          <input type="number" min="0.01" step="0.5" value="${val}" onchange="App.setTransValue(${i},this.value)">
          <span class="trans-unit">${mode === 'ratio' ? '%' : 'mm'}</span>
          <span class="trans-eq">${mode === 'ratio' ? '≈ ' + lenMm.toFixed(2) + ' mm' : '≈ ' + (tr * 100).toFixed(1) + ' %'}</span>
          <span class="trans-min">${this.t('transMin', { d: rollerDia.toFixed(2), r: minPct.toFixed(1) })}</span>
          ${bad ? `<span class="trans-warn">⚠ ${this.t('transTooShort', { l: lenMm.toFixed(2), d: rollerDia.toFixed(2) })}</span>` : ''}
        </div>`;
      }

      return `<div class="seg-card" data-idx="${i}">
        <div class="seg-head">
          <span class="seg-idx">${i + 1}</span>
          <input type="text" class="seg-name" value="${seg.name}" onchange="App.state.segments[${i}].name=this.value">
          <button class="seg-del" onclick="App.removeSegment(${i})" title="✕">✕</button>
        </div>
        <div class="seg-fields">
          <label class="seg-field"><span>${this.t('segAngleLbl')}</span>
            <input type="number" value="${seg.angle}" step="1" onchange="App.state.segments[${i}].angle=+this.value;App.renderSegTable();App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segLiftLbl')}</span>
            <input type="number" value="${seg.lift}" step="0.5" onchange="App.state.segments[${i}].lift=+this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segLawLbl')}</span>
            <select onchange="App.onSegLawChange(${i},this.value)">${lawOpts}</select></label>
          <label class="seg-field"><span class="seg-lbl">${this.t('segSpeedLbl')}
              <span class="follow"><input type="checkbox" ${speedFollow ? 'checked' : ''} onchange="App.toggleSegFollow(${i},'speed',this.checked)">${this.t('followDefault')}</span></span>
            <input type="number" value="${speedDisp}" step="10" min="1" ${speedFollow ? 'disabled' : ''}
              onchange="App.state.segments[${i}].speed = +this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span class="seg-lbl">${this.t('segMassLbl')}
              <span class="follow"><input type="checkbox" ${massFollow ? 'checked' : ''} onchange="App.toggleSegFollow(${i},'mass',this.checked)">${this.t('followDefault')}</span></span>
            <input type="number" value="${massDisp}" step="0.5" min="0" ${massFollow ? 'disabled' : ''}
              onchange="App.state.segments[${i}].mass = +this.value;App.scheduleCompute()"></label>
          <label class="seg-field"><span>${this.t('segCumLbl')}</span>
            <div class="seg-static">${i === 0 ? '—' : cum + '°'}</div></label>
          ${transRow}
        </div>
      </div>`;
    }).join('');

    const sumCell = document.getElementById('segSum');
    if (Math.abs(sum - 360) < 0.01) {
      sumCell.className = 'seg-sum sum-ok';
      sumCell.textContent = this.t('sumOk', { sum: sum });
    } else {
      sumCell.className = 'seg-sum sum-bad';
      sumCell.textContent = this.t('sumBad', { sum: sum, diff: (360 - sum).toFixed(1) });
    }
  },

  // 分段转速/负载质量：勾选=跟随工况值（null），取消=写入当前工况值后可单独编辑
  toggleSegFollow(i, field, checked) {
    const seg = this.state.segments[i];
    if (field !== 'speed' && field !== 'mass') return;
    if (checked) {
      seg[field] = null;
    } else {
      const gid = field === 'speed' ? 'p_camSpeed' : 'p_loadMass';
      const g = parseFloat(document.getElementById(gid).value);
      seg[field] = isFinite(g) ? g : 0;
    }
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 有效过渡比例（每端占整段比例）：支持按比例或按弧长(mm)输入
  getSegTr(seg, Rb) {
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    let tr;
    if (seg.transitionMode === 'length' && seg.transitionLength > 0 && arc > 0) {
      tr = seg.transitionLength / arc;
    } else {
      tr = (seg.transitionRatio != null ? seg.transitionRatio : 0.125);
    }
    return Math.min(Math.max(tr, 0.001), 0.49);
  },

  setTransMode(i, mode) {
    const seg = this.state.segments[i];
    const Rb = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    if (mode === 'length') {
      if (!(seg.transitionLength > 0)) {
        const tr = (seg.transitionRatio != null ? seg.transitionRatio : 0.125);
        seg.transitionLength = +(tr * arc).toFixed(2);
      }
    } else if (arc > 0 && !(seg.transitionRatio > 0)) {
      seg.transitionRatio = +((seg.transitionLength || 0) / arc).toFixed(4);
    }
    seg.transitionMode = (mode === 'length' ? 'length' : 'ratio');
    seg.transAuto = false;
    this.renderSegTable();
    this.scheduleCompute();
  },

  setTransValue(i, val) {
    const seg = this.state.segments[i];
    const v = parseFloat(val);
    if (!isFinite(v) || v <= 0) return;
    if (seg.transitionMode === 'length') {
      seg.transitionLength = v;
    } else {
      seg.transitionRatio = v / 100;
    }
    seg.transAuto = false;
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 过渡长度取允许的最小值（由随动器直径决定）
  applyMinTransition(seg) {
    const Rb = (parseFloat((document.getElementById('p_baseDia') || {}).value) || 80) / 2;
    const D = parseFloat((document.getElementById('p_rollerDia') || {}).value) || 8;
    const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
    seg.transitionMode = 'length';
    seg.transitionLength = +(arc > 0 ? Math.min(D, arc * 0.49) : D).toFixed(2);
    seg.transitionRatio = arc > 0 ? +Math.min(D / arc, 0.49).toFixed(4) : 0.125;
    seg.transAuto = true;
  },

  // 随动器直径/基圆变化时，自动过渡的段重新取最小值
  reapplyAutoTransitions() {
    this.state.segments.forEach(s => {
      if (s.transAuto && (s.law === 'trap_cubic' || s.law === 'mod_trap')) this.applyMinTransition(s);
    });
  },

  // 切换运动规律：选择梯形时过渡自动设为最小值
  onSegLawChange(i, law) {
    const seg = this.state.segments[i];
    seg.law = law;
    if (law === 'trap_cubic' || law === 'mod_trap') this.applyMinTransition(seg);
    this.renderSegTable();
    this.scheduleCompute();
  },

  // 参数修改后自动重算（防抖）
  scheduleCompute() {
    clearTimeout(this._autoTimer);
    this._autoTimer = setTimeout(() => {
      try {
        this.reapplyAutoTransitions();
        this.compute();
        // 刷新分段卡片中的过渡最小值/换算/警示（正在编辑分段输入框时跳过，避免打断输入）
        const ae = document.activeElement;
        const editingSeg = ae && ae.closest && ae.closest('#segList');
        if (!editingSeg) this.renderSegTable(true);
      } catch (e) { console.error(e); }
    }, 300);
  },
  compute() {
    const p = this.getParamFields();
    const segs = this.state.segments;
    const totalAngle = segs.reduce((a, s) => a + s.angle, 0);
    const resolutions = Math.max(36, p.resolution);
    const step = 360 / resolutions;

    const Rb = p.baseDia / 2;
    const dR = p.rollerDia / 2;
    // 工作轮廓半径（圆柱毛坯外径 = Rb + initialHt + 最大升程 / π 展开？这里取 Rb + maxLift/π 作为展开基准）
    // 圆柱凸轮展开：圆弧长 = Rb * φ (φ in rad)，轴向位移 = s(φ)
    // 随动器轨迹 = 理论轮廓 (Rb*φ, s(φ))，工作轮廓 = 理论轮廓 + 沿法线偏移 dR
    // 注：圆柱凸轮通常用展开坐标 (x=弧长, y=轴向) 表示
    // 理论轮廓（随动器中心轨迹）: x_theory = Rb * φ_rad, y_theory = s(φ)  (直动情况)
    // 工作轮廓: 理论轮廓沿法线向内偏移 dR（随动器半径）
    // 压力角 α = arctan( |ds/d(Rb·φ)| ) = arctan( |ds/(Rb·dφ)| )

    let cumLift = 0; // 段间升程累积（段末作为下一段起点）
    const pts = [];

    for (let segIdx = 0; segIdx < segs.length; segIdx++) {
      const seg = segs[segIdx];
      const phimax = seg.angle;
      const s0 = cumLift;               // 本段起点位移
      const hSeg = seg.lift - s0;       // 本段升程（相对）
      // 注意：如果段末升程大于下一段起点需要处理
      // 这里假设：每个 seg.lift 是"段末绝对位移"，方便用户直观设置
      // 如果 seg.lift < s0，则理解为回程（hSeg 可以为负）

      const nSteps = Math.max(2, Math.round(phimax / step));
      const dphi = phimax / nSteps;

      for (let k = 0; k <= nSteps; k++) {
        const tau = k / nSteps;
        const phi_in_seg = tau * phimax;
        const phi_abs = pts.length > 0 ? pts[pts.length - 1].phi + dphi : 0;
        // 用 MotionLaws 计算相对增量
        const rel = MotionLaws.compute(seg.law, tau, Math.abs(hSeg), phimax, { transitionRatio: this.getSegTr(seg, Rb) });
        // 位移: s0 ± 量
        let ds = rel.s;
        if (hSeg < 0) ds = -rel.s;
        const s_abs = s0 + ds;

        // v, a, j 都是对段内 φ 的导数, 直接输出
        // 若 hSeg < 0，v/a/j 符号也需要取反（因为方向相反）
        const sign = hSeg >= 0 ? 1 : -1;
        const v = rel.v * sign;
        const a = rel.a * sign;
        const j = rel.j * sign;

        // 压力角：α = arctan( |ds/dx| )，x = Rb·φ(rad)
        // v 的单位是 mm/°，需换成 mm/rad 再除以 Rb
        const vRad = v * (180 / Math.PI);          // mm/rad
        const aRad = a * (180 / Math.PI) * (180 / Math.PI); // mm/rad²
        const alphaRad = Math.atan(Math.abs(vRad) / Math.max(Rb, 0.1));
        const alphaDeg = alphaRad * 180 / Math.PI;

        // 理论轮廓坐标 (圆柱展开)
        // 直动: x = Rb * φ_abs (弧长 mm), y = s_abs (轴向 mm)
        const x_theory = Rb * (phi_abs * Math.PI / 180);
        const y_theory = s_abs;

        // 工作轮廓: 理论轮廓沿法线向内偏移 dR
        // 法线方向: 对 (x_theory, y_theory)，切线方向由 ds/dφ 决定
        // 切线斜率 dy/dx = (ds/dφ) / (Rb) = v / Rb
        // 法线方向 = (-dy/dx, 1) 归一化
        // 切线/法线：dx/dφ(deg) = Rb·π/180，dy/dφ(deg) = v (mm/°)
        const dxd = Rb * Math.PI / 180;
        const norm = Math.sqrt(dxd * dxd + v * v);
        const nx = -v / norm;    // 法线 x
        const ny = dxd / norm;   // 法线 y
        const x_work = x_theory + dR * nx;
        const y_work = y_theory + dR * ny;

        // 三维坐标 (圆柱参数方程)
        // 理论: X=Rb·cos(φ), Y=Rb·sin(φ), Z=s_abs
        // 右旋: 轴向增加方向沿 Z+
        const phi_rad = phi_abs * Math.PI / 180;
        const hx_hex = Rb * Math.cos(phi_rad);
        const hy_hex = Rb * Math.sin(phi_rad);
        const hz_hex = s_abs;

        // 受力分析
        // 直动竖直: 正压力 N = (F_load + F_spring + m_total·a_dyn) / cos(α)
        // 方向始终认为正值（分力朝上为正）
        const phi_r = phi_abs * Math.PI / 180;
        const speedEff = (seg.speed === null || seg.speed === undefined) ? p.camSpeed : seg.speed;
        const omega_rad = speedEff * 2 * Math.PI / 60;
        const omegaDeg = omega_rad * 180 / Math.PI;   // °/s
        // 实际线速度/加速度：v 单位 mm/°，a 单位 mm/°²
        const v_dyn = v * omegaDeg;                   // mm/s
        const a_dyn = a * omegaDeg * omegaDeg;        // mm/s²
        const j_dyn = j * omegaDeg * omegaDeg * omegaDeg; // mm/s³
        // 合力：重力（负载质量，按段可单独设置）+ 弹簧力 + 惯性力
        const g = 9.81;
        const segMass = (seg.mass === null || seg.mass === undefined) ? p.loadMass : seg.mass;
        const massTotal = segMass;
        const forceGravity = massTotal * g;             // N, 沿 +s 方向的重力分量（始终阻碍升程）
        const forceSpring = p.springForce;              // N, 复位弹簧，方向恒为 -s
        const forceInertia = massTotal * a_dyn / 1000;  // N, 有符号，随加速度方向变化
        // 沿 +s 方向平衡：F_cam = 重力分量 + 弹簧 + m·a
        // 升程段重力/弹簧阻碍（+），回程段重力/弹簧助力、加速度项可能为负（凸轮需反向拉住随动器）
        let F_cam;
        if (p.motionDir === 'vertical') {
          F_cam = forceGravity + forceSpring + forceInertia;
        } else if (p.motionDir === 'horizontal') {
          F_cam = forceSpring + forceInertia;
        } else {
          F_cam = forceGravity * Math.sin((p.tiltAngle || 0) * Math.PI / 180) + forceSpring + forceInertia;
        }
        // 曲线统一显示幅值（F/N 无负值），方向信息由扭矩符号体现
        const forceAxial = Math.abs(F_cam);             // 沿运动方向的力（= N·cosα）
        const N_normal = forceAxial / Math.cos(alphaRad); // 法向正压力 = F / cosα

        // 输入扭矩 T = Rb · N · sinα / η = F · ds/dφ / η
        const T_input = Rb / 1000 * N_normal * Math.sin(alphaRad) / Math.max(p.efficiency, 0.01);

        pts.push({
          phi: phi_abs, phiRad: phi_r,
          s: s_abs, v, a, j,
          v_s: v_dyn, a_s: a_dyn, j_s: j_dyn,
          alphaDeg, alphaRad, vRad, aRad,
          x_theory, y_theory,
          x_work, y_work,
          x3d_th: hx_hex, y3d_th: hy_hex, z3d_th: hz_hex,
          forceN: N_normal,
          forceAxial: forceAxial,
          torqueNmm: T_input,
          segIdx,
          segName: seg.name
        });
      }
      cumLift = seg.lift; // 本段末升程作为下一段起点
    }

    this.state.points = pts;
    this.state.dataVersion++;
    this._curveCache = null;
    this.runValidator(segs, p, pts);
    this.renderAllViz();
  },

  /* -------- 校验 -------- */
  runValidator(segs, p, pts) {
    const alerts = [];
    const Rb = p.baseDia / 2;
    const totalAngle = segs.reduce((a, s) => a + s.angle, 0);

    if (Math.abs(totalAngle - 360) > 0.01) {
      alerts.push({
        level: 'E',
        text: this.t('alertSumAngle', { sum: totalAngle.toFixed(1) }),
        suggestion: this.t('sugSumAngle')
      });
    }

    // 压力角超限
    const maxAlpha = pts.reduce((m, pt) => Math.max(m, pt.alphaDeg), 0);
    if (maxAlpha > p.pressAngleLimit) {
      const worst = pts.reduce((m, pt) => pt.alphaDeg > m.alphaDeg ? pt : m, { alphaDeg: 0 });
      alerts.push({
        level: 'E',
        text: this.t('alertAlphaExceed', { max: maxAlpha.toFixed(2), lim: p.pressAngleLimit, phi: worst.phi.toFixed(1) }),
        suggestion: this.t('sugAlphaExceed')
      });
    } else if (maxAlpha > p.pressAngleLimit * 0.85) {
      alerts.push({
        level: 'W',
        text: this.t('alertAlphaNear', { max: maxAlpha.toFixed(2), lim: p.pressAngleLimit }),
        suggestion: this.t('sugAlphaNear')
      });
    }

    // 加速度不得超过 1 g（按各段实际转速换算的 mm/s²）
    const G_MM = 9806.65; // 1 g = 9.80665 m/s² = 9806.65 mm/s²
    let maxAcc = 0, worstAcc = null;
    for (const pt of pts) {
      const aa = Math.abs(pt.a_s || 0);
      if (aa > maxAcc) { maxAcc = aa; worstAcc = pt; }
    }
    if (maxAcc > G_MM) {
      alerts.push({
        level: 'E',
        text: this.t('alertAccG', {
          g: (maxAcc / G_MM).toFixed(2),
          a: (maxAcc / 1000).toFixed(2),
          phi: worstAcc ? worstAcc.phi.toFixed(1) : '—',
          seg: worstAcc && worstAcc.segName ? '，' + worstAcc.segName : ''
        }),
        suggestion: this.t('sugAccG')
      });
    }

    // 曲率半径自交检查（v/a 换算到 mm/rad、mm/rad² 后计算）
    let minRadius = Infinity;
    for (const pt of pts) {
      const vR = pt.vRad, aR = pt.aRad;
      const rho = Math.pow(Rb * Rb + vR * vR, 1.5) / Math.abs(Rb * aR + 1e-12);
      if (rho < minRadius && rho > 0.1) minRadius = rho;
    }
    if (minRadius < p.rollerDia / 2) {
      alerts.push({
        level: 'E',
        text: this.t('alertCurvature', { min: minRadius.toFixed(2), roller: (p.rollerDia / 2).toFixed(2) }),
        suggestion: this.t('sugCurvature')
      });
    }

    // 梯形过渡长度校核（按随动器直径）
    segs.forEach((seg, si) => {
      if (seg.law !== 'trap_cubic' && seg.law !== 'mod_trap') return;
      const arc = Rb * Math.abs(seg.angle) * Math.PI / 180;
      if (arc <= 0) return;
      const tr = this.getSegTr(seg, Rb);
      const L = tr * arc;
      const Lmin = p.rollerDia;
      const trMin = Lmin / arc;
      if (trMin >= 0.49) {
        alerts.push({
          level: 'E',
          text: this.t('alertTransImpossible', { seg: si + 1, d: Lmin.toFixed(2), arc: arc.toFixed(2) }),
          suggestion: this.t('sugTransImpossible')
        });
      } else if (L + 1e-6 < Lmin) {
        alerts.push({
          level: 'W',
          text: this.t('alertTransShort', {
            seg: si + 1, l: L.toFixed(2), d: Lmin.toFixed(2),
            cur: (tr * 100).toFixed(1), r: (trMin * 100).toFixed(1)
          }),
          suggestion: this.t('sugTransShort', { r: (trMin * 100).toFixed(1) })
        });
      }
    });

    // 跃度不连续
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1];
      const cur = pts[i];
      if (cur.segIdx !== prev.segIdx) {
        const deltaJ = Math.abs(cur.j - prev.j);
        if (deltaJ > 0.01 && prev.law !== 'dwell' && cur.law !== 'dwell') {
          alerts.push({
            level: 'I',
            text: this.t('alertJerk', {
              phi: prev.phi.toFixed(1),
              prev: prev.j.toFixed(3),
              cur: cur.j.toFixed(3)
            }),
            suggestion: this.t('sugJerk')
          });
        }
      }
    }

    // 首尾闭合
    const s0 = pts[0].s;
    const sEnd = pts[pts.length - 1].s;
    if (Math.abs(s0 - sEnd) > 0.001) {
      alerts.push({
        level: 'E',
        text: this.t('alertCloseMismatch', { s0: s0.toFixed(3), s1: sEnd.toFixed(3) }),
        suggestion: this.t('sugCloseMismatch')
      });
    }

    // 分辨率过低
    if (pts.length < 36) {
      alerts.push({
        level: 'I',
        text: this.t('alertLowRes', { res: p.resolution }),
        suggestion: this.t('sugLowRes')
      });
    }

    this.state.alerts = alerts;
    this.renderAlerts(alerts);
  },

  renderAlerts(alerts) {
    const box = document.getElementById('alertList');
    if (!alerts || alerts.length === 0) {
      box.innerHTML = `<div class="alert alert-i"><span class="level">✓</span><span class="body">${this.t('okNoAlerts')}</span></div>`;
      return;
    }
    box.innerHTML = alerts.slice(0, 20).map(a => {
      const levelCls = a.level === 'E' ? 'alert-e' : a.level === 'W' ? 'alert-w' : 'alert-i';
      const levelLabel = a.level === 'E' ? 'E' : a.level === 'W' ? '!' : 'i';
      return `<div class="alert ${levelCls}"><span class="level">${levelLabel}</span><span class="body"><b>${a.text}</b><span class="suggestion">💡 ${a.suggestion}</span></span></div>`;
    }).join('');
    if (alerts.length > 20) box.innerHTML += `<div class="alert alert-i"><span class="level">i</span><span class="body">${this.t('moreAlerts', { n: alerts.length - 20 })}</span></div>`;
  },

  /* -------- 数据表已移除：逐点数据仅在后台计算，不再渲染表格 -------- */

  /* -------- 可视化切换 -------- */
  switchViz(name, btn) {
    this.state.currentViz = name;
    document.querySelectorAll('.viz-pane').forEach(p => p.classList.toggle('hidden', p.id !== 'viz-' + name));
    document.querySelectorAll('.viz-tab').forEach(t => t.classList.toggle('active', t === btn));
    this.renderAllViz();
  },

  renderAllViz() {
    if (!this.state.points || this.state.points.length === 0) return;
    if (this.state.currentViz === 'curves') this.drawCurves();
    else if (this.state.currentViz === 'flatten') this.drawFlatten();
    else if (this.state.currentViz === 'line3d') this.draw3D();
    else if (this.state.currentViz === 'indic') this.drawIndic();
  },

  /* -------- 运动曲线图 -------- */
  cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  },

  // 将颜色转为指定透明度（用于行背景浅色）
  withAlpha(color, a) {
    const c = (color || '').trim();
    if (c.charAt(0) === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h.split('').map(x => x + x).join('');
      const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
      if (isFinite(r) && isFinite(g) && isFinite(b)) return `rgba(${r},${g},${b},${a})`;
    }
    const m = c.match(/rgba?\(([^)]+)\)/);
    if (m) {
      const s = m[1].split(',').map(x => x.trim());
      return `rgba(${s[0]},${s[1]},${s[2]},${a})`;
    }
    return `rgba(140,150,170,${a})`;
  },

  drawCurves() {
    const cv = document.getElementById('cvCurves');
    const W = cv.width;
    const vis = this.state.visibleRows || {};
    const nVis = ['s', 'v_s', 'a_s', 'j_s', 'alphaDeg', 'forceAxial', 'forceN']
      .filter(k => vis[k] !== false).length || 1;
    const targetH = 68 + 170 * nVis;
    if (cv.height !== targetH) cv.height = targetH;
    const H = cv.height;
    const ctx = cv.getContext('2d');
    const visKey = Object.keys(vis).filter(k => vis[k] === false).join(',');
    const key = W + 'x' + H + 'x' + this.state.lang + 'x' + this.state.dataVersion + 'x' + visKey;
    if (!this._curveCache || this._curveCache.key !== key) {
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      this.paintCurves(off.getContext('2d'), W, H);
      this._curveCache = { key, canvas: off };
    }
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(this._curveCache.canvas, 0, 0);
    this.drawProbe(ctx);
  },

  paintCurves(ctx, W, H) {
    const pad = { l: 108, r: 22, t: 26, b: 42 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

    const pts = this.state.points;
    const maxPhi = 360;

    const rows = [
      { key: 's', label: 's', name: this.t('legS'), unit: 'mm', v: '--line-s' },
      { key: 'v_s', label: 'v', name: this.t('legV'), unit: 'mm/s', v: '--line-v' },
      { key: 'a_s', label: 'a', name: this.t('legA'), unit: 'mm/s²', v: '--line-a' },
      { key: 'j_s', label: 'j', name: this.t('legJ'), unit: 'mm/s³', v: '--line-j' },
      { key: 'alphaDeg', label: 'α', name: this.t('legAlpha'), unit: '°', v: '--line-alpha', nonNeg: true },
      { key: 'forceAxial', label: 'F', name: this.t('legFaxial'), unit: 'N', v: '--line-force', nonNeg: true, fold: true },
      { key: 'forceN', label: 'N', name: this.t('legN'), unit: 'N', v: '--line-norm', nonNeg: true, fold: true }
    ].filter(r => (this.state.visibleRows || {})[r.key] !== false);
    if (rows.length === 0) return;
    const totalWeight = rows.reduce((a, r) => a + (r.weight || 1), 0);
    const unitH = plotH / totalWeight;
    const gridC = this.cssVar('--grid');
    const borderC = this.cssVar('--border');
    const dimC = this.cssVar('--text-dim');
    const mutedC = this.cssVar('--text-muted');

    const xToPx = (phi) => pad.l + (phi / maxPhi) * plotW;

    let rowY = pad.t;
    rows.forEach((row, idx) => {
      const rowH = unitH * (row.weight || 1);
      const y0 = rowY;
      rowY += rowH;
      const y1 = y0 + rowH - 3;

      // 行浅色背景（按曲线颜色着色，区分各参数行）
      ctx.fillStyle = this.withAlpha(this.cssVar(row.v), 0.07);
      ctx.fillRect(0, y0, W, rowH);
      // 行分隔线
      ctx.beginPath(); ctx.strokeStyle = borderC; ctx.lineWidth = 1;
      ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

      const vals = pts.map(p => p[row.key]);
      const vRealMax = Math.max(...vals);
      const vMax = Math.max(...vals.map(Math.abs), 0.01);
      const vMin = Math.min(...vals);
      // 对称量（s/v/a/j）：零线居中；非负量（α）：零线在底部；
      // 折叠量（F/N）：纵轴自最小值起，省去 0~min 的大片空白
      let yToPx, zeroY;
      if (row.fold) {
        const span = Math.max(vMax - vMin, 1e-9);
        yToPx = (v) => y0 + rowH - 3 - ((v - vMin) / span) * (rowH - 8);
        zeroY = null;
      } else if (row.nonNeg) {
        yToPx = (v) => y0 + rowH - 2 - (Math.abs(v) / vMax) * (rowH - 4);
        zeroY = y0 + rowH - 2;
      } else {
        yToPx = (v) => y0 + rowH / 2 - (v / vMax) * (rowH / 2 - 2);
        zeroY = y0 + rowH / 2;
      }
      row.yToPx = yToPx; row.vMin = vMin; row.vMax = vMax;
      row.rowY0 = y0; row.rowH = rowH;

      // 网格
      ctx.strokeStyle = gridC; ctx.lineWidth = 1;
      for (let k = 0; k <= 6; k++) {
        const x = pad.l + (k / 6) * plotW;
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
      // 零点轴
      if (zeroY !== null) {
        ctx.beginPath(); ctx.strokeStyle = borderC;
        ctx.moveTo(pad.l, zeroY); ctx.lineTo(pad.l + plotW, zeroY); ctx.stroke();
      }

      // 曲线
      ctx.strokeStyle = this.cssVar(row.v); ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((pt, i) => {
        const x = xToPx(pt.phi);
        const y = yToPx(pt[row.key]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // 左侧图例：垂直居中于本行
      const lx = 10;
      const cy = y0 + rowH / 2;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '600 13px sans-serif'; ctx.fillStyle = this.cssVar(row.v);
      ctx.fillText(row.label, lx, cy - 18);
      const lw = ctx.measureText(row.label).width;
      ctx.font = '12px sans-serif'; ctx.fillStyle = dimC;
      ctx.fillText(row.name, lx + lw + 6, cy - 18);
      ctx.font = '11px sans-serif'; ctx.fillStyle = mutedC;
      ctx.fillText(this.t('cvFoldMin') + ' ' + this.fmtProbe(vMin) + ' ' + row.unit, lx, cy);
      ctx.fillText(this.t('cvFoldMax') + ' ' + this.fmtProbe(vRealMax) + ' ' + row.unit, lx, cy + 18);
      ctx.textBaseline = 'alphabetic';
    });

    // 底部轴标签 + 刻度
    ctx.fillStyle = mutedC; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    for (let a = 0; a <= 360; a += 90) {
      ctx.fillText(a + '°', xToPx(a), H - 22);
    }
    ctx.fillText(this.t('cvPhi'), W / 2, H - 5);

    this._curveGeom = { pad, plotW, plotH, maxPhi };
    this._curveRows = rows;
  },

  /* -------- 曲线取值探针：竖直游标 + 数值框 -------- */
  fmtProbe(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 1000) return v.toFixed(0);
    if (a >= 100) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.01) return v.toFixed(3);
    return v.toFixed(4);
  },

  drawProbe(ctx) {
    const geo = this._curveGeom, rows = this._curveRows, pts = this.state.points;
    const phi = this.state.probePhi;
    if (!geo || !rows || !pts || phi === null || phi === undefined) return;
    let best = pts[0], bd = Infinity;
    for (const p of pts) {
      const d = Math.abs(p.phi - phi);
      if (d < bd) { bd = d; best = p; }
    }
    const x = geo.pad.l + (best.phi / geo.maxPhi) * geo.plotW;
    const right = geo.pad.l + geo.plotW;
    const rr = (c, bx, by, bw, bh, rad) => {
      c.beginPath();
      c.moveTo(bx + rad, by);
      c.arcTo(bx + bw, by, bx + bw, by + bh, rad);
      c.arcTo(bx + bw, by + bh, bx, by + bh, rad);
      c.arcTo(bx, by + bh, bx, by, rad);
      c.arcTo(bx, by, bx + bw, by, rad);
      c.closePath();
    };
    ctx.save();
    // 竖直游标
    ctx.strokeStyle = 'rgba(232,89,12,0.85)'; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, geo.pad.t); ctx.lineTo(x, geo.pad.t + geo.plotH); ctx.stroke();
    ctx.setLineDash([]);

    // 各曲线取值圆点
    rows.forEach(r => {
      if (!r.yToPx) return;
      ctx.beginPath(); ctx.fillStyle = this.cssVar(r.v);
      ctx.arc(x, r.yToPx(best[r.key]), 3.6, 0, Math.PI * 2); ctx.fill();
    });

    // 角度标签：跟随鼠标水平位置
    const head = best.phi.toFixed(1) + '°';
    ctx.font = '600 12px sans-serif';
    const hw = ctx.measureText(head).width + 16;
    let hx = x + 9; if (hx + hw > right) hx = x - hw - 9;
    if (hx < 4) hx = 4;
    const hy = geo.pad.t + 2;
    ctx.fillStyle = 'rgba(31,35,40,0.86)';
    rr(ctx, hx, hy, hw, 20, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(head, hx + 8, hy + 10);

    // 每行数值：显示在本行内，颜色与曲线一致，水平跟随鼠标
    rows.forEach(r => {
      if (!r.yToPx) return;
      const col = this.cssVar(r.v);
      const txt = r.label + ' ' + this.fmtProbe(best[r.key]) + ' ' + r.unit;
      ctx.font = '600 12px sans-serif';
      const tw = ctx.measureText(txt).width + 18;
      let tx = x + 10; if (tx + tw > right) tx = x - tw - 10;
      if (tx < 4) tx = 4;
      const yv = r.yToPx(best[r.key]);
      const top = r.rowY0 + 2, bot = r.rowY0 + r.rowH - 24;
      const ty = Math.max(top, Math.min(bot, yv - 10));
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
      rr(ctx, tx, ty, tw, 20, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      ctx.fillRect(tx + 1, ty + 3, 3, 14);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, tx + 10, ty + 10);
    });
    ctx.restore();
  },

  bindRowToggles() {
    const box = document.getElementById('rowToggles');
    if (!box) return;
    const boxes = Array.from(box.querySelectorAll('input[data-row]'));
    boxes.forEach(cb => {
      cb.checked = this.state.visibleRows[cb.dataset.row] !== false;
      cb.addEventListener('change', () => {
        // 至少保留一行，避免画布为空
        if (!boxes.some(x => x.checked)) { cb.checked = true; return; }
        this.state.visibleRows[cb.dataset.row] = cb.checked;
        this._curveCache = null;
        this.drawCurves();
      });
    });
  },

  bindCurveProbe() {
    const cv = document.getElementById('cvCurves');
    if (!cv) return;
    cv.style.cursor = 'crosshair';
    const move = (e) => {
      if (this.state.currentViz !== 'curves' || !this._curveGeom) return;
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const px = (e.clientX - r.left) * (cv.width / r.width);
      const geo = this._curveGeom;
      if (px < geo.pad.l - 6 || px > geo.pad.l + geo.plotW + 6) return;
      const phi = Math.max(0, Math.min(geo.maxPhi, (px - geo.pad.l) / geo.plotW * geo.maxPhi));
      this.state.probePhi = phi;
      this.drawCurves();
    };
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      move(e);
    });
    cv.addEventListener('pointerleave', () => {
      this.state.probePhi = null;
      this.drawCurves();
    });
  },

  /* -------- 轮廓展开图 -------- */
  drawFlatten() {
    const cv = document.getElementById('cvFlatten');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);

    const pad = { l: 66, r: 24, t: 60, b: 44 };
    const pts = this.state.points;
    const p = this.state.params;

    // 收集理论/工作轮廓绝对坐标，自动适配范围，确保完整显示
    let xMin = 0, xMax = 0, yMin = 0, yMax = 0;
    pts.forEach(pt => {
      const xw = pt.x_theory + (pt.x_work - pt.x_theory);
      const yw = pt.s + (pt.y_work - pt.y_theory);
      xMin = Math.min(xMin, pt.x_theory, xw);
      xMax = Math.max(xMax, pt.x_theory, xw);
      yMin = Math.min(yMin, pt.s, yw);
      yMax = Math.max(yMax, pt.s, yw);
    });
    const xPad = (xMax - xMin) * 0.03 || 1;
    const yPad = (yMax - yMin) * 0.08 || 1;
    xMin -= xPad; xMax += xPad; yMin -= yPad; yMax += yPad;

    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const xToPx = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * plotW;
    const yToPx = (y) => pad.t + plotH - ((y - yMin) / (yMax - yMin)) * plotH;
    const gridC = this.cssVar('--grid');
    const textC = this.cssVar('--text');
    const mutedC = this.cssVar('--text-muted');

    // 背景网格
    ctx.strokeStyle = gridC; ctx.lineWidth = 1;
    for (let k = 0; k <= 8; k++) {
      ctx.beginPath(); ctx.moveTo(pad.l + k * plotW / 8, pad.t); ctx.lineTo(pad.l + k * plotW / 8, pad.t + plotH); ctx.stroke();
    }
    for (let k = 0; k <= 5; k++) {
      ctx.beginPath(); ctx.moveTo(pad.l, pad.t + k * plotH / 5); ctx.lineTo(pad.l + plotW, pad.t + k * plotH / 5); ctx.stroke();
    }

    // 理论轮廓
    ctx.strokeStyle = '#4158d0'; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const x = xToPx(pt.x_theory);
      const y = yToPx(pt.s);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 工作轮廓
    ctx.strokeStyle = '#c850c0'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const yAbs = pt.s + (pt.y_work - pt.y_theory);
      const xAbs = pt.x_theory + (pt.x_work - pt.x_theory);
      const px = xToPx(xAbs);
      const py = yToPx(yAbs);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // 基圆参考线（y = 0）
    ctx.strokeStyle = mutedC; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.l, yToPx(0)); ctx.lineTo(pad.l + plotW, yToPx(0)); ctx.stroke();
    ctx.setLineDash([]);

    // 随动器示意
    const mid = pts[Math.floor(pts.length / 2)];
    const rollerX = xToPx(mid.x_theory);
    const rollerY = yToPx(mid.s);
    ctx.fillStyle = '#ff922b'; ctx.beginPath();
    ctx.arc(rollerX, rollerY, 7, 0, Math.PI * 2);
    ctx.fill();

    // 图例（顶部独立区域，不与曲线重叠）
    ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#4158d0'; ctx.fillRect(pad.l, 14, 16, 4);
    ctx.fillStyle = textC; ctx.fillText(this.t('cvTheory'), pad.l + 22, 19);
    ctx.fillStyle = '#c850c0'; ctx.fillRect(pad.l, 36, 16, 4);
    ctx.fillStyle = textC; ctx.fillText(this.t('cvWork'), pad.l + 22, 41);

    // 轴标签
    ctx.fillStyle = mutedC;
    ctx.textAlign = 'center';
    ctx.fillText(this.t('cvArc'), W / 2, H - 8);
    ctx.save(); ctx.translate(16, H / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText(this.t('cvAxial'), 0, 0); ctx.restore();
  },

  /* -------- 3D 线框 -------- */
  draw3D() {
    const cv = document.getElementById('cv3D');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);

    const pts = this.state.points;
    const p = this.state.params;
    const Rb = p.baseDia / 2;
    const camLen = p.camWidth;

    // 正交投影 + 自动适配画布 + 手动视角（拖动旋转）
    const { alpha, beta } = this.state.view3d;
    const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
    const cosB = Math.cos(beta), sinB = Math.sin(beta);

    const maxLift = pts.reduce((m, pt) => Math.max(m, pt.z3d_th), 0);
    const swing = p.followerType === 'swing';
    const Rmax = Math.max(Rb + p.initialHt + 20, swing ? Rb + (p.swingLen || 100) : Rb);
    const rodLen = Math.max(50, Rb * 1.2); // 随动器杆示意长度（非参数）
    const zTop = p.initialHt + maxLift + (swing ? 0 : rodLen);
    const zOff = Rb * 0.3;
    const z1min = -zOff, z1max = zTop - zOff;
    const y2min = -z1max * cosB - Rmax * sinB;
    const y2max = -z1min * cosB + Rmax * sinB;
    const bw = 2 * Rmax;
    const bh = Math.max(y2max - y2min, 1);
    const margin = 26;
    const scale = Math.min((W - 2 * margin) / bw, (H - 2 * margin) / bh);
    const cx = W / 2;
    const cy = H / 2 - ((y2min + y2max) / 2) * scale;

    // 把 3D 点投影到 2D
    const project = (X, Y, Z) => {
      const x1 = X * cosA - Y * sinA;
      const y1 = X * sinA + Y * cosA;
      const z1 = Z - zOff;
      const x2 = x1;
      const y2 = -z1 * cosB + y1 * sinB;
      return { x: cx + x2 * scale, y: cy + y2 * scale };
    };

    // 动画相位
    const phase = this.state.anim.phase * Math.PI / 180;
    const rotate = (X, Y) => ({
      X: X * Math.cos(phase) - Y * Math.sin(phase),
      Y: X * Math.sin(phase) + Y * Math.cos(phase)
    });

    // 画圆柱基体外框（两个圆环 + 两条母线）
    const drawCylinder = (R, color) => {
      const seg = 64;
      // 前盖 (z = 0)
      ctx.strokeStyle = color; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let k = 0; k <= seg; k++) {
        const theta = 2 * Math.PI * k / seg;
        const { X, Y } = rotate(R * Math.cos(theta), R * Math.sin(theta));
        const pt = project(X, Y, 0);
        if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      // 后盖 (z = camLen)
      ctx.beginPath();
      for (let k = 0; k <= seg; k++) {
        const theta = 2 * Math.PI * k / seg;
        const { X, Y } = rotate(R * Math.cos(theta), R * Math.sin(theta));
        const pt = project(X, Y, camLen);
        if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    };

    // 画轴（中心 + 两条母线）
    const axisFwd = project(0, 0, 0);
    const axisBack = project(0, 0, camLen);
    ctx.strokeStyle = this.cssVar('--text-muted'); ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(axisFwd.x, axisFwd.y); ctx.lineTo(axisBack.x, axisBack.y); ctx.stroke();
    ctx.setLineDash([]);

    drawCylinder(Rb, '#b8c0ff'); // 基圆
    drawCylinder(Rb + p.initialHt + 20, 'rgba(129,140,248,0.5)'); // 毛坯外

    // 随动器中心轨迹（理论轮廓）
    ctx.strokeStyle = '#4158d0'; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const { X, Y } = rotate(pt.x3d_th, pt.y3d_th);
      const pr = project(X, Y, pt.z3d_th + p.initialHt);
      if (i === 0) ctx.moveTo(pr.x, pr.y); else ctx.lineTo(pr.x, pr.y);
    });
    ctx.stroke();

    // 随动器（随动器 + 杆/摆臂）：固定在世界角度，只做轴向直动或摆动，不随凸轮旋转
    const nRollers = p.rollerCount;
    const NP = pts.length;
    const liftAtWorld = (worldDeg) => {
      const phi = ((worldDeg - this.state.anim.phase) % 360 + 360) % 360;
      const idx = Math.round(phi / 360 * (NP - 1));
      const pt = pts[Math.min(Math.max(idx, 0), NP - 1)];
      return pt ? pt.z3d_th + p.initialHt : p.initialHt;
    };
    for (let r = 0; r < nRollers; r++) {
      const worldDeg = (p.rollerAngles[r] != null && p.rollerAngles[r] !== '')
        ? Number(p.rollerAngles[r]) : (360 / nRollers * r);
      const th = worldDeg * Math.PI / 180;
      // 随动器固定在世界角度 θ 上，θ 不随 phase 改变，仅轴向 z 变化
      const X = Rb * Math.cos(th), Y = Rb * Math.sin(th);
      const z = liftAtWorld(worldDeg);
      const rollerCenter = project(X, Y, z);
      // 随动器宽度（沿凸轮轴向）示意
      const wHalf = Math.max((p.rollerWidth || 20) / 2, 1);
      const rA = project(X, Y, z - wHalf), rB = project(X, Y, z + wHalf);
      ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 5; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(rA.x, rA.y); ctx.lineTo(rB.x, rB.y); ctx.stroke();
      ctx.fillStyle = '#ff922b'; ctx.beginPath();
      ctx.arc(rollerCenter.x, rollerCenter.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(rollerCenter.x, rollerCenter.y, 6, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = '#868e96'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      if (p.followerType === 'swing') {
        // 摆动从动件：固定支点 + 摆臂，只有摆角随升程变化
        const pivotR = Rb + (p.swingLen || 100);
        const pivot = project(pivotR * Math.cos(th), pivotR * Math.sin(th), p.initialHt);
        ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y); ctx.lineTo(rollerCenter.x, rollerCenter.y); ctx.stroke();
        ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.arc(pivot.x, pivot.y, 4, 0, Math.PI * 2); ctx.fill();
      } else {
        // 直动从动件：随动器杆沿轴向 +Z 伸出，不参与凸轮旋转
        const rodEnd = project(X, Y, z + rodLen);
        ctx.beginPath(); ctx.moveTo(rollerCenter.x, rollerCenter.y); ctx.lineTo(rodEnd.x, rodEnd.y); ctx.stroke();
        ctx.fillStyle = '#5c6370'; ctx.beginPath(); ctx.arc(rodEnd.x, rodEnd.y, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 显示相位
    ctx.fillStyle = this.cssVar('--text'); ctx.font = '14px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`φ = ${this.state.anim.phase.toFixed(1)}°`, 14, H - 14);
  },

  /* -------- 动画 -------- */
  animLoop(t) {
    const a = this.state.anim;
    if (a.playing) {
      const dt = a.lastT ? (t - a.lastT) / 1000 : 0;
      a.lastT = t;
      const speed = 120; // deg/s
      a.phase += speed * dt * a.dir;
      if (a.phase > 360) a.phase -= 360;
      if (a.phase < 0) a.phase += 360;
      if (this.state.currentViz === 'line3d') this.draw3D();
      document.getElementById('animSlider').value = Math.round(a.phase * 10);
      document.getElementById('animPhase').textContent = `φ = ${a.phase.toFixed(1)}°`;
    }
    requestAnimationFrame((tt) => this.animLoop(tt));
  },

  animControl(cmd) {
    const a = this.state.anim;
    a.lastT = 0;
    if (cmd === 'forward') { a.playing = true; a.dir = 1; }
    else if (cmd === 'backward') { a.playing = true; a.dir = -1; }
    else if (cmd === 'stop') { a.playing = false; }
    else if (cmd === 'stepFwd') { a.phase = (a.phase + 3) % 360; }
    else if (cmd === 'stepRev') { a.phase = (a.phase - 3 + 360) % 360; }
    document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
    const map = { forward: 3, backward: 4, stop: 5 };
    const idx = map[cmd];
    if (idx !== undefined) document.querySelectorAll('.anim-btn')[idx].classList.add('active');
    if (!a.playing) this.draw3D();
  },

  animSlider(v) {
    this.state.anim.phase = v / 10;
    this.state.anim.playing = false;
    this.draw3D();
    document.getElementById('animPhase').textContent = `φ = ${this.state.anim.phase.toFixed(1)}°`;
  },

  /* -------- 参数示意 -------- */
  drawIndic() {
    const cv = document.getElementById('cvIndic');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const p = this.state.params;
    if (!p) return;

    const textC = this.cssVar('--text');
    const dimC = this.cssVar('--text-dim');
    const mutedC = this.cssVar('--text-muted');
    const accent = this.cssVar('--primary');

    const cx = W * 0.36, cy = H * 0.55;
    const scale = Math.min(
      (W * 0.42) / Math.max(p.camWidth, 10),
      (H - 150) / Math.max(p.baseDia, 10),
      (H - 170) / Math.max(p.initialHt + 40, 20)
    );
    const w = p.camWidth * scale;
    const h = p.baseDia * scale;
    const r = Math.max(5, (p.rollerDia / 2) * scale);

    // 凸轮柱体（正视矩形 + 椭圆端面示意）
    ctx.fillStyle = 'rgba(184,192,255,0.28)';
    ctx.strokeStyle = '#6b7bff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(cx - w / 2, cy - h / 2, w, h); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy - h / 2, w / 2, h * 0.10, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy + h / 2, w / 2, h * 0.10, 0, 0, Math.PI * 2); ctx.stroke();

    // 尺寸标注工具
    const tick = (x, y) => { ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4); ctx.stroke(); };
    const dimV = (x, y1, y2, label) => {
      ctx.strokeStyle = accent; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
      tick(x, y1); tick(x, y2);
      ctx.save(); ctx.translate(x - 8, (y1 + y2) / 2); ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = dimC; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(label, 0, 0); ctx.restore(); ctx.textBaseline = 'alphabetic';
    };
    const dimH = (y, x1, x2, label) => {
      ctx.strokeStyle = accent; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      tick(x1, y); tick(x2, y);
      ctx.fillStyle = dimC; ctx.textAlign = 'center'; ctx.fillText(label, (x1 + x2) / 2, y + 16);
    };

    // 基圆直径（竖向）
    dimV(cx - w / 2 - 28, cy - h / 2, cy + h / 2, `${this.t('baseDia')} ${p.baseDia} mm`);
    // 凸轮宽度（横向）
    dimH(cy + h / 2 + 34, cx - w / 2, cx + w / 2, `${this.t('camWidth')} ${p.camWidth} mm`);

    // 随动器（宽度沿凸轮轴向，高度为直径）
    const rx = cx + w / 2 + 90;
    const rollerCy = cy;
    const wR = Math.max(8, p.rollerWidth * scale);
    ctx.fillStyle = '#ff922b'; ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(rx - wR / 2, rollerCy - r, wR, 2 * r); ctx.fill(); ctx.stroke();
    // 杆（朝上，长度固定示意）
    const rodTop = rollerCy - Math.max(70, 2.2 * r);
    ctx.strokeStyle = '#868e96'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx, rollerCy); ctx.lineTo(rx, rodTop); ctx.stroke();
    ctx.lineCap = 'butt';
    // 宽度（横向）
    dimH(rollerCy + r + 16, rx - wR / 2, rx + wR / 2, `${this.t('rollerWidth')} ${p.rollerWidth} mm`);
    // 直径（竖向）
    dimV(rx + wR / 2 + 26, rollerCy - r, rollerCy + r, `${this.t('rollerDia')} ${p.rollerDia} mm`);

    // 初始高度（凸轮内向上）
    const liftY = cy + h / 2 - p.initialHt * scale;
    ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx - w / 2, liftY); ctx.lineTo(cx + w / 2, liftY); ctx.stroke();
    ctx.setLineDash([]);
    dimV(cx + w / 2 + 16, liftY, cy + h / 2, `${this.t('initialHt')} ${p.initialHt} mm`);

    // 标题
    ctx.fillStyle = mutedC; ctx.textAlign = 'left'; ctx.font = '12px sans-serif';
    ctx.fillText(`φ = 360°`, 14, H - 14);
  },

  /* -------- 数据存取 -------- */
  saveJSON() {
    const payload = {
      format: 'cylindrical-cam-designer-v1',
      params: this.state.params,
      segments: this.state.segments,
      savedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cam-design-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  onLoadFile(input) {
    const f = input.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.segments) this.state.segments = data.segments;
        if (data.params) {
          const p = data.params;
          const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
          set('p_baseDia', p.baseDia); set('p_camWidth', p.camWidth);
          set('p_rollerDia', p.rollerDia); set('p_rollerWidth', p.rollerWidth);
          set('p_initialHt', p.initialHt); set('p_resolution', p.resolution);
          set('p_camSpeed', p.camSpeed != null ? p.camSpeed : 60);
          set('p_followerType', p.followerType); set('p_handedness', p.handedness);
          set('p_offset', p.offset || 0); set('p_motionDir', p.motionDir);
          document.getElementById('p_offset').dataset.userSet = '1';
          set('p_tiltAngle', p.tiltAngle || 0);
          set('p_loadMass', p.loadMass); set('p_springForce', p.springForce);
          set('p_efficiency', Math.round(p.efficiency * 100));
          set('p_pressAngleLimit', p.pressAngleLimit);
          set('p_rollerCount', p.rollerCount);
          if (p.rollerAngles) set('p_rollerAngles', p.rollerAngles.join(', '));
        }
        this.renderSegTable();
        this.onFollowerTypeChange();
        this.compute();
      } catch (e) { alert(this.t('alertJsonFail') + e.message); }
    };
    reader.readAsText(f);
  },

  exportCSV() {
    const pts = this.state.points;
    if (!pts || pts.length === 0) { alert(this.t('needCompute')); return; }
    const headers = ['#', 'phi_deg', 's_mm', 'v_mm_per_deg', 'a_mm_per_deg2', 'j_mm_per_deg3', 'v_mm_per_s', 'a_mm_per_s2', 'j_mm_per_s3', 'alpha_deg', 'torque_Nm', 'force_N', 'force_axial_N', 'x_theory_mm', 'y_theory_mm', 'x_work_mm', 'y_work_mm', 'segIdx', 'segName'];
    const rows = pts.map((pt, i) => [
      i, pt.phi.toFixed(4), pt.s.toFixed(4), pt.v.toFixed(5), pt.a.toFixed(5), pt.j.toFixed(6),
      pt.v_s.toFixed(4), pt.a_s.toFixed(4), pt.j_s.toFixed(3),
      pt.alphaDeg.toFixed(3), pt.torqueNmm.toFixed(3), pt.forceN.toFixed(3), pt.forceAxial.toFixed(3),
      pt.x_theory.toFixed(4), pt.y_theory.toFixed(4), pt.x_work.toFixed(4), pt.y_work.toFixed(4),
      pt.segIdx, pt.segName
    ]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cam-points-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  },

  /* -------- STEP AP214 导出 -------- */
  exportSTEP() {
    const pts = this.state.points;
    const p = this.state.params;
    if (!pts || pts.length === 0) { alert(this.t('needCompute')); return; }

    /* ---- 生成"槽实体"扫掠网格（mm）----
       截面: 轴向宽 Wg = 随动器直径 + 间隙, 径向深 Hd = 随动器宽度 + 间隙
       扫掠路径: (R·cosφ, R·sinφ, z0 + s(φ))，沿整周闭合
       输出: AP214 实体 B-rep (MANIFOLD_SOLID_BREP → CLOSED_SHELL →
             ADVANCED_FACE → FACE_OUTER_BOUND → EDGE_LOOP → ORIENTED_EDGE →
             EDGE_CURVE(LINE) + VERTEX_POINT + CARTESIAN_POINT)
       每个四边面片三角化，保证面严格共面；每条棱恰好被 2 个面反向引用，
       构成闭合水密实体（导入 CAD 即为实体，不是曲面/曲线）
       用途: 在 CAD 中与凸轮毛坯做布尔减，得到沟槽 */
    const R = p.baseDia / 2;
    const clearW = 0.2, clearD = 1.0, overTop = 1.0;
    const halfW = (p.rollerDia + clearW) / 2;
    const depth = p.rollerWidth + clearD;
    const rIn = R - depth, rOut = R + overTop;
    const sMin = Math.min.apply(null, pts.map(q => q.s));
    const sMax = Math.max.apply(null, pts.map(q => q.s));
    const z0 = (p.camWidth - (sMax - sMin)) / 2 - sMin;
    const N = 360; // 每 1° 一段
    const sAt = (deg) => {
      const d = ((deg % 360) + 360) % 360;
      const i = Math.min(pts.length - 2, Math.floor(d / 360 * (pts.length - 1)));
      const a = pts[i], b = pts[i + 1] || a;
      const t = (d - a.phi) / ((b.phi - a.phi) || 1);
      return a.s + (b.s - a.s) * Math.max(0, Math.min(1, t));
    };
    // 顶点编号 gi(i,k) = i*4 + k，k: 0=外- 1=外+ 2=内+ 3=内-
    const V = [];    // [i][k] = [x,y,z]
    const vert = []; // 扁平顶点表
    for (let i = 0; i < N; i++) {
      const ph = i * 2 * Math.PI / N, z = z0 + sAt(i * 360 / N);
      const cx = Math.cos(ph), sy = Math.sin(ph);
      const row = [
        [rOut * cx, rOut * sy, z - halfW],
        [rOut * cx, rOut * sy, z + halfW],
        [rIn * cx, rIn * sy, z + halfW],
        [rIn * cx, rIn * sy, z - halfW]
      ];
      V.push(row);
      for (let k = 0; k < 4; k++) vert.push(row[k]);
    }
    const gi = (i, k) => i * 4 + k;

    const lines = [];
    const push = (s = '') => lines.push(s);
    let id = 0;
    const nid = () => ++id;

    push('ISO-10303-21;');
    push('HEADER;');
    push("FILE_DESCRIPTION(('Cylindrical cam groove swept solid'),'2;1');");
    push(`FILE_NAME('cam-groove-${new Date().toISOString().slice(0, 10)}.step','${new Date().toISOString()}',('TraeCam'),(''),'solid','','');`);
    push("FILE_SCHEMA(('AUTOMOTIVE_DESIGN'));");
    push('ENDSEC;');
    push('DATA;');

    const ctx = nid();
    const a1 = nid(), a2 = nid(), a3 = nid();
    const pr = nid(), pcf = nid(), pdf = nid(), pdc = nid(), pd = nid(), pds = nid(), sdr = nid();
    const rep = nid();
    push(`#${a1}=APPLICATION_CONTEXT('automotive design');`);
    push(`#${a2}=APPLICATION_PROTOCOL_DEFINITION('international standard','automotive_design',2000,#${a1});`);
    push(`#${a3}=PRODUCT_CONTEXT('',#${a1},'mechanical');`);
    push(`#${pr}=PRODUCT('CamGroove','Cam Groove','',(#${a3}));`);
    push(`#${pcf}=PRODUCT_DEFINITION_FORMATION('','',#${pr});`);
    push(`#${pdc}=PRODUCT_DEFINITION_CONTEXT('part definition',#${a1},'design');`);
    push(`#${pd}=PRODUCT_DEFINITION('design','',#${pcf},#${pdc});`);
    push(`#${pdf}=PRODUCT_DEFINITION_SHAPE('','',#${pd});`);
    push(`#${sdr}=SHAPE_DEFINITION_REPRESENTATION(#${pdf},#${rep});`);

    const u1 = nid(), u2 = nid(), u3 = nid(), unc = nid();
    push(`#${u1}=(LENGTH_UNIT() NAMED_UNIT(*) SI_UNIT(.MILLI.,.METRE.));`);
    push(`#${u2}=(NAMED_UNIT(*) PLANE_ANGLE_UNIT() SI_UNIT($,.RADIAN.));`);
    push(`#${u3}=(NAMED_UNIT(*) SOLID_ANGLE_UNIT() SI_UNIT($,.STERADIAN.));`);
    push(`#${unc}=UNCERTAINTY_MEASURE_WITH_UNIT(LENGTH_MEASURE(0.001),#${u1},'distance_accuracy_value','');`);
    push(`#${ctx}=(GEOMETRIC_REPRESENTATION_CONTEXT(3) GLOBAL_UNCERTAINTY_ASSIGNED_CONTEXT((#${unc})) GLOBAL_UNIT_ASSIGNED_CONTEXT((#${u1},#${u2},#${u3})) REPRESENTATION_CONTEXT('',''));`);

    // 顶点：CARTESIAN_POINT + VERTEX_POINT
    const cpId = [], vpId = [];
    for (let g = 0; g < vert.length; g++) {
      const v = vert[g];
      const cp = nid();
      push(`#${cp}=CARTESIAN_POINT('',(${v[0].toFixed(4)},${v[1].toFixed(4)},${v[2].toFixed(4)}));`);
      const vp = nid();
      push(`#${vp}=VERTEX_POINT('',#${cp});`);
      cpId.push(cp); vpId.push(vp);
    }

    // 棱：按"无向顶点对"去重，每条棱生成一次 EDGE_CURVE（低编号→高编号）
    const edgeCache = new Map();
    const getEdge = (a, b) => {
      const lo = a < b ? a : b, hi = a < b ? b : a;
      const key = lo + '_' + hi;
      let e = edgeCache.get(key);
      if (!e) {
        const P = vert[lo], Q = vert[hi];
        const dx = Q[0] - P[0], dy = Q[1] - P[1], dz = Q[2] - P[2];
        const len = Math.hypot(dx, dy, dz) || 1e-9;
        const dir = nid();
        push(`#${dir}=DIRECTION('',(${(dx / len).toFixed(9)},${(dy / len).toFixed(9)},${(dz / len).toFixed(9)}));`);
        const vec = nid();
        push(`#${vec}=VECTOR('',#${dir},${len.toFixed(6)});`);
        const line = nid();
        push(`#${line}=LINE('',#${cpId[lo]},#${vec});`);
        const ec = nid();
        push(`#${ec}=EDGE_CURVE('',#${vpId[lo]},#${vpId[hi]},#${line},.T.);`);
        e = { id: ec, from: lo };
        edgeCache.set(key, e);
      }
      return { id: e.id, same: a === e.from };
    };

    // 面：每个三角面 = EDGE_LOOP → FACE_OUTER_BOUND → ADVANCED_FACE(PLANE)
    const faces = [];
    const addTri = (ga, gb, gc) => {
      const A = vert[ga], B = vert[gb], C = vert[gc];
      let nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
      let ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
      let nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
      const nl = Math.hypot(nx, ny, nz);
      if (nl < 1e-12) return; // 退化三角（零面积）跳过
      nx /= nl; ny /= nl; nz /= nl;
      const mkOE = (u, w) => {
        const ed = getEdge(u, w);
        const oe = nid();
        push(`#${oe}=ORIENTED_EDGE('',*,*,#${ed.id},${ed.same ? '.T.' : '.F.'});`);
        return oe;
      };
      const oe1 = mkOE(ga, gb), oe2 = mkOE(gb, gc), oe3 = mkOE(gc, ga);
      const loop = nid();
      push(`#${loop}=EDGE_LOOP('',(#${oe1},#${oe2},#${oe3}));`);
      const bound = nid();
      push(`#${bound}=FACE_OUTER_BOUND('',#${loop},.T.);`);
      const ax = nid(), rf = nid();
      const rl = Math.hypot(B[0] - A[0], B[1] - A[1], B[2] - A[2]) || 1;
      push(`#${ax}=DIRECTION('',(${nx.toFixed(9)},${ny.toFixed(9)},${nz.toFixed(9)}));`);
      push(`#${rf}=DIRECTION('',(${((B[0] - A[0]) / rl).toFixed(9)},${((B[1] - A[1]) / rl).toFixed(9)},${((B[2] - A[2]) / rl).toFixed(9)}));`);
      const pl = nid();
      push(`#${pl}=AXIS2_PLACEMENT_3D('',#${cpId[ga]},#${ax},#${rf});`);
      const plane = nid();
      push(`#${plane}=PLANE('',#${pl});`);
      const face = nid();
      push(`#${face}=ADVANCED_FACE('',(#${bound}),#${plane},.T.);`);
      faces.push(face);
    };
    // 四边环带面片按 (A,B,C)+(A,C,D) 三角化，保证严格共面
    const addQuad = (a, b, c, d) => {
      addTri(gi(a[0], a[1]), gi(b[0], b[1]), gi(c[0], c[1]));
      addTri(gi(a[0], a[1]), gi(c[0], c[1]), gi(d[0], d[1]));
    };
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      addQuad([i, 0], [j, 0], [j, 1], [i, 1]); // 外顶面（径向朝外）
      addQuad([i, 2], [j, 2], [j, 3], [i, 3]); // 内底面
      addQuad([i, 1], [j, 1], [j, 2], [i, 2]); // 槽壁 +z
      addQuad([i, 3], [j, 3], [j, 0], [i, 0]); // 槽壁 -z
    }

    const shell = nid();
    push(`#${shell}=CLOSED_SHELL('',(${faces.map(f => '#' + f).join(',')}));`);
    const brep = nid();
    push(`#${brep}=MANIFOLD_SOLID_BREP('CamGroove',#${shell});`);
    push(`#${rep}=ADVANCED_BREP_SHAPE_REPRESENTATION('CamGroove',(#${brep}),#${ctx});`);

    push('ENDSEC;');
    push('END-ISO-10303-21;');

    const text = lines.join('\n');
    const blob = new Blob([text], { type: 'application/step' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cam-groove-${new Date().toISOString().slice(0, 10)}.step`;
    a.click();
    URL.revokeObjectURL(url);
  },

  /* -------- 刷新 -------- */
  refreshUI() {
    this.renderSegTable();
    this.onFollowerTypeChange();
    this.compute();
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
