<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>OKS机器人设计计算 | OKS Robot Design Calculator</title>
<style>
:root{
  --bg:#e9edf3; --panel:#ffffff; --panel2:#f5f7fa; --ink:#1b2430; --ink2:#5b6676; --ink3:#8b95a5;
  --line:#d3dae4; --line2:#e6ebf2; --acc:#14568f; --acc2:#e7f0f9; --acc3:#bfd6ea;
  --ok:#1c7a45; --okbg:#e9f6ee; --warn:#9a6b12; --warnbg:#fcf5e2; --bad:#b33326; --badbg:#fdecea;
  --top:#0e2337; --top2:#173a58;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:12px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:12px;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c2cbd8;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 14px;background:linear-gradient(180deg,var(--top2),var(--top));color:#dce7f2;
  border-bottom:1px solid #0a1a28;box-shadow:0 1px 6px rgba(9,20,32,.25)}
.tt{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.tt .logo{color:#5fa8e0;font-size:14px}
.tt .t1{font-size:13.5px;font-weight:600;letter-spacing:.3px}
.tt .t2{font-size:10px;color:#7e99b3;font-family:var(--mono)}
.scheme{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.name{width:190px;padding:4px 7px;background:#0a1c2c;border:1px solid #2a4b6a;color:#eaf2fa;border-radius:var(--r)}
.name:focus{outline:none;border-color:#5fa8e0}
.dirty{font-size:10px;padding:1px 6px;border-radius:9px;background:#7a4a05;color:#ffd98a;border:1px solid #a97516;white-space:nowrap}
.acts{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:auto}
.acts button{padding:4px 9px;background:#1b3d5c;border:1px solid #2f587c;color:#dbe8f5;border-radius:var(--r);white-space:nowrap}
.acts button:hover{background:#28577f;border-color:#4d7ea8}
.acts button:active{background:#0f2c45}
.acts .sel{padding:4px 5px;background:#0a1c2c;border:1px solid #2a4b6a;color:#dbe8f5;border-radius:var(--r);max-width:130px}
.acts .sep{width:1px;height:18px;background:#2a4b6a}

/* ---------- notice ---------- */
.notice{display:flex;gap:8px;align-items:flex-start;padding:6px 14px;background:#fff8e1;color:#7a5406;
  border-bottom:1px solid #f0dfa8;font-size:11.5px}
.notice b{font-weight:600}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:404px minmax(0,1fr);gap:10px;padding:10px;align-items:start}
@media (max-width:1279px){
  main{grid-template-columns:1fr}
  aside{position:static!important;max-height:none!important}
}
aside{position:sticky;top:48px;max-height:calc(100vh - 58px);overflow:auto;padding-right:2px}

/* ---------- param groups ---------- */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.grp>summary{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-weight:600;font-size:12px;list-style:none;cursor:pointer;user-select:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .no{font-family:var(--mono);color:var(--acc);font-size:11px}
.grp>summary .cnt{margin-left:auto;font-weight:400;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.grp>summary .car{color:var(--ink3);font-size:10px;transition:transform .15s}
.grp[open]>summary .car{transform:rotate(90deg)}
.grp .rows{padding:5px 8px 7px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 86px 42px;gap:5px;align-items:center;
  padding:2px 0;border-bottom:1px dashed #eef1f6}
.fld:last-child{border-bottom:none}
.fld label{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--ink2);overflow:hidden}
.fld label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .q{flex:0 0 auto;width:12px;height:12px;line-height:11px;text-align:center;font-size:9px;
  border-radius:50%;border:1px solid var(--acc3);color:var(--acc);background:#fff;cursor:help;font-family:var(--mono)}
.fld .q:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.fld input[type=number],.fld input[type=text]{width:100%;padding:3px 5px;text-align:right;font-family:var(--mono);
  font-size:11.5px;background:#fbfcfe;border:1px solid var(--line);border-radius:3px}
.fld input:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 2px var(--acc2)}
.fld input:disabled{background:#eef1f5;color:var(--ink3);cursor:not-allowed}
.fld input.bad{border-color:var(--bad);background:var(--badbg)}
.fld .u{font-size:10px;color:var(--ink3);font-family:var(--mono);text-align:left}
.fld select{grid-column:1/3;width:100%;padding:3px 4px;background:#fbfcfe;border:1px solid var(--line);border-radius:3px;font-size:11.5px}
.fld select:focus{outline:none;border-color:var(--acc)}
.sw{position:relative;display:inline-block;width:34px;height:18px;grid-column:2;justify-self:end}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#c3ccd8;border-radius:18px;transition:.15s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:before{transform:translateX(16px)}
.rowline{grid-column:1/4;display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--ink3);
  font-family:var(--mono);padding:1px 0 2px 2px}
.rowline b{color:var(--acc);font-weight:500}
.rowline.warnl b{color:var(--warn)}

/* ---------- result area ---------- */
#out{min-width:0}
.outbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px}
.outbar .lb{font-size:11px;color:var(--ink3)}
.outbar select{padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:#fbfcfe;font-size:11px}
.outbar .sp{margin-left:auto}
.pill{font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--ink2);background:#fbfcfe;font-family:var(--mono)}
.pill.ok{background:var(--okbg);border-color:#b9e0c8;color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:#eddb9f;color:var(--warn)}
.pill.bad{background:var(--badbg);border-color:#f2c2bc;color:var(--bad)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:var(--r);
  padding:6px 8px 7px;min-height:66px;position:relative}
.card.ok{border-left-color:var(--ok)}
.card.warn{border-left-color:var(--warn)}
.card.bad{border-left-color:var(--bad)}
.card .cl{font-size:10.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.card .cl em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:9.5px}
.card .cv{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.25;
  font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.card .cv small{font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:3px;letter-spacing:0}
.card .cs{font-size:10px;color:var(--ink3);font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cf{position:absolute;right:6px;top:5px;font-size:9px;padding:0 4px;border-radius:3px;
  background:var(--panel2);color:var(--ink3);border:1px solid var(--line2);font-family:var(--mono)}
.card.bad .cv{color:var(--bad)}
.card.warn .cv{color:var(--warn)}

/* ---------- cam four-state table ---------- */
.states{padding:8px 9px;overflow:auto}
.states table{width:100%;border-collapse:collapse;font-size:11px}
.states th{background:#eef2f7;color:var(--ink2);font-weight:600;text-align:left;padding:4px 7px;
  border-bottom:1px solid var(--line);font-size:10.5px;white-space:nowrap}
.states td{padding:4px 7px;border-bottom:1px solid #f0f3f7}
.states tr:last-child td{border-bottom:none}
.states tr:hover{background:#f9fbfe}
.states td.ang{font-family:var(--mono);color:var(--acc);font-weight:600;white-space:nowrap}
.states td.gap{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.states .chip{font-size:10px;padding:0 6px;border-radius:8px;font-family:var(--mono);white-space:nowrap}
.states .chip.on{background:var(--acc2);color:var(--acc);border:1px solid var(--acc3)}
.states .chip.off{background:var(--panel2);color:var(--ink3);border:1px solid var(--line2)}
.states .sw-note{margin-top:7px;font-size:10.5px;color:var(--ink3);line-height:1.65}

.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.blk>h3{margin:0;padding:6px 9px;background:var(--panel2);border-bottom:1px solid var(--line2);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.blk>h3 .car{color:var(--ink3);font-size:10px;transition:transform .15s}
.blk.closed>h3 .car{transform:rotate(-90deg)}
.blk.closed>.body{display:none}
.blk>h3 .tag{margin-left:auto;font-weight:400;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.blk .body{padding:0}
.blk .body.pad{padding:8px 9px}

table.dt{width:100%;border-collapse:collapse;font-size:11px}
table.dt th{position:sticky;top:0;background:#eef2f7;color:var(--ink2);font-weight:600;text-align:left;
  padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:10.5px}
table.dt td{padding:3px 7px;border-bottom:1px solid #f0f3f7;vertical-align:top}
table.dt tr.grprow td{background:#f7f9fc;color:var(--acc);font-weight:600;font-size:10.5px;
  font-family:var(--mono);letter-spacing:.4px;border-bottom:1px solid var(--line2)}
table.dt td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt td.f{font-family:var(--mono);color:var(--ink2);font-size:10.5px}
table.dt td.s{font-family:var(--mono);color:var(--ink3);font-size:10.5px;white-space:nowrap}
table.dt td.k{color:var(--ink2);white-space:nowrap}
table.dt td.k .side{color:var(--acc);font-family:var(--mono);font-size:9.5px;margin-right:3px}
table.dt tbody tr:hover{background:#f9fbfe}
table.dt td.res{font-weight:600}
.tblwrap{max-height:520px;overflow:auto}

/* ---------- checks ---------- */
.chk{display:grid;grid-template-columns:16px 118px minmax(0,1fr) auto;gap:7px;align-items:baseline;
  padding:4px 9px;border-bottom:1px solid #f0f3f7}
.chk:last-child{border-bottom:none}
.chk .dot{width:8px;height:8px;border-radius:50%;margin-top:4px}
.chk.ok .dot{background:var(--ok)}
.chk.warn .dot{background:var(--warn)}
.chk.bad .dot{background:var(--bad)}
.chk .nm{font-weight:600;font-size:11.5px}
.chk .rs{font-size:11px;color:var(--ink2)}
.chk .rs b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.chk .ad{font-size:10.5px;color:var(--warn);grid-column:3/5;margin-top:-2px}
.chk.bad .ad{color:var(--bad)}
.chk .st{font-size:10px;padding:0 6px;border-radius:8px;font-family:var(--mono);white-space:nowrap}
.chk.ok .st{background:var(--okbg);color:var(--ok)}
.chk.warn .st{background:var(--warnbg);color:var(--warn)}
.chk.bad .st{background:var(--badbg);color:var(--bad)}

/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px}
@media (max-width:1100px){.charts{grid-template-columns:1fr}}
.cb{position:relative;height:212px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;padding:4px}
.cb .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:11px;text-align:center;padding:14px;line-height:1.6}
.cb canvas{position:relative;z-index:1}
.charts .full{grid-column:1/-1}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(14,35,55,.18);z-index:60;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--top);color:#dce7f2}
.drawer .dh b{font-size:12.5px}
.drawer .dh button{margin-left:auto;background:#1b3d5c;border:1px solid #2f587c;color:#dbe8f5;padding:2px 8px;border-radius:3px}
.drawer .dl{flex:1;overflow:auto;padding:8px}
.sch{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;margin-bottom:6px;background:#fcfdff}
.sch.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc2)}
.sch .sn{font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.sch .sn .cur{font-size:9px;color:var(--acc);border:1px solid var(--acc3);border-radius:8px;padding:0 5px}
.sch .sm{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin:2px 0 4px}
.sch .sb{display:flex;gap:4px;flex-wrap:wrap}
.sch .sb button{padding:2px 7px;font-size:10.5px;background:#eef2f7;border:1px solid var(--line);border-radius:3px}
.sch .sb button:hover{background:var(--acc2);border-color:var(--acc3)}
.sch .sb button.del:hover{background:var(--badbg);border-color:#e5b3ad;color:var(--bad)}
.empty{text-align:center;color:var(--ink3);font-size:11.5px;padding:28px 10px;line-height:1.8}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:90;max-width:300px;background:#12283d;color:#dce7f2;font-size:11px;line-height:1.6;
  padding:6px 9px;border-radius:var(--r);box-shadow:0 4px 16px rgba(10,25,40,.3);pointer-events:none}
.tip b{color:#8fc4ea;font-family:var(--mono);font-weight:500}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;background:#12283d;color:#e8f1f9;
  padding:7px 15px;border-radius:16px;font-size:11.5px;box-shadow:0 6px 20px rgba(10,25,40,.35);opacity:0;transition:opacity .18s}
.toast.on{opacity:1}
#printRoot{display:none}
.drawer[hidden],.cb .fb[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- print: A4 计算书 ---------- */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .topbar,.notice,aside,#out,.drawer,.tip,.toast,.outbar{display:none!important}
  main{display:block;padding:0}
  #printRoot{display:block;color:#111;font-size:9pt;line-height:1.45}
  #printRoot h2{font-size:10.5pt;margin:10px 0 4px;padding-bottom:2px;border-bottom:1px solid #999;break-after:avoid}
  .pr-hd{border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
  .pr-hd .pr-t{font-size:15pt;font-weight:700}
  .pr-hd .pr-m{font-size:9pt;color:#333;margin-top:2px}
  .pr-tbl{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
  .pr-tbl th,.pr-tbl td{border:1px solid #bbb;padding:2px 4px;vertical-align:top;word-break:break-word}
  .pr-tbl th{background:#eee;text-align:left;font-weight:600}
  .pr-tbl tr{break-inside:avoid}
  .pr-tbl .pn{width:19%;color:#222}
  .pr-tbl .pv{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
  .pr-tbl .pu{width:9%;color:#666}
  .pr-param td.pu{width:7%}
  .pr-chk td{font-size:8pt}
  .pr-chk td.ps{width:52px;font-weight:700;text-align:center}
  .pr-chk .st-pass .ps{color:#1c7a45}
  .pr-chk .st-warn .ps{color:#9a6b12}
  .pr-chk .st-fail .ps{color:#b33326}
  .pr-chk i{color:#666;font-style:normal;font-size:7.5pt}
  .pr-dt td,.pr-dt th{font-size:7.2pt}
  .pr-charts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
  .pr-charts img{width:100%;border:1px solid #ddd}
  .pr-charts img:first-child{grid-column:1/-1}
  .pr-foot{margin-top:10px;border-top:1px solid #999;padding-top:5px;font-size:7.5pt;color:#444}
}
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="tt"><span class="logo">▣</span><span class="t1" data-i18n="app.title">OKS机器人设计计算</span><span class="t2">v2.0</span></div>
  <div class="scheme">
    <input id="schemeName" class="name" value="未命名方案" maxlength="40" spellcheck="false">
    <span id="dirty" class="dirty" hidden data-i18n="app.dirty">未保存</span>
  </div>
  <div class="acts">
    <select id="exampleSel" class="sel" title="内置示例"></select>
    <button id="btnExample" data-i18n="btn.example">载入示例</button>
    <span class="sep"></span>
    <button id="btnSave" data-i18n="btn.save">保存</button>
    <button id="btnSaveAs" data-i18n="btn.saveas">另存为</button>
    <button id="btnDrawer" data-i18n="btn.schemes">方案管理</button>
    <span class="sep"></span>
    <button id="btnImport" data-i18n="btn.import">导入</button>
    <button id="btnExport" data-i18n="btn.export">导出 JSON</button>
    <button id="btnCsv" data-i18n="btn.csv">导出 CSV</button>
    <button id="btnPrint" data-i18n="btn.print">打印 / PDF</button>
    <span class="sep"></span>
    <button id="btnReset" data-i18n="btn.reset">重置</button>
    <select id="langSel" class="sel"><option value="0">中文</option><option value="1">English</option><option value="2">日本語</option></select>
  </div>
</header>

<div class="notice no-print">
  <b>⚠</b>
  <span data-i18n="app.notice">本工具为工程初算辅助，最终选型须由工程师结合电机/减速机/轮子样本与实际工况实测复核；结果不替代强度校核、型式试验与安全评估。</span>
</div>

<main>
  <aside id="params" class="no-print" aria-label="parameters"></aside>
  <section id="out">
    <div class="outbar no-print">
      <span class="lb" data-i18n="out.unit">单位</span>
      <select id="uPow"><option value="auto">功率 自动</option><option value="kw">kW</option><option value="w">W</option></select>
      <select id="uForce"><option value="auto">力 自动</option><option value="n">N</option><option value="kn">kN</option></select>
      <span class="sp"></span>
      <span id="statusSum" class="pill">—</span>
      <span id="calcTime" class="lb"></span>
    </div>
    <div id="cards" class="cards"></div>
    <section class="blk" id="blkStates">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="sw.title">四状态切换表</span><span class="tag" id="stateTag"></span></h3>
      <div class="body"><div class="states" id="states"></div></div>
    </section>
    <section class="blk" id="blkDetail">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="out.detail">计算明细表</span><span class="tag" id="detailTag"></span></h3>
      <div class="body"><div class="tblwrap"><table class="dt" id="detailTbl"></table></div></div>
    </section>
    <section class="blk" id="blkChecks">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="out.checks">校核清单</span><span class="tag" id="checkTag"></span></h3>
      <div class="body" id="checks"></div>
    </section>
    <section class="blk" id="blkCharts">
      <h3 data-act="toggle"><span class="car">▾</span><span data-i18n="out.charts">曲线图表</span><span class="tag" id="chartTag"></span></h3>
      <div class="body">
        <div class="charts">

/* ===== [CALC:START] ===== */
/**
 * 纯函数计算引擎。输入 params 对象，输出 results 对象，不触碰 DOM。
 *
 * OKS 产品口径（与需求书一致）：
 *   额定载重 ≤ 50 kg，整车自重 < 50 kg；潜伏式顶升、无货叉；共 8 轮（X 4 + Y 4）；
 *   每角 1 个 X 轮 + 1 个 Y 轮 + 1 个圆柱凸轮 = 1 个凸轮组（共 4 组），
 *   一个凸轮同时完成顶升与换向，产生「未举升 X / 未举升 Y / 举升 X / 举升 Y」四状态。
 *
 * 公式来源：
 *   行走：F_f=M·g·f·cosα、F_g=M·g·sinα、F_a=M·a、ΣF=Σ、P_v=(F_f+F_g)·v/η、P_pk=ΣF·v/η
 *   扭矩：T_w=ΣF·D/2000、T_m=T_w/(i·η)
 *   轮压：N=M·g·K_d/4；赫兹线接触 A=2a_h·b，a_h=√(4NR/(πbE*))；p_max=4p_avg/π
 *   塑料货架：p_limit=min(轮材 p_allow, p_shelf)；单柱载荷 F_post=M·g·K_d/4，σ_post=F_post/post_b²
 *   凸轮组：F_lift=m_lift·g·K_imp、F_cam=F_lift/4、v=h/t_lift、P=F·v/η_cam、
 *           ω=2πn_cam/60、T_cam=F_cam·v/(ω·η_cam)、α=atan((h/(φ·π/180))/r_base)
 *   电池：E_c=P_v·t_travel+n·P_lift·t_lift、Q_req=E_day/(U·DOD·η_b)
 *   稳定：a_crit=g·(bx或by/2)/H_cg、K_st=a_crit/a、s_b=v²/(2a_b)
 *   结构：q=M·g·K_d/(n_b·L)、M_max=qL²/8、σ=M_max/W_x、δ=5qL⁴/(384EI)
 */
const Calc = (function(){
  const G = CONFIG.g;
  const PI = Math.PI;
  const NPD = CONFIG.wheelsPerDir;   // 每向轮数 4
  const NCG = CONFIG.camGroups;      // 凸轮组数 4
  const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
  const nearest = (arr,x)=>arr.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,arr[0]);
  const f1 = x=>(isFinite(x)?x:0).toFixed(1);
  const f2 = x=>(isFinite(x)?x:0).toFixed(2);
  const f3 = x=>(isFinite(x)?x:0).toFixed(3);
  const f4 = x=>(isFinite(x)?x:0).toFixed(4);

  /** 读取并夹紧参数；非法时回落默认值，保证引擎不会输出 NaN。 */
  function rp(p,k){
    const f = FIELD_MAP[k];
    if(!f) return 0;
    let v = p[k];
    if(v===null||v===undefined||v==='') v = f.def;
    if(f.type==='bool') return v===true||v==='true';
    if(f.type==='sel') return v;
    const n = Number(v);
    v = isFinite(n)?n:Number(f.def);
    return clamp(v,f.min,f.max);
  }

  /** 梯形/三角形速度曲线。返回加速段结束 t1、匀速段结束 t2、总时长 t3、峰值速度 vp。 */
  function profile(v,a,ab,s){
    if(!(s>0)||!(v>0)||!(a>0)||!(ab>0)) return {t1:0,t2:0,t3:0,vp:0,tri:true};
    const dA = v*v/(2*a), dD = v*v/(2*ab);
    if(dA+dD<=s){
      const t1 = v/a, tc = (s-dA-dD)/v;
      return {t1, t2:t1+tc, t3:t1+tc+v/ab, vp:v, tri:false};
    }
    const vp = Math.sqrt(2*s/(1/a+1/ab));
    const t1 = vp/a;
    return {t1, t2:t1, t3:t1+vp/ab, vp, tri:true};
  }

  /** 按曲线积分单程能耗（Wh），用于 energy_basis = profile 的口径。 */
  function profileEnergy(Fconst,M,a,ab,v,s,eta){
    const pr = profile(v,a,ab,s), N = 48, dt = pr.t3/N;
    let E = 0;
    for(let i=0;i<N;i++){
      const t = (i+0.5)*dt;
      let acc, sp;
      if(t<pr.t1){ acc = a;  sp = a*t; }
      else if(t<pr.t2){ acc = 0; sp = v; }
      else { acc = -ab; sp = Math.max(0, v-ab*(t-pr.t2)); }
      const F = Math.max(0, Fconst + M*acc);
      E += F*sp/eta*dt;
    }
    return E/3600; // Wh
  }

  function run(p){
    const p2 = p || {};
    const R = { meta:{ valid:true }, checks:[], cards:[], detail:[], chart:{}, states:[] };

    /* ---------- 派生量 ---------- */
    const mLoad = rp(p2,'m_load'), mPallet = rp(p2,'m_pallet'), mSelf = rp(p2,'m_self');
    const M = mLoad + mPallet + mSelf;
    const hCg = rp(p2,'h_cg'), hCgSelf = rp(p2,'h_cg_self');
    const HcgAct = ((mLoad+mPallet)*hCg + mSelf*hCgSelf)/M;
    const D = rp(p2,'D'), bW = rp(p2,'b'), bx = rp(p2,'bx'), by = rp(p2,'by'), dh = rp(p2,'dh');
    const L = rp(p2,'L'), W = rp(p2,'W'), H = rp(p2,'H');
    const Hdeck = H;                       // 潜伏式顶升、无货叉：车体顶面即承载面
    const matKey = rp(p2,'wheel_mat'); const mat = CONFIG.materials[matKey] || CONFIG.materials.pu;
    const mu = rp(p2,'mu'), Kd = rp(p2,'K_d');
    const liftMode = rp(p2,'lift_mode');
    const mLift = liftMode==='auto' ? (mLoad+mPallet) : rp(p2,'m_lift');
    const sCycle = rp(p2,'s_cycle');

    /* ---------- 行走（X / Y 独立） ---------- */
    function travel(side){
      const vRaw = rp(p2,side+'_v'), a = rp(p2,side+'_a'), ab = rp(p2,side+'_ab');
      const al = rp(p2,side+'_alpha')*PI/180;
      const fRes = rp(p2,side+'_f'), eta = rp(p2,side+'_eta');
      const nm = rp(p2,side+'_nm'), k = rp(p2,side+'_k'), Ks = rp(p2,side+'_ks');
      const iauto = rp(p2,side+'_iauto')===true;
      const iIn = rp(p2,side+'_i');
      const vEff = iauto ? vRaw : (PI*(D/1000)*nm/(60*iIn));
      const nw = 60*vEff/(PI*D/1000);
      const i = iauto ? nm/nw : iIn;
      const iStd = nearest(CONFIG.ratios,i);
      const Ff = M*G*fRes*Math.cos(al);
      const Fg = M*G*Math.sin(al);
      const Fa = M*a;
      const SF = Ff+Fg+Fa;
      const Pv = (Ff+Fg)*vEff/eta;
      const Ppk = SF*vEff/eta;
      const Pm = Ppk*Ks;
      const PmOne = Pm/k;
      const Tw = SF*(D/2000);
      const Tm = Tw/(i*eta);
      const Tcruise = (Ff+Fg)*(D/2000)/(i*eta);
      const Fadh = mu*M*G*(k/4);
      const FadhRef = mu*M*G*k/NPD;
      const sb = vEff*vEff/(2*ab);
      const Fb = M*ab;
      const Tb = Fb*(D/2000)/(i*eta);
      return {side, vRaw, vEff, a, ab, al, fRes, eta, nm, k, Ks, iauto, iIn, i, iStd, nw,
              Ff, Fg, Fa, SF, Pv, Ppk, Pm, PmOne, Tw, Tm, Tcruise, Fadh, FadhRef, sb, Fb, Tb,
              prof: profile(vEff,a,ab,sCycle/2)};
    }
    const TX = travel('x'), TY = travel('y');
    R.travel = { x:TX, y:TY, vEff:TX.vEff };
    R.load = { M, HcgAct, mLift, Hdeck };

    /* ---------- 轮压、支柱与塑料搁板 ---------- */
    const N = M*G*Kd/NPD;                  // 每向 4 轮承载
    const Estr = mat.e/(1-mat.nu*mat.nu);
    const aH = Math.sqrt(4*N*(D/2000)/(PI*(bW/1000)*Estr));
    const Acont = 2*aH*(bW/1000);
    const pAvg = N/Acont/1e6;
    const pMax = 4*pAvg/PI;
    const Nmax = N*(1+2*rp(p2,'e_off')/by);
    const pAllow = rp(p2,'p_allow');
    const pShelf = rp(p2,'p_shelf');
    const pLimit = Math.min(pAllow,pShelf);     // 塑料搁板常常是薄弱环节
    const postB = rp(p2,'post_b'), postLoad = rp(p2,'post_load');
    const Fpost = M*G*Kd/NCG;                    // 每库位 4 根支柱分摊
    const Apost = postB*postB;
    const sigPost = Fpost/Apost;
    const eccFactor = Nmax/N;
    R.wheel = { N, Estr, aH, Acont, pAvg, pMax, Nmax, pAllow, pShelf, pLimit,
                mat, eccFactor, Fpost, Apost, sigPost, postLoad };

    /* ---------- 凸轮组：顶升 + 换向 合并 ---------- */
    const hLift = rp(p2,'h_lift'), tLift = rp(p2,'t_lift'), kImp = rp(p2,'k_imp');
    const clrLift = rp(p2,'clr_lift'), nCam = rp(p2,'n_cam'), phi = rp(p2,'phi_lift');
    const rBase = rp(p2,'r_base'), alphaAllow = rp(p2,'alpha_allow'), etaCam = rp(p2,'eta_cam');
    const tRated = rp(p2,'t_rated'), tDelay = rp(p2,'t_delay'), clrWheel = rp(p2,'clr_wheel');
    const Fl = mLift*G*kImp;                 // 顶升力
    const Fcam = Fl/NCG;                     // 每组凸轮顶升力
    const vLift = (hLift/1000)/tLift;        // 顶升线速度 m/s
    const Pl = Fl*vLift/etaCam;              // 顶升功率
    const wCam = 2*PI*nCam/60;               // 凸轮角速度
    const Tcam = Fcam*vLift/(wCam*etaCam);   // 凸轮输出转矩（功率法）
    const alp = Math.atan((hLift/(phi*PI/180))/rBase)*180/PI;  // 压力角
    const tIndex = (phi/360)/nCam*60;        // 分度（换向）时间
    const tState = Math.max(tLift,tIndex)+tDelay;
    const rate = 3600/tState;
    R.lift = { mLift, F:Fl, Fcam, v:vLift, P:Pl, w:wCam, Tcam, alpha:alp, alphaAllow,
               tRated, hLift, tLift, etaCam, nCam, phi, rBase, kImp };
    R.shuttle = { gapWheel:dh, clrWheel, tIndex, tState, rate, tDelay };
    R.states = [
      { ang:0,   lift:false, dir:'x' },
      { ang:90,  lift:true,  dir:'x' },
      { ang:180, lift:false, dir:'y' },
      { ang:270, lift:true,  dir:'y' }
    ];

    /* ---------- 电池与续航 ---------- */
    const U = rp(p2,'U'), Q = rp(p2,'Q'), dod = rp(p2,'dod'), etaBat = rp(p2,'eta_bat');
    const nLiftCycle = rp(p2,'n_lift_cycle'), nDay = rp(p2,'n_day'), tDay = rp(p2,'t_day');
    const etaCh = rp(p2,'eta_ch'), iCh = rp(p2,'i_ch');
    const eBasis = rp(p2,'energy_basis');
    const tTravel = sCycle/TX.vEff;
    let Etravel;
    if(eBasis==='profile'){
      Etravel = profileEnergy(TX.Ff+TX.Fg, M, TX.a, TX.ab, TX.vEff, sCycle, TX.eta);
    }else{
      Etravel = TX.Pv*tTravel/3600;
    }
    const Elift = nLiftCycle*Pl*tLift/3600;
    const Ec = Etravel + Elift;
    const Eday = Ec*nDay/1000;
    const Qreq = Eday*1000/(U*dod*etaBat);
    const Euse = U*Q*dod*etaBat;
    const Nok = Ec>0 ? Euse/Ec : 0;
    const tCycle = tTravel + nLiftCycle*tLift;
    const hours = Nok*tCycle/3600;
    const nChg = Math.max(1, Math.ceil(Eday*1000/(Euse*etaCh)));
    const tChg = Q*dod/iCh;
    const needCharge = hours < tDay;
    R.batt = { Ec, Eday, Qreq, Euse, Nok, hours, nChg, tChg, needCharge, tTravel, tCycle, Elift, Etravel };

    /* ---------- 稳定与制动 ---------- */
    const aCritX = G*((bx/1000)/2)/(HcgAct/1000);
    const aCritY = G*((by/1000)/2)/(HcgAct/1000);
    const KstX = aCritX/TX.a, KstY = aCritY/TY.a;
    const Kst = Math.min(KstX,KstY);
    R.stab = { HcgAct, aCritX, aCritY, KstX, KstY, Kst, sb:TX.sb, sbmm:TX.sb*1000, Fb:TX.Fb, Tb:TX.Tb };

    /* ---------- 结构与尺寸链 ---------- */
    const nBeam = rp(p2,'n_beam'), bMat = rp(p2,'beam_mat');
    const bH = rp(p2,'beam_h'), bB = rp(p2,'beam_b'), bT = rp(p2,'beam_t');
    const bm = CONFIG.beamMats[bMat] || CONFIG.beamMats['6061'];
    const q = M*G*Kd/(nBeam*L);
    const Mmax = q*L*L/8;
    const bIn = Math.max(bB-2*bT,1), hIn = Math.max(bH-2*bT,1);
    const Ix = (bB*Math.pow(bH,3) - bIn*Math.pow(hIn,3))/12;
    const Wx = 2*Ix/bH;
    const sigma = Mmax/Wx;
    const delta = 5*q*Math.pow(L,4)/(384*bm.e*Ix);
    const dLim = L/rp(p2,'defl_div');
    const sigAllow = bm.sy/rp(p2,'ks_struct');
    const tPanel = rp(p2,'t_panel');
    const gapV = rp(p2,'h_layer') - (tPanel + rp(p2,'h_cargo') + hLift + dh);
    const gapSide = (rp(p2,'w_slot') - W)/2;
    const gapMin = Math.min(gapV, gapSide);
    R.struct = { q, Mmax, Ix, Wx, sigma, delta, dLim, sigAllow, bm, gapV, gapSide, gapMin, Hdeck, tPanel };

    /* ---------- 校核 ---------- */
    const WM = CONFIG.warnMargin;
    const chk = (id, ok, margin, v, l, u, extra)=>{
      let st = ok ? (margin < WM ? 'warn' : 'pass') : 'fail';
      const c = { id, status:st, v, l, u, pct: isFinite(margin)?margin*100:0 };
      if(extra) Object.assign(c, extra);
      R.checks.push(c);
      return st;
    };
    const pRatedX = rp(p2,'x_p_rated')*1000, pRatedY = rp(p2,'y_p_rated')*1000;
    const worse = TX.PmOne >= TY.PmOne ? 'x' : 'y';
    const TW = worse==='x'?TX:TY, pRatedW = worse==='x'?pRatedX:pRatedY;
    const cSide = rp(p2,'c_side');
    chk('motor', pRatedW>=TW.PmOne, (pRatedW-TW.PmOne)/Math.max(TW.PmOne,1e-9), TW.PmOne, pRatedW, 'W');
    chk('adhesion', TW.Fadh>=TW.SF, (TW.Fadh-TW.SF)/Math.max(TW.SF,1e-9), TW.Fadh, TW.SF, 'N', { ref:TW.FadhRef });
    chk('wheel', pMax<=pLimit, (pLimit-pMax)/Math.max(pLimit,1e-9), pMax, pLimit, 'MPa', { ref:pAvg });
    chk('post', Fpost<=postLoad && sigPost<=pShelf,
        Math.min((postLoad-Fpost)/postLoad,(pShelf-sigPost)/pShelf), Fpost, postLoad, 'N', { ref:sigPost });
    chk('defl', delta<=dLim, (dLim-delta)/Math.max(dLim,1e-9), delta, dLim, 'mm');
    chk('stab', Kst>=rp(p2,'kst_min'), (Kst-rp(p2,'kst_min'))/Math.max(rp(p2,'kst_min'),1e-9), Kst, rp(p2,'kst_min'), '');
    chk('liftstroke', hLift>=dh+clrLift, (hLift-(dh+clrLift))/Math.max(dh+clrLift,1e-9), hLift, dh+clrLift, 'mm');
    chk('camangle', alp<=alphaAllow, (alphaAllow-alp)/Math.max(alphaAllow,1e-9), alp, alphaAllow, '°');
    chk('camtorque', tRated>=Tcam, (tRated-Tcam)/Math.max(tRated,1e-9), Tcam, tRated, 'N·m');
    chk('battcap', Q>=Qreq, (Q-Qreq)/Math.max(Qreq,1e-9), Q, Qreq, 'Ah');
    chk('endurance', hours>=tDay, (hours-tDay)/Math.max(tDay,1e-9), hours, tDay, 'h', { n:nChg });
    chk('strength', sigma<=sigAllow, (sigAllow-sigma)/Math.max(sigAllow,1e-9), sigma, sigAllow, 'MPa');
    chk('brake', R.stab.sbmm<=rp(p2,'sb_limit'), (rp(p2,'sb_limit')-R.stab.sbmm)/Math.max(rp(p2,'sb_limit'),1e-9), R.stab.sbmm, rp(p2,'sb_limit'), 'mm');
    chk('swgap', dh>=clrWheel, (dh-clrWheel)/Math.max(clrWheel,1e-9), dh, clrWheel, 'mm');
    const gapSt = chk('gap', gapMin>=cSide, (gapMin-cSide)/Math.max(cSide,1e-9), gapMin, cSide, 'mm');
    if(gapSt==='pass' && gapMin-cSide<5) R.checks[R.checks.length-1].status = 'warn';
    chk('ecc', Nmax<=1.25*N, (1.25*N-Nmax)/(1.25*N), Nmax, N, 'N', { ref:eccFactor });

    const statusOf = id=>{ const c = R.checks.find(x=>x.id===id); return c?c.status:'pass'; };
    R.status = {
      pass: R.checks.filter(c=>c.status==='pass').length,
      warn: R.checks.filter(c=>c.status==='warn').length,
      fail: R.checks.filter(c=>c.status==='fail').length
    };

    /* ---------- 关键指标卡片 ---------- */
    R.cards = [
      { id:'pm', val:TW.PmOne, u:'W', sub:(worse==='x'?'X':'Y'), st:statusOf('motor') },
      { id:'tm', val:TW.Tm, u:'N·m', sub:'i='+f2(TW.i), st:statusOf('motor') },
      { id:'ratio', val:TW.i, u:'', sub:'i_std '+TW.iStd, st:'pass' },
      { id:'wheel', val:pMax, u:'MPa', sub:f1(N)+' N / '+f2(Nmax)+' N max', st:statusOf('wheel') },
      { id:'liftf', val:Fl, u:'N', sub:'m='+f1(mLift)+' kg', st:'pass' },
      { id:'camT', val:Tcam, u:'N·m', sub:'α='+f1(alp)+'°', st:statusOf('camtorque') },
      { id:'battcap', val:Qreq, u:'Ah', sub:'installed '+f1(Q)+' Ah', st:statusOf('battcap') },
      { id:'endurance', val:hours, u:'h', sub:'N_ok='+f1(Nok), st:statusOf('endurance') },
      { id:'kst', val:Kst, u:'', sub:'X '+f2(KstX)+' / Y '+f2(KstY), st:statusOf('stab') },
      { id:'brake', val:R.stab.sbmm, u:'mm', sub:'a_b='+f2(TX.ab)+' m/s²', st:statusOf('brake') },
      { id:'swrate', val:tState, u:'s', sub:Math.round(rate)+' /h', st:'pass' },
      { id:'mass', val:M, u:'kg', sub:'m_self '+f1(mSelf), st:'pass' }
    ];

    /* ---------- 明细表 ---------- */
    const DR = [];
    const row = (g,id,sym,formula,subst,val,u,side)=>DR.push({g,id,sym,formula,subst,val,u,side:side||''});
    const RX = TX, RY = TY;
    // 行走 X
    row('drvx','M','M','m_load+m_pallet+m_self', f1(mLoad)+'+'+f1(mPallet)+'+'+f1(mSelf), M, 'kg','X');
    row('drvx','Ff','F_f','M·g·f·cosα', f1(M)+'×9.81×'+f3(RX.fRes)+'×cos'+f1(rp(p2,'x_alpha')), RX.Ff, 'N','X');
    row('drvx','Fg','F_g','M·g·sinα', f1(M)+'×9.81×sin'+f1(rp(p2,'x_alpha')), RX.Fg, 'N','X');
    row('drvx','Fa','F_a','M·a', f1(M)+'×'+f2(RX.a), RX.Fa, 'N','X');
    row('drvx','SF','ΣF','F_f+F_g+F_a', f1(RX.Ff)+'+'+f1(RX.Fg)+'+'+f1(RX.Fa), RX.SF, 'N','X');
    row('drvx','Pv','P_v','(F_f+F_g)·v/η', '('+f1(RX.Ff+RX.Fg)+')×'+f2(RX.vEff)+'/'+f2(RX.eta), RX.Pv, 'W','X');
    row('drvx','Ppk','P_pk','ΣF·v/η', f1(RX.SF)+'×'+f2(RX.vEff)+'/'+f2(RX.eta), RX.Ppk, 'W','X');
    row('drvx','Pm','P_m','P_pk·K_s', f1(RX.Ppk)+'×'+f2(RX.Ks), RX.Pm, 'W','X');
    row('drvx','Pm1','P_m1','P_m/k', f1(RX.Pm)+'/'+RX.k, RX.PmOne, 'W','X');
    row('drvx','nw','n_w','60v/(πD/1000)', '60×'+f2(RX.vEff)+'/(π×'+f1(D)+'/1000)', RX.nw, 'rpm','X');
    row('drvx','i','i','n_m/n_w', f1(RX.nm)+'/'+f2(RX.nw), RX.i, '','X');
    row('drvx','istd','i_std','最近标准档', '取 '+RX.iStd, RX.iStd, '','X');
    row('drvx','Tw','T_w','ΣF·D/2000', f1(RX.SF)+'×'+f1(D)+'/2000', RX.Tw, 'N·m','X');
    row('drvx','Tm','T_m','T_w/(i·η)', f1(RX.Tw)+'/('+f2(RX.i)+'×'+f2(RX.eta)+')', RX.Tm, 'N·m','X');
    row('drvx','Fadh','F_μ','μ·M·g·(k/4)', f2(mu)+'×'+f1(M)+'×9.81×('+RX.k+'/4)', RX.Fadh, 'N','X');
    if(!RX.iauto) row('drvx','vreal',"v'",'πD·n_m/(60i)', 'π×'+f3(D/1000)+'×'+f1(RX.nm)+'/(60×'+f2(RX.i)+')', RX.vEff, 'm/s','X');
    // 行走 Y
    row('drvy','SF','ΣF','F_f+F_g+F_a', f1(RY.Ff)+'+'+f1(RY.Fg)+'+'+f1(RY.Fa), RY.SF, 'N','Y');
    row('drvy','Pv','P_v','(F_f+F_g)·v/η', '('+f1(RY.Ff+RY.Fg)+')×'+f2(RY.vEff)+'/'+f2(RY.eta), RY.Pv, 'W','Y');
    row('drvy','Ppk','P_pk','ΣF·v/η', f1(RY.SF)+'×'+f2(RY.vEff)+'/'+f2(RY.eta), RY.Ppk, 'W','Y');
    row('drvy','Pm1','P_m1','P_m/k', f1(RY.Pm)+'/'+RY.k, RY.PmOne, 'W','Y');
    row('drvy','nw','n_w','60v/(πD/1000)', '60×'+f2(RY.vEff)+'/(π×'+f1(D)+'/1000)', RY.nw, 'rpm','Y');
    row('drvy','i','i','n_m/n_w', f1(RY.nm)+'/'+f2(RY.nw), RY.i, '','Y');
    row('drvy','Tm','T_m','T_w/(i·η)', f1(RY.Tw)+'/('+f2(RY.i)+'×'+f2(RY.eta)+')', RY.Tm, 'N·m','Y');
    row('drvy','Fadh','F_μ','μ·M·g·(k/4)', f2(mu)+'×'+f1(M)+'×9.81×('+RY.k+'/4)', RY.Fadh, 'N','Y');
    // 轮压、支柱与塑料搁板
    row('wheel','Nw','N','M·g·K_d/4', f1(M)+'×9.81×'+f2(Kd)+'/'+NPD, N, 'N');
    row('wheel','Estr','E*','E/(1-ν²)', f1(mat.e/1e6)+'/(1-'+f2(mat.nu)+'²)', Estr/1e6, 'MPa');
    row('wheel','Ah','a_h','√(4NR/(πbE*))', '√(4×'+f1(N)+'×'+f4(D/2000)+'/(π×'+f3(bW/1000)+'×'+f1(Estr/1e6)+'e6))', aH*1000, 'mm');
    row('wheel','Ac','A','2a_h·b', '2×'+f2(aH*1000)+'×'+f1(bW), Acont*1e6, 'mm²');
    row('wheel','Pav','p_avg','N/A', f1(N)+'/'+f2(Acont*1e6), pAvg, 'MPa');
    row('wheel','Pmx','p_max','4p_avg/π', '4×'+f2(pAvg)+'/π', pMax, 'MPa');
    row('wheel','Nmx','N_max','N·(1+2e/by)', f1(N)+'×(1+2×'+f1(rp(p2,'e_off'))+'/'+f1(by)+')', Nmax, 'N');
    row('wheel','Plim','p_lim','min(p_allow,p_shelf)', 'min('+f1(pAllow)+','+f2(pShelf)+')', pLimit, 'MPa');
    row('wheel','Npost','N_post','M·g·K_d/4', f1(M)+'×9.81×'+f2(Kd)+'/4', Fpost, 'N');
    row('wheel','Spost','σ_post','N_post/post_b²', f1(Fpost)+'/'+f1(postB)+'²', sigPost, 'MPa');
    // 凸轮组（顶升 + 换向）
    row('lift','Fl','F_lift','m_lift·g·K_imp', f1(mLift)+'×9.81×'+f2(kImp), Fl, 'N');
    row('lift','Fcam','F_cam','F_lift/4', f1(Fl)+'/4', Fcam, 'N');
    row('lift','Vl','v_lift','h/t_lift', f1(hLift)+'/'+f1(tLift), vLift*1000, 'mm/s');
    row('lift','Pl','P_lift','F·v/η_cam', f1(Fl)+'×'+f3(vLift)+'/'+f2(etaCam), Pl, 'W');
    row('lift','Wcam','ω_cam','2π·n_cam/60', '2π×'+f1(nCam)+'/60', wCam, 'rad/s');
    row('lift','Tcam','T_cam','F_cam·v/(ω·η)', f1(Fcam)+'×'+f3(vLift)+'/('+f2(wCam)+'×'+f2(etaCam)+')', Tcam, 'N·m');
    row('lift','Alp','α','atan((h/φ)/r_base)', 'atan(('+f1(hLift)+'/'+f1(phi)+'°)/'+f1(rBase)+')', alp, '°');
    row('lift','Aal','α_allow','许用压力角', '取 '+f1(alphaAllow), alphaAllow, '°');
    row('lift','Tidx','t_index','(φ/360)/n_cam·60', '('+f1(phi)+'/360)/'+f1(nCam)+'×60', tIndex, 's');
    row('lift','Tst','t_state','max(t_lift,t_index)+t_delay', 'max('+f1(tLift)+','+f2(tIndex)+')+'+f1(tDelay), tState, 's');
    row('lift','Rate','N_sw','3600/t_state', '3600/'+f2(tState), rate, '次/h');
    // 电池
    row('batt','Ec','E_c','P_v·t + n·P_lift·t_lift', f1(RX.Pv)+'×'+f1(tTravel)+'/3600+'+nLiftCycle+'×'+f1(Pl)+'×'+f1(tLift)+'/3600', Ec, 'Wh');

    row('batt','Tt','t_travel','s_c/v', f1(sCycle)+'/'+f2(RX.vEff), tTravel, 's');
    row('batt','Thr','T_end','N_ok·t_cycle/3600', f1(Nok)+'×'+f1(tCycle)+'/3600', hours, 'h');
    row('batt','Nchg','N_chg','⌈E_day/(E_use·η_ch)⌉', '⌈'+f1(Eday*1000)+'/('+f1(Euse)+'×'+f2(etaCh)+')⌉', nChg, '次');
    row('batt','Tchg','t_chg','Q·DOD/I_ch', f1(Q)+'×'+f2(dod)+'/'+f1(iCh), tChg, 'h');
    // 稳定
    row('stab','Hcg','H_cg,act','Σ(m_i·h_i)/M', '(('+f1(mLoad)+'+'+f1(mPallet)+')×'+f1(hCg)+'+'+f1(mSelf)+'×'+f1(hCgSelf)+')/'+f1(M), HcgAct, 'mm');
    row('stab','Acx','a_crit,X','g·(bx/2)/H_cg', '9.81×('+f1(bx)+'/2)/'+f1(HcgAct), aCritX, 'm/s²');
    row('stab','Kx','K_st,X','a_crit/a', f2(aCritX)+'/'+f2(RX.a), KstX, '');
    row('stab','Acy','a_crit,Y','g·(by/2)/H_cg', '9.81×('+f1(by)+'/2)/'+f1(HcgAct), aCritY, 'm/s²');
    row('stab','Ky','K_st,Y','a_crit/a', f2(aCritY)+'/'+f2(RY.a), KstY, '');
    row('stab','Sb','s_b','v²/(2a_b)', f2(RX.vEff)+'²/(2×'+f2(RX.ab)+')', RX.sb, 'm');
    row('stab','Fb','F_b','M·a_b', f1(M)+'×'+f2(RX.ab), RX.Fb, 'N');
    row('stab','Tbk','T_b','F_b·D/2000/(i·η)', f1(RX.Fb)+'×'+f1(D)+'/2000/('+f2(RX.i)+'×'+f2(RX.eta)+')', RX.Tb, 'N·m');
    // 结构
    row('struct','Q','q','M·g·K_d/(n_b·L)', f1(M)+'×9.81×'+f2(Kd)+'/('+nBeam+'×'+f1(L)+')', q, 'N/mm');
    row('struct','Mm','M_max','qL²/8', f2(q)+'×'+f1(L)+'²/8', Mmax, 'N·mm');
    row('struct','Ix','I','(BH³-bh³)/12', '('+f1(bB)+'×'+f1(bH)+'³-'+f1(bIn)+'×'+f1(hIn)+'³)/12', Ix, 'mm⁴');

    row('struct','Dlt','δ','5qL⁴/(384EI)', '5×'+f2(q)+'×'+f1(L)+'⁴/(384×'+f1(bm.e)+'×'+f1(Ix)+')', delta, 'mm');
    row('struct','Dlim','δ_lim','L/'+rp(p2,'defl_div'), f1(L)+'/'+rp(p2,'defl_div'), dLim, 'mm');

    row('geo','Hdk','H_deck','H', f1(H), Hdeck, 'mm');
    row('geo','Gv','c_v','h_layer-(t_panel+h_cargo+h_lift+Δh)',
      f1(rp(p2,'h_layer'))+'-('+f1(tPanel)+'+'+f1(rp(p2,'h_cargo'))+'+'+f1(hLift)+'+'+f1(dh)+')', gapV, 'mm');
    row('geo','Gs','c_side','(w_slot-W)/2', '('+f1(rp(p2,'w_slot'))+'-'+f1(W)+')/2', gapSide, 'mm');
    row('geo','Gmin','c_min','min(c_v,c_side)', 'min('+f1(gapV)+','+f1(gapSide)+')', gapMin, 'mm');
    R.detail = DR;

    /* ---------- 图表数据 ---------- */
    const pxs = RX.prof, pys = RY.prof;
    const vt = [], pt = [], ptLift = [];
    let t = 0;
    vt.push([0,0]); pt.push([0,0]); ptLift.push([0,0]);
    const pushLeg = (T,pr)=>{
      const t0 = t;
      const seg = (tt,vv)=>{ vt.push([t0+tt,vv]); };
      seg(pr.t1, pr.vp); seg(pr.t2, pr.vp); seg(pr.t3, 0);
      // 功率：加速段峰值、匀速段匀速功率、减速段 0（回馈不计入）
      const accP = (T.Ff+T.Fg+M*T.a)*T.vEff/T.eta/1000;
      const cruP = (T.Ff+T.Fg)*T.vEff/T.eta/1000;
      pt.push([t0,0]); pt.push([t0+pr.t1, accP]); pt.push([t0+pr.t2, cruP]); pt.push([t0+pr.t3, 0]);
      ptLift.push([t0,0]); ptLift.push([t0+pr.t1,0]); ptLift.push([t0+pr.t2,0]); ptLift.push([t0+pr.t3,0]);
      t = t0 + pr.t3;
    };
    pushLeg(RX, pxs);
    // 顶升 1
    vt.push([t,0]); pt.push([t,Pl/1000]); ptLift.push([t,Pl/1000]);
    t += tLift;
    vt.push([t,0]); pt.push([t,0]); ptLift.push([t,0]);
    pushLeg(RY, pys);
    vt.push([t,0]); pt.push([t,Pl/1000]); ptLift.push([t,Pl/1000]);
    t += tLift;
    vt.push([t,0]); pt.push([t,0]); ptLift.push([t,0]);

    R.chart = {
      vt, pt, ptLift, tEnd:t,
      motor:{
        nmX:RX.nm, nmY:RY.nm,
        tAccX:RX.SF*(D/2000)/(RX.i*RX.eta), tAccY:RY.SF*(D/2000)/(RY.i*RY.eta),
        pRatedX:pRatedX/1000, pRatedY:pRatedY/1000,
        kX:RX.SF*(D/2000)/(RX.i*RX.eta)*RX.nm/9550/1000,
        kY:RY.SF*(D/2000)/(RY.i*RY.eta)*RY.nm/9550/1000
      }
    };
    R.meta.ok = R.status.fail===0;
    return R;
  }

  /**
   * 验收算例自检（OKS-50 默认口径）：
   * m_load=50 / m_pallet=5 / m_self=45 / x_v=1.0 / x_a=0.5 / D=60 / b=25
   * f=0.02 / α=0 / η=0.9 / n_m=3000 / k=2 / K_s=1.3 / 凸轮 4 组 / h=10 / t=1.2 / n_cam=30
   * 期望：M=100、ΣF≈69.6、P_pk≈77.4 W、P_m≈100.6 W、n_w≈318.3、i≈9.43、
   *       T_w≈2.09、T_m≈0.246、p_max≈2.22、F_lift≈647.5、T_cam≈0.537
   */
  function selfTest(){
    const p = {};
    FIELDS.forEach(f=>p[f.k]=f.def);
    Object.assign(p,{ m_load:50, m_pallet:5, m_self:45, x_v:1.0, x_a:0.5, D:60, b:25,
      x_f:0.02, x_alpha:0, x_eta:0.9, x_nm:3000, x_k:2, x_ks:1.3, x_iauto:true,
      wheel_mat:'pu', K_d:1.2, h_lift:10, t_lift:1.2, n_cam:30, phi_lift:90, r_base:25,
      eta_cam:0.8, k_imp:1.2, lift_mode:'auto' });
    const R = run(p), X = R.travel.x;
    const exp = { M:100, SF:69.62, Ppk:77.36, Pm:100.56, nw:318.31, i:9.425,
      Tw:2.089, Tm:0.246, pMax:2.221, Fl:647.46, Tcam:0.537 };
    const got = { M:R.load.M, SF:X.SF, Ppk:X.Ppk, Pm:X.Pm, nw:X.nw, i:X.i, Tw:X.Tw, Tm:X.Tm,
      pMax:R.wheel.pMax, Fl:R.lift.F, Tcam:R.lift.Tcam };
    return Object.keys(exp).map(k=>({
      k, exp:exp[k], got:got[k], dev:Math.abs(got[k]-exp[k])/exp[k]*100, ok:Math.abs(got[k]-exp[k])/exp[k]<0.02
    }));
  }

  return { run, selfTest, profile, nearest };
})();

function t(k, vars){
  const a = T[k];
  let s = a ? (a[S.lang] || a[0]) : k;
  if(vars) Object.keys(vars).forEach(v=>{ s = String(s).split('{'+v+'}').join(vars[v]); });
  return s;
}
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function grpNum(n,d){
  if(n===null||n===undefined||!isFinite(n)) return '—';
  const s = Math.abs(n).toFixed(d);
  const p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (n<0?'-':'')+p.join('.');
}
function smart(n){
  const a = Math.abs(n);
  if(!isFinite(n)) return '—';
  if(a>=10000) return grpNum(n,0);
  if(a>=1000) return grpNum(n,0);
  if(a>=100) return grpNum(n,1);
  if(a>=10) return grpNum(n,2);
  if(a>=1) return grpNum(n,3);
  if(a>=0.01) return grpNum(n,3);
  return grpNum(n,5);
}
function fmtPow(w){
  if(S.uPow==='w' || (S.uPow==='auto' && Math.abs(w)<1000)) return {v:smart(w),u:'W'};
  return {v:smart(w/1000),u:'kW'};
}
function fmtForce(n){
  if(S.uForce==='kn' || (S.uForce==='auto' && Math.abs(n)>=10000)) return {v:smart(n/1000),u:'kN'};
  return {v:smart(n),u:'N'};
}
function fmtVal(v,u){
  if(u==='W') return fmtPow(v);
  if(u==='N') return fmtForce(v);
  if(u==='MPa') return {v:grpNum(v, Math.abs(v)<10?2:1), u:'MPa'};
  return {v:smart(v), u:u||''};
}

function fieldRow(f){
  const wrap = document.createElement('div');
  wrap.className = 'fld' + (f.type==='sel'?' sel':'');
  wrap.dataset.k = f.k;

  const lab = document.createElement('label');
  const tipTxt = t('t.'+shortKey(f.k));
  lab.innerHTML = '<span>'+esc(t('f.'+shortKey(f.k)))+'</span>'+
    (tipTxt && tipTxt!=='t.'+shortKey(f.k) ? '<i class="q" data-tip="'+esc(tipTxt)+'">?</i>' : '');
  wrap.appendChild(lab);

  if(f.type==='sel'){
    const sel = document.createElement('select');
    f.opts.forEach(o=>{
      const op = document.createElement('option');
      op.value = String(o);
      op.textContent = t('o.'+f.k+'.'+o) === 'o.'+f.k+'.'+o ? String(o) : t('o.'+f.k+'.'+o);
      sel.appendChild(op);
    });
    sel.value = String(S.params[f.k]);
    sel.addEventListener('change', ()=>{
      S.params[f.k] = f.k==='n_beam' ? Number(sel.value) : sel.value;
      if(f.k==='wheel_mat') applyMaterial(sel.value);
      if(f.k==='lift_mode' || f.k==='x_iauto' || f.k==='y_iauto') syncMode(f.k);
      markDirty(); schedule();
    });
    wrap.appendChild(sel);
    const u = document.createElement('span'); u.className='u'; u.textContent = f.u||''; wrap.appendChild(u);
    return wrap;
  }

  if(f.type==='bool'){
    const sw = document.createElement('label'); sw.className='sw';
    const inp = document.createElement('input'); inp.type='checkbox'; inp.checked = S.params[f.k]===true;
    const i = document.createElement('i');
    sw.appendChild(inp); sw.appendChild(i);
    inp.addEventListener('change', ()=>{
      S.params[f.k] = inp.checked; syncMode(f.k); markDirty(); schedule();
    });
    wrap.appendChild(sw);
    const u = document.createElement('span'); u.className='u'; u.textContent = f.u||''; wrap.appendChild(u);
    return wrap;
  }

  const inp = document.createElement('input');
  inp.type='number'; inp.step = f.step; inp.min = f.min; inp.max = f.max;
  inp.value = S.params[f.k];
  inp.id = 'in_'+f.k;
  inp.addEventListener('input', ()=>{
    const raw = inp.value.trim();
    const v = Number(raw);
    if(raw==='' || !isFinite(v) || v<f.min || v>f.max){
      inp.classList.add('bad'); S.bad.add(f.k);
    }else{
      inp.classList.remove('bad'); S.bad.delete(f.k);
      S.params[f.k] = v; markDirty(); schedule();
    }
    updateBadPill();
  });
  inp.addEventListener('blur', ()=>{
    if(!inp.classList.contains('bad')) inp.value = S.params[f.k];
  });
  wrap.appendChild(inp);
  const u = document.createElement('span'); u.className='u'; u.textContent = f.u||''; wrap.appendChild(u);
  return wrap;
}

function shortKey(k){
  if(k.startsWith('x_')||k.startsWith('y_')) return k.slice(2);
  return k;
}

function applyMaterial(key){
  const m = CONFIG.materials[key]; if(!m) return;
  S.params.x_f = m.f; S.params.y_f = m.f; S.params.p_allow = m.pAllow;
  ['x_f','y_f','p_allow'].forEach(k=>{ const el = $('in_'+k); if(el) el.value = S.params[k]; });
  toast(t('o.wheel_mat.'+key)+' → f='+m.f+' / p_allow='+m.pAllow+' MPa');
}

function syncMode(which){
  const R = S.res; if(!R) return;
  if(which==='x_iauto'||which==='y_iauto'){
    const side = which[0];
    if(S.params[side+'_iauto']){
      S.params[side+'_i'] = Math.round(R.travel[side].i*1000)/1000;
    }else{
      S.params[side+'_v'] = Math.round(R.travel[side].vEff*1000)/1000;
    }
  }
  if(which==='lift_mode'){
    S.params.m_lift = Math.round(R.lift.mLift*10)/10;
  }
}

/** 只读/回填字段：自动减速比 → i 只读；自动顶升质量 → m_lift 只读 */
function syncComputed(){
  const R = S.res; if(!R) return;
  [['x','x_i','x_v'],['y','y_i','y_v']].forEach(([side,ik,vk])=>{
    const iEl = $('in_'+ik), vEl = $('in_'+vk);
    if(!iEl||!vEl) return;
    if(S.params[side+'_iauto']){
      iEl.disabled = true; iEl.value = R.travel[side].i.toFixed(3);
      vEl.disabled = false; vEl.value = S.params[vk];
    }else{
      iEl.disabled = false; iEl.value = S.params[ik];
      vEl.disabled = true; vEl.value = R.travel[side].vEff.toFixed(3);
    }
  });
  const ml = $('in_m_lift');
  if(ml){
    if(S.params.lift_mode==='auto'){ ml.disabled = true; ml.value = R.lift.mLift.toFixed(0); }
    else { ml.disabled = false; ml.value = S.params.m_lift; }
  }
}

/* ------------------------------------------------------------------ 计算调度 */
function compute(){
  const t0 = performance.now();
  S.res = Calc.run(S.params);
  renderCards(S.res);
  renderStates(S.res);
  renderDetail(S.res);
  renderChecks(S.res);
  Charts.draw(S.res);
  syncComputed();
  $('calcTime').textContent = (performance.now()-t0).toFixed(1)+' ms';
  const blk = (S.res.status.fail?'bad':(S.res.status.warn?'warn':'ok'));
  $('chartTag').textContent = blk==='ok'?'✓':'!';
}
function schedule(){
  clearTimeout(S.timer);
  S.timer = setTimeout(()=>{ compute(); persistDraft(); }, 250);
}
function persistDraft(){
  clearTimeout(S.draftTimer);
  S.draftTimer = setTimeout(()=>{
    Store.draft = { name:$('schemeName').value, params:S.params, lang:S.lang, at:Date.now() };
  }, 400);
}

    else v = esc(S.params[f.k]);

    ['sw.angle','sw.state','sw.dir','sw.wh','sw.gap'].map(k=>'<th>'+esc(t(k))+'</th>').join('')+
    '</tr></thead><tbody>';
  R.states.forEach(s=>{
    const airborne = s.dir==='x' ? t('sw.why') : t('sw.whx');
    h += '<tr><td>'+s.ang+'°</td><td>'+(s.lift?esc(t('sw.lift1')):esc(t('sw.lift0')))+'</td>'+

  h += '<h2>5. '+esc(t('out.detail'))+'</h2><table class="pr-tbl pr-dt"><thead><tr>'+

/* ------------------------------------------------------------------ 导出 */
function download(name, content, mime){
  const blob = new Blob([content], {type:mime||'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function summaryOf(R){
  const c = {}; R.cards.forEach(x=>c[x.id]=x.val);
  return { mass:c.mass, pm:c.pm, tm:c.tm, ratio:c.ratio, pmax:R.wheel.pMax, qreq:c.battcap,
    hours:c.endurance, kst:c.kst, sbmm:c.brake, status:R.status };
}
function schemeObj(){
  const R = S.res;
  return { id:S.curId||('s'+Date.now()), schema:'fourshuttle', version:CONFIG.version,
    name:$('schemeName').value||'未命名方案', createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(), params:JSON.parse(JSON.stringify(S.params)), summary:summaryOf(R) };
}
function saveScheme(forceNew){
  let name = ($('schemeName').value||'').trim();
  if(!name){ toast(t('msg.noname')); return; }
  const list = Store.list();
  let idx = list.findIndex(s=>s.id===S.curId);
  if(idx>=0 && forceNew){ idx = -1; S.curId = null; }              // 另存为 → 新建条目
  if(idx<0){
    const dup = list.findIndex(s=>s.name===name);
    if(dup>=0){
      if(!forceNew && confirm(t('msg.dup'))){ idx = dup; }          // 覆盖同名
      else { name = name+' (副本)'; }
    }
  }
  if(idx>=0){
    const o = schemeObj(); o.id = list[idx].id; o.createdAt = list[idx].createdAt; o.name = name;
    list[idx] = o;
  }else{
    const o = schemeObj(); o.id = 's'+Date.now()+Math.floor(Math.random()*100); o.name = name;
    list.push(o); S.curId = o.id;
  }
  $('schemeName').value = name;
  Store.saveAll(list);
  S.dirty = false; $('dirty').hidden = true;
  Store.draft = null;
  renderDrawer();
  toast(t('msg.saved'));
}
function exportCsv(){
  const R = S.res; const rows = [];
  rows.push(['#', 'group','item','symbol','formula','substitution','value','unit']);
  R.detail.forEach((d,i)=>rows.push([i+1, d.g, t('d.'+d.id), d.sym, d.formula, d.subst, d.val.toFixed(4), d.u]));
  rows.push([]);
  rows.push(['#','check','status','value','limit','margin %']);
  R.checks.forEach((c,i)=>rows.push([i+1, t('k.'+c.id+'.n'), c.status, c.v.toFixed(3), c.l.toFixed(3), c.pct.toFixed(1)]));
  const csv = '\uFEFF'+rows.map(r=>r.map(x=>{
    const s = String(x===undefined?'':x);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  download(($('schemeName').value||'scheme')+'.csv', csv, 'text/csv;charset=utf-8');
  toast(t('msg.exported'));
}
function importJson(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast(t('msg.badfile')); return; }
  let arr;
  if(Array.isArray(data)) arr = data;
  else if(data && Array.isArray(data.schemes)) arr = data.schemes;
  else if(data && data.params) arr = [data];
  else { toast(t('msg.badfile')); return; }
  const list = Store.list(); let n = 0;
  arr.forEach(o=>{
    if(!o || typeof o!=='object' || !o.params || typeof o.params!=='object') return;
    const p = DEFAULTS();
    FIELDS.forEach(f=>{
      const v = o.params[f.k];
      if(v===undefined) return;
      if(f.type==='bool') p[f.k] = v===true||v==='true';
      else if(f.type==='sel') p[f.k] = String(v);
      else { const num = Number(v); if(isFinite(num)) p[f.k] = Math.min(f.max,Math.max(f.min,num)); }
    });
    let name = String(o.name||'导入方案');
    if(list.some(s=>s.name===name)){
      name = confirm(t('msg.dup')) ? name : name+' (副本)';
      if(list.some(s=>s.name===name)) name = name+' '+new Date().toLocaleTimeString();
    }
    const item = { id:'s'+Date.now()+Math.floor(Math.random()*1000), schema:'fourshuttle',
      version:CONFIG.version, name, createdAt:o.createdAt||new Date().toISOString(),
      updatedAt:new Date().toISOString(), params:p, summary:o.summary||null };
    const i = list.findIndex(s=>s.name===name);
    if(i>=0) list[i] = item; else list.push(item);
    n++;
  });
  if(!n){ toast(t('msg.badfile')); return; }
  Store.saveAll(list); renderDrawer(); toast(t('msg.imported',{n}));
}

/* ------------------------------------------------------------------ 方案抽屉 */
function renderDrawer(){
  const list = Store.list();
  const box = $('schList');
  if(!list.length){ box.innerHTML = '<div class="empty">'+esc(t('drawer.empty'))+'</div>'; return; }
  box.innerHTML = '<div style="font-size:10.5px;color:#8b95a5;margin:0 2px 6px">'+esc(t('drawer.count',{n:list.length}))+'</div>'+
    list.map(s=>{
      const sm = s.summary||{};
      const sb = [
        sm.mass?('M '+smart(sm.mass)+' kg'):'',
        sm.pm?('P '+(sm.pm/1000).toFixed(2)+' kW'):'',
        sm.pmax?('p '+(sm.pmax).toFixed(1)+' MPa'):'',
        sm.status?('✓'+(sm.status.pass||0)+' !'+(sm.status.warn||0)+' ✕'+(sm.status.fail||0)):''
      ].filter(Boolean).join(' · ');
      return '<div class="sch'+(s.id===S.curId?' cur':'')+'" data-id="'+s.id+'">'+
        '<div class="sn">'+esc(s.name)+(s.id===S.curId?'<span class="cur">CURRENT</span>':'')+'</div>'+
        '<div class="sm">'+(s.updatedAt?new Date(s.updatedAt).toLocaleString():'')+'</div>'+
        '<div class="sm">'+esc(sb)+'</div>'+
        '<div class="sb"><button data-op="load">'+esc(t('btn.load'))+'</button>'+
        '<button data-op="copy">'+esc(t('btn.copy'))+'</button>'+
        '<button data-op="rename">'+esc(t('btn.rename'))+'</button>'+
        '<button data-op="del" class="del">'+esc(t('btn.del'))+'</button></div></div>';
    }).join('');
}
function drawerOp(ev){
  const btn = ev.target.closest('button[data-op]'); if(!btn) return;
  const card = btn.closest('.sch'); const id = card.dataset.id;
  const list = Store.list(); const i = list.findIndex(s=>s.id===id); if(i<0) return;
  const op = btn.dataset.op;
  if(op==='load'){
    S.params = Object.assign(DEFAULTS(), list[i].params||{});
    S.curId = id; $('schemeName').value = list[i].name;
    S.dirty = false; $('dirty').hidden = true;
    buildParams(); compute(); renderDrawer(); persistDraft();
    toast(t('msg.loaded'));
  }else if(op==='copy'){
    const o = JSON.parse(JSON.stringify(list[i]));
    o.id = 's'+Date.now(); o.name = list[i].name+' (副本)'; o.updatedAt = new Date().toISOString();
    list.push(o); Store.saveAll(list); renderDrawer(); toast(t('msg.copied'));
  }else if(op==='rename'){
    const n = prompt(t('msg.rename'), list[i].name);
    if(!n || !n.trim()) return;
    list[i].name = n.trim(); Store.saveAll(list); renderDrawer();
    if(S.curId===id) $('schemeName').value = n.trim();
  }else if(op==='del'){
    if(!confirm(t('btn.del')+' "'+list[i].name+'" ?')) return;
    list.splice(i,1); Store.saveAll(list);
    if(S.curId===id){ S.curId=null; }
    renderDrawer(); toast(t('msg.deleted'));
  }
}

    S.curId = null; $('schemeName').value = ex.name[S.lang];
    S.bad.clear();
    buildParams(); compute(); markDirty(); persistDraft();
    toast(t('msg.example',{n:ex.name[S.lang]}));
  });
  $('exampleSel').addEventListener('change', ()=>{});
  document.querySelectorAll('.blk>h3').forEach(h=>{
    h.addEventListener('click', ()=>h.parentNode.classList.toggle('closed'));
  });
  // 悬浮提示
  tipEl = $('tip');
  document.addEventListener('mouseover', e=>{
    const q = e.target.closest('.q');
    if(!q){ return; }
    tipEl.innerHTML = q.dataset.tip||'';
    tipEl.hidden = false;
    const r = q.getBoundingClientRect();
    tipEl.style.left = Math.min(window.innerWidth-310, Math.max(8, r.left-10))+'px';
    tipEl.style.top = Math.min(window.innerHeight-120, r.bottom+6)+'px';
  });
  document.addEventListener('mouseout', e=>{
    if(e.target.closest && e.target.closest('.q')) tipEl.hidden = true;
  });
  window.addEventListener('beforeunload', e=>{
    if(S.dirty){ e.preventDefault(); e.returnValue = t('msg.leave'); return t('msg.leave'); }
  });
}

function applyStaticLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    const a = T[k]; if(a) el.textContent = a[S.lang]||a[0];
  });
  $('uPow').options[0].text = '功率 '+['自动','auto','自動'][S.lang];
  $('uPow').options[1].text = ['kW','kW','kW'][S.lang];
  $('uPow').options[2].text = ['W','W','W'][S.lang];
  $('uForce').options[0].text = '力 '+['自动','auto','自動'][S.lang];
  $('uForce').options[1].text = 'N'; $('uForce').options[2].text = 'kN';
  $('btnExportAll').textContent = t('btn.exportAll');
  $('btnImport2').textContent = t('btn.import');
  $('btnDrawerClose').textContent = t('btn.close');
}

function init(){
  S.lang = Number(localStorage.getItem(Store.LANG)||0);
  if(![0,1,2].includes(S.lang)) S.lang = 0;
  $('langSel').value = String(S.lang);
  document.documentElement.lang = ['zh-CN','en','ja'][S.lang];

  const draft = Store.draft;
  if(draft && draft.params){
    S.params = Object.assign(DEFAULTS(), draft.params);
    $('schemeName').value = draft.name || '未命名方案';
    S.dirty = true; $('dirty').hidden = false;
  }else{
    S.params = DEFAULTS();
  }

  // 示例下拉
  const sel = $('exampleSel');
  EXAMPLES.forEach(e=>{
    const o = document.createElement('option'); o.value = e.key; o.textContent = e.name[S.lang];
    sel.appendChild(o);
  });

  // 参数区下方补一个非法值提示位
  const bp = document.createElement('span');
  bp.id='badPill'; bp.className='pill bad'; bp.hidden=true;
  document.querySelector('.outbar').insertBefore(bp, $('statusSum'));

  applyStaticLang();
  buildParams();
  bindEvents();
  compute();
  renderDrawer();
  buildPrint(S.res);

  // 控制台自检（验收算例）
  const st = Calc.selfTest();
  const bad = st.filter(x=>!x.ok);
  if(bad.length){ console.warn('[selfTest] 验收算例偏差超限', bad); }
  else { console.info('[selfTest] 验收算例全部通过（偏差<2%）', st.map(x=>x.k+'='+x.got.toFixed(2))); }
  window.__selfTest = st;
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
/* ===== [APP:END] ===== */
</script>
</body>
</html>
